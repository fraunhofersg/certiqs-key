# The optical_bb84 instance as a protocol document: the packaged template.
#
# It IS the instance: instances/optical_bb84/surface.py loads it. Its
# descriptor, parameter table, presets, default_config, lowered receiver and
# reduction requests, preparation and run records are held equal by the
# equivalence gate (tests/integration/test_declared_equivalence.py). The receiver is
# written out as the C1-C3 element graph of catalogue components; the
# parameters `route` and `acceptance_map` switch the reduction and the
# acceptance map.
#
# PACKAGED, so it may write the instance's own identity strings: the id
# optical_bb84, its readme, the record_label optical_bb84 (the instance its
# honest-model note records) and the station's declared_by,
# instances.optical_bb84.declare. Only a document loaded from
# instances/<id>/protocol.yaml is packaged (instances.declared.load_packaged),
# and only a packaged document is bounded by its own parameter domains alone:
# a custom copy is also held to the work bounds of
# instances/declared/limits.py (a photon cutoff of at most 7, among others).
#
# TO START A CUSTOM PROTOCOL FROM IT (the MCP server serves it as
# get_reference("template", name="optical_bb84")): copy it, give identity a
# new id, title and summary, delete identity.readme, identity.record_label and
# stations[0].declared_by, edit what differs, and check it with
# describe_instance(document=...). The format guide is
# instances/declared/README.md.
format: certiqs-key/protocol-document
format_version: '1'
identity:
  id: optical_bb84
  title: Optical BB84 with a characterized receiver
  summary: BB84 with passive basis choice, a characterized optical receiver and threshold
    detectors. Configure component losses, efficiencies and dark counts, then select
    a photon cutoff, flag-state reduction route and acceptance map. The honest channel
    models a single photon with loss and depolarization; results carry the declared
    device assumptions.
  readme: instances/optical_bb84/README.md
  record_label: optical_bb84
parameters:
  model_absent: refuse
  device_absent: default
  table:
  - name: qber
    section: model
    kind: fraction
    quantity: probability
    default: 0
    domain:
      form: interval
      lower: 0
      upper: 1/2
      upper_open: true
    snapped: false
    meaning: Error rate Q of the honest depolarizing channel in either basis; a model
      input, not an observed rate
  - name: transmittance
    section: model
    kind: fraction
    quantity: transmittance
    default: 1
    domain:
      form: interval
      lower: 0
      upper: 1
    snapped: false
    meaning: Probability that the photon reaches Bob's receiver; at 0 Bob clicks only
      on dark counts
  - name: basis_split
    section: device
    kind: fraction
    quantity: probability
    default: 1/2
    domain:
      form: interval
      lower: 0
      upper: 1
    snapped: true
    meaning: Transmittance of the receiver's basis beamsplitter, which is the probability
      that a photon is measured in the Z basis
  - name: half_wave_angle
    section: device
    kind: fraction
    quantity: angle_pi
    unit: pi
    default: 1/8
    domain:
      form: interval
      lower: 0
      upper: 1
    snapped: true
    meaning: Angle of the half-wave plate in the receiver's X arm, in units of pi;
      1/8 (22.5 degrees) measures the diagonal basis
  - name: pbs_leak_transmitted
    section: device
    kind: fraction
    quantity: probability
    default: 0
    domain:
      form: interval
      lower: 0
      upper: 1/2
    snapped: true
    meaning: Fraction of the vertical polarization each polarizing beamsplitter
      transmits instead of reflecting; it clicks the transmitted-path detector (H, or D
      behind the plate), which watches both polarizations of its path; 0 is perfect
      separation, 1/2 is none
  - name: pbs_leak_reflected
    section: device
    kind: fraction
    quantity: probability
    default: 0
    domain:
      form: interval
      lower: 0
      upper: 1/2
    snapped: true
    meaning: Fraction of the horizontal polarization each polarizing beamsplitter
      reflects instead of transmitting; it clicks the reflected-path detector (V, or A
      behind the plate), which watches both polarizations of its path; 0 is perfect
      separation, 1/2 is none
  - name: efficiency
    section: device
    kind: per_port_fraction
    quantity: efficiency
    default: 1
    domain:
      form: interval
      lower: 0
      upper: 1
    snapped: true
    meaning: Detection efficiency of each of the receiver's four detectors
    per_port_of: bob
  - name: dark_count
    section: device
    kind: per_port_fraction
    quantity: probability
    default: 0
    domain:
      form: interval
      lower: 0
      upper: 1
    snapped: true
    meaning: Dark-click probability per round of each of the receiver's four detectors
    per_port_of: bob
  - name: photon_cutoff
    section: device
    kind: int
    quantity: photon_number
    default: 1
    domain:
      form: interval
      lower: 0
      upper: 16
    snapped: false
    meaning: 'Photon cutoff N of the receiver: photon numbers up to N are modelled
      exactly and higher ones are bounded'
  - name: exact_window
    section: device
    kind: int
    quantity: photon_number
    domain:
      form: interval
      lower: 1
      upper: 17
    snapped: false
    meaning: 'Exact-window depth m* of the receiver: photon numbers N+1 to m* are
      evaluated exactly when bounding the high-photon part; must exceed N, and empty
      leaves only the analytic bound'
  - name: efficiency_normalization
    section: device
    kind: fraction
    quantity: transmittance
    domain:
      form: interval
      lower: 0
      upper: 1
      lower_open: true
    snapped: false
    meaning: 'Factored loss t: the detector efficiencies are divided by t and the
      common loss t is moved into the channel, which leaves the observed statistics
      unchanged; between the largest efficiency and 1, where 1 turns it off, and
      empty uses the largest efficiency divided by 99/100, or 1 where that
      efficiency is at least 99/100'
  - name: route
    section: device
    kind: choice
    quantity: choice
    default: encoded
    domain:
      form: choices
      options:
      - value: encoded
        meaning: Weight-preserving flag reduction, no constraints
      - value: licensed
        meaning: Flag reduction with a multi-click constraint
      - value: licensed+two-sector
        meaning: As licensed, plus a stronger within-cutoff constraint
    snapped: false
    meaning: Photon-number reduction of the receiver, mapping any number of incoming
      photons to a finite system; the physics is the same on every route
  - name: acceptance_map
    section: device
    kind: choice
    quantity: choice
    default: merged-discard
    domain:
      form: choices
      options:
      - value: merged-discard
        meaning: No click, multi-click and basis mismatch share one value
      - value: announcement-resolved
        meaning: No click, multi-click and basis mismatch kept separate
      - value: pair-resolved
        meaning: Every announcement pair its own value
    snapped: false
    meaning: How finely the public announcements are grouped into the statistics the
      protocol checks; the physics is the same under every map
snap:
  lattice_exponent: 40
run_defaults:
  rounds: 10000
  completeness_budget: 1/1000000
  declared_tolerance: 1e-12
  parameters: {alpha: 1.05, eps_pa: 2^-30, eps_ev: 2^-30, lambda_ec: 0}
  device: {acceptance_map: announcement-resolved}
  sections: replace
  derived: {exact_window: photon_cutoff + 1}
  derived_timing: base_only
alphabets:
  signal: {product: {dims: {basis: [Z, X], bit: [0, 1]}, label: "({basis},{bit})"}}
  ann:
    union:
      - {enum: [{label: Z, basis: Z}]}
      - {product: {dims: {bit: [0, 1]}, label: "(X,{bit})"}, attrs: {basis: X}}
source:
  kind: trusted_ensemble
  alphabet: signal
  alice_dim: 2
  transmitted_dim: 2
  weights: {"(Z,0)": 1/4, "(Z,1)": 1/4, "(X,0)": 1/4, "(X,1)": 1/4}
  states:
    (Z,0): {matrix: [[1, 0], [0, 0]]}
    (Z,1): {matrix: [[0, 0], [0, 1]]}
    (X,0): {matrix: [[1/2, 1/2], [1/2, 1/2]]}
    (X,1): {matrix: [[1/2, -1/2], [-1/2, 1/2]]}
  alice:
    choice_family:
      choices: [Z, X]
      weights: {Z: 1/2, X: 1/2}
      conditional_alphabets: {Z: [0, 1], X: [0, 1]}
      conditional_elements: conjugate_states
      joint_label: "({choice},{outcome})"
  alice_marginal: {scale: {factor: 1/2, of: {identity: 2}}}
  certificate:
    form: pure
    psi: {outer: {vector: [1, 0, 0, 1], squared_norm: 2}}
    virtual_dim: 2
stations:
  - id: bob
    party: B
    declared_by: instances.optical_bb84.declare
    measurement:
      kind: optical
      modes:
        - {path: Z, polarization: H}
        - {path: Z, polarization: V}
        - {path: X, polarization: H}
        - {path: X, polarization: V}
        - {path: Zr, polarization: H}
        - {path: Zr, polarization: V}
        - {path: Xr, polarization: H}
        - {path: Xr, polarization: V}
      channel_modes: [Z_H, Z_V]
      route: element_graph
      elements:
        - name: bs
          component: beamsplitter
          params: {transmittance: {param: basis_split}, phase_pi: 0, loss_1: 0, loss_2: 0}
          support: [Z_H, Z_V, X_H, X_V]
        - name: hwp
          component: half_wave
          params: {angle_pi: {param: half_wave_angle}, loss: 0}
          support: [X_H, X_V]
        - name: pbs_z
          component: polarizing_beamsplitter
          params:
            transmittance_h: {expr: 1 - pbs_leak_reflected}
            transmittance_v: {param: pbs_leak_transmitted}
            phase_h_pi: 0
            phase_v_pi: 0
            loss_1: 0
            loss_2: 0
          support: [Z_H, Z_V, Zr_H, Zr_V]
        - name: pbs_x
          component: polarizing_beamsplitter
          params:
            transmittance_h: {expr: 1 - pbs_leak_reflected}
            transmittance_v: {param: pbs_leak_transmitted}
            phase_h_pi: 0
            phase_v_pi: 0
            loss_1: 0
            loss_2: 0
          support: [X_H, X_V, Xr_H, Xr_V]
      edges: [[bs, hwp], [bs, pbs_z], [hwp, pbs_x]]
      ports:
        - {label: H, modes: [Z_H, Z_V]}
        - {label: V, modes: [Zr_H, Zr_V]}
        - {label: D, modes: [X_H, X_V]}
        - {label: A, modes: [Xr_H, Xr_V]}
      detectors:
        - {port: H, efficiency: {param: efficiency, port: H}, dark_count: {param: dark_count, port: H}}
        - {port: V, efficiency: {param: efficiency, port: V}, dark_count: {param: dark_count, port: V}}
        - {port: D, efficiency: {param: efficiency, port: D}, dark_count: {param: dark_count, port: D}}
        - {port: A, efficiency: {param: efficiency, port: A}, dark_count: {param: dark_count, port: A}}
      coarse_graining:
        letters:
          - {label: nc, class: nc}
          - {label: H, class: Z, basis: Z, bit: 0}
          - {label: V, class: Z, basis: Z, bit: 1}
          - {label: D, class: X, basis: X, bit: 0}
          - {label: A, class: X, basis: X, bit: 1}
          - {label: mc, class: mc}
        map:
          - {when: {count: "0"}, value: nc}
          - {when: {count: "1"}, value: "{port}"}
          - {value: mc}
      photon_cutoff: {param: photon_cutoff}
      exact_window: {param: exact_window}
      efficiency_normalization: {param: efficiency_normalization}
    reduction:
      switch: route
      cases:
        encoded: {links: [{kind: wpfss}], route: encoded}
        licensed: {links: [{kind: fss}], route: licensed}
        licensed+two-sector:
          links: [{kind: fss}]
          route: licensed
          carried_operators: [{library: two_sector_floor}]
public:
  partition: default
  announcements:
    switch: acceptance_map
    cases:
      merged-discard:
        alice: {alphabet: ann, map: [{when: {x.basis: Z}, value: Z}, {value: "(X,{x.bit})"}]}
        bob:
          alphabet: {union: [ann, {enum: [disc]}]}
          map:
            - {when: {v.class: Z}, value: Z}
            - {when: {v.class: X}, value: "(X,{v.bit})"}
            - {value: disc}
    default:
      alice: {alphabet: ann, map: [{when: {x.basis: Z}, value: Z}, {value: "(X,{x.bit})"}]}
      bob:
        alphabet: {union: [ann, {enum: [nc, mc]}]}
        map:
          - {when: {v.class: Z}, value: Z}
          - {when: {v.class: X}, value: "(X,{v.bit})"}
          - {value: "{v.letter}"}
  sifting: [{when: {A: Z, B: Z}, value: pass}, {value: fail}]
  key: {holder: A, alphabet: [0, 1], rule: [{value: {int: o.bit}}]}
  acceptance:
    switch: acceptance_map
    cases:
      merged-discard:
        alphabet: [gen, ok, err, disc]
        map:
          - {when: {A: Z, B: Z}, value: gen}
          - {when: {A.basis: X, B.basis: X, A.bit: {eq: B.bit}}, value: ok}
          - {when: {A.basis: X, B.basis: X}, value: err}
          - {value: disc}
      announcement-resolved:
        alphabet: [gen, ok, err, mis, nc, mc]
        map:
          - {when: {A: Z, B: Z}, value: gen}
          - {when: {A.basis: X, B.basis: X, A.bit: {eq: B.bit}}, value: ok}
          - {when: {A.basis: X, B.basis: X}, value: err}
          - {when: {B: [nc, mc]}, value: "{B}"}
          - {value: mis}
      pair-resolved:
        map: [{value: "{A}|{B}"}]
honest:
  library: single_photon_loss_depolarizing
  bind: {qber: {param: qber}, transmittance: {param: transmittance}}
channel_interface: {variant: single_photon}
