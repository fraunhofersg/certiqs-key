# A whole custom document: qubit BB84 with conjugate states, written by hand.
# The schema tests read it for its shape (the models, the
# generated JSON Schema, the reference checks, the canonical round trip) and
# the lowering tests lower it. Decimals are unquoted on purpose: the canonical
# tree keeps them as their text.
format: certiqs-key/protocol-document
format_version: "1"
identity:
  id: custom_qubit_bb84
  title: A custom qubit BB84
  summary: Trusted-source BB84 with a declared qubit measurement, as a document.
parameters:
  table:
    - name: qber
      section: model
      kind: fraction
      quantity: probability
      default: 0
      domain: {form: interval, lower: 0, upper: 1/2, upper_open: true}
      snapped: false
      meaning: Error rate Q of the honest depolarizing channel in either basis
    - name: alice_z
      section: device
      kind: fraction
      quantity: probability
      default: 0.5
      domain: {form: interval, lower: 0, upper: 1, lower_open: true, upper_open: true}
      snapped: false
      meaning: Probability that Alice prepares in the Z basis
    - name: alice_x
      section: device
      kind: fraction
      quantity: probability
      default: 0.5
      domain: {form: interval, lower: 0, upper: 1, lower_open: true, upper_open: true}
      snapped: false
      meaning: Probability that Alice prepares in the X basis
    - name: bob_z
      section: device
      kind: fraction
      quantity: probability
      default: 1/2
      domain: {form: interval, lower: 0, upper: 1, lower_open: true, upper_open: true}
      snapped: false
      meaning: Probability that Bob measures in the Z basis
    - name: bob_x
      section: device
      kind: fraction
      quantity: probability
      default: 1/2
      domain: {form: interval, lower: 0, upper: 1, lower_open: true, upper_open: true}
      snapped: false
      meaning: Probability that Bob measures in the X basis
    - name: acceptance_map
      section: device
      kind: choice
      quantity: choice
      default: resolved
      domain:
        form: choices
        options:
          - {value: resolved, meaning: ok and err kept apart}
          - {value: merged, meaning: one test value}
      snapped: false
      meaning: How finely the test rounds are grouped
presets:
  - name: asymmetric
    note: Alice prefers Z.
    device: {alice_z: 3/4, alice_x: 1/4}
snap:
  lattice_exponent: 40
  groups: [[alice_z, alice_x], [bob_z, bob_x]]
run_defaults:
  rounds: 10000
  completeness_budget: 1/1000000
  declared_tolerance: 0
  parameters: {alpha: 1.5, eps_pa: 2^-30, eps_ev: 2^-30, lambda_ec: 0}
alphabets:
  signal: {product: {dims: {basis: [Z, X], bit: [0, 1]}, label: "({basis},{bit})"}}
  ann:
    union:
      - {enum: [{label: Z, basis: Z}]}
      - {product: {dims: {bit: [0, 1]}, label: "(X,{bit})"}, attrs: {basis: X}}
source:
  kind: trusted_ensemble
  alphabet: signal
  alice_dim: 2
  transmitted_dim: 2
  weights:
    (Z,0): {expr: alice_z / 2}
    (Z,1): {expr: alice_z / 2}
    (X,0): {expr: alice_x / 2}
    (X,1): {expr: alice_x / 2}
  states:
    (Z,0): {matrix: [[1, 0], [0, 0]]}
    (Z,1): {matrix: [[0, 0], [0, 1]]}
    (X,0): {matrix: [[1/2, 1/2], [1/2, 1/2]]}
    (X,1): {matrix: [[1/2, -1/2], [-1/2, 1/2]]}
  alice:
    choice_family:
      choices: [Z, X]
      weights: {Z: {param: alice_z}, X: {param: alice_x}}
      conditional_alphabets: {Z: [0, 1], X: [0, 1]}
      conditional_elements: conjugate_states
      joint_label: "({choice},{outcome})"
  alice_marginal: {scale: {factor: 1/2, of: {identity: 2}}}
  certificate:
    form: pure
    psi: {outer: {vector: [1, 0, 0, 1], squared_norm: 2}}
    virtual_dim: 2
stations:
  - id: bob
    party: B
    measurement:
      kind: declared_povm
      dimension: 2
      choice_family:
        choices: [Z, X]
        weights: {Z: {param: bob_z}, X: {param: bob_x}}
        conditional_alphabets: {Z: [0, 1], X: [0, 1]}
        conditional_elements:
          Z: {"0": {matrix: [[1, 0], [0, 0]]}, "1": {matrix: [[0, 0], [0, 1]]}}
          X:
            "0": {matrix: [[1/2, 1/2], [1/2, 1/2]]}
            "1": {matrix: [[1/2, -1/2], [-1/2, 1/2]]}
        joint_label: "({choice},{outcome})"
    reduction: {links: [{kind: identity}]}
public:
  partition: default
  announcements:
    alice: {alphabet: ann, map: [{when: {x.basis: Z}, value: Z}, {value: "(X,{x.bit})"}]}
    bob: {alphabet: ann, map: [{when: {v.choice: Z}, value: Z}, {value: "(X,{v.outcome})"}]}
  sifting: [{when: {A: Z, B: Z}, value: pass}, {value: fail}]
  key: {holder: A, alphabet: [0, 1], rule: [{value: {int: o.bit}}]}
  acceptance:
    switch: acceptance_map
    cases:
      resolved:
        alphabet: [gen, ok, err, disc]
        map:
          - {when: {A: Z, B: Z}, value: gen}
          - {when: {A.basis: X, B.basis: X, A.bit: {eq: B.bit}}, value: ok}
          - {when: {A.basis: X, B.basis: X}, value: err}
          - {value: disc}
      merged:
        map:
          - {when: {A: Z, B: Z}, value: gen}
          - {when: {A.basis: X, B.basis: X}, value: test}
          - {value: disc}
honest:
  library: depolarized_bell_pair
  bind: {qber: {param: qber}}
channel_interface: {variant: qubit_identity}
annotations:
  stations/bob: {colour: teal, note: anything at all, never read}
