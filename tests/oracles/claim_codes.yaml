# The oracle claim codes, and the claims of this repository that carry
# each one's mathematics.
#
# WHAT THIS FILE IS. The frozen oracle registries beside it pin claims by
# oracle codes, in their
# `claims` and `supports` fields: C1-C22 of meat-core, PC1-PC12 of
# protocol-compiler, RC1-RC12 of receiver-povm, PR1-PR13 of proof-reductions
# and SA1-SA9 of statistics-acceptance. This file maps each code to full claim
# ids (`<module>/<label>` or `<module>/<submodule>/<label>`) and names the
# owner of every registry file. It is the one place the two vocabularies meet;
# the interface tests read it through claim_codes.py, and test_claim_codes.py
# checks it against the registries and the claim files.
#
# WHY IT EXISTS. A frozen registry is never edited (PRINCIPLES.md section 2.3),
# so its codes stay. The contracts do not carry them: a claim is named by its
# id (spec/claim-format.md). The correspondence was harvested from the
# interface tests' own tables, the claim titles, the `origin` header fields and
# running text.
#
# NEVER REGENERATED FROM CODE. Every entry is transcribed by hand from the
# evidence its section names, and a change to it is a reviewed edit that names
# its evidence. harness/relabel.py keeps the ids current: it rewrites every
# full id in every file under tests/, which is why every id here is a full id
# and never a bare label.
#
# THE SECTIONS. `registries`: each registry file and what it moves with.
# `codes`: a code and the claims that carry it. `no_claim`: a code that
# resolves to no claim of any module, with the ground. `unresolved`: a code
# the evidence does not settle, with the candidate claims and the evidence,
# never a guess. `titles`: every claim whose title began with a code before
# the codes were taken out of them, with the code as the title spelled it
# (sub-parts such as C10d included); a record of the titles, pinned by no registry.
# Keys in natural order (letters, then number, then suffix; ids alphabetical).
#
# NOT CLAIM CODES, though they look like them: the receiver's catalogue entry
# types C1-C10 (registry_receiver_povm.py, CATALOGUE_IDS and entry_id), the
# compiler's validator conditions C1-C5 (registry_protocol_compiler.py,
# verdicts and failing_condition) and the weight-route case ids RC2 and RC3
# of registry_reductions.py. No registry pins a claim with them.

# What each registry file moves with: a core of spec/modules.yaml, or, for an
# instance's registry, the instance directory (an instance is data and no
# claim, PRINCIPLES.md section 5). registry_per_setting_floors.py pins claims
# of two cores (groups PSF-A and PSF-B the reductions submodule wpfss, and the
# receiver's slot) and names both, as does registry_per_setting_floors_probe.py,
# its group PSF-C (the receiver) cut from it with every group's oracle entries.
registries:
  tests/oracles/registry.py: meat-core
  tests/oracles/registry_efficiency_normalization.py: [receiver, reductions]
  tests/oracles/registry_instances_bb84.py: instances/bb84
  tests/oracles/registry_instances_bbm92.py: instances/bbm92
  tests/oracles/registry_instances_decoy_bb84.py: instances/decoy_bb84
  tests/oracles/registry_per_setting_floors.py: [receiver, reductions]
  tests/oracles/registry_per_setting_floors_probe.py: [receiver, reductions]
  tests/oracles/registry_protocol_compiler.py: protocol-compiler
  tests/oracles/registry_receiver_povm.py: receiver
  tests/oracles/registry_reductions.py: reductions
  tests/oracles/registry_statistics_acceptance.py: statistics
  tests/oracles/registry_statistics_rules.py: statistics
  tests/oracles/registry_transmitter.py: transmitter
  tests/oracles/registry_transmitter_c1.py: transmitter

