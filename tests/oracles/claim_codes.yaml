unresolved:
  PR1:
    candidates: [reductions/lem:sep, reductions/def:squashing, reductions/lem:statistics, reductions/rem:dictionary, reductions/cor:pullback, reductions/rem:notchannel]
    evidence: >-
      No title or `origin` carries PR1. It was a section of the original
      contract, and these six of its claims are in the core (fact:sep as
      lem:sep).
      spec/modules.yaml reads "PR1-PR3 squashing relation, security transfer,
      reachable states and sound constraints", and the frozen group PR-A of
      registry_reductions.py pins "the WP3 relation", the pulled-back POVM,
      statistics equality and the uniqueness of the adjoint. No source says
      which of the six carry the code.
  PR4:
    candidates: [reductions/prop:preorder, reductions/cor:monotone, reductions/lem:linear, reductions/rem:intertwining, reductions/prop:pinching, reductions/cor:blockdiag, reductions/prop:tensor, reductions/lem:obstructions, reductions/rem:obstructiondecide]
    evidence: >-
      No title or `origin` carries PR4. It was a section of the original
      contract, and these nine of its claims are in the core. spec/modules.yaml reads
      "PR4-PR5 the calculus (pre-order, linearity, pinching, tensor), the
      branching rule and the master lemma", and the frozen group PR-D of
      registry_reductions.py pins post-processing by a column-stochastic
      matrix, the joint alphabet with a private setting, pinching and both
      legs of lem:obstructions. No source says which of the nine carry the
      code.
  PR5:
    candidates: [reductions/lem:top, reductions/lem:master, reductions/rem:reading-master, reductions/rem:master-scope, reductions/cor:instances, reductions/prop:common]
    evidence: >-
      No title or `origin` carries PR5. It was a section of the original
      contract, and these six of its claims are in the core. spec/modules.yaml reads
      "PR4-PR5 ... the branching rule and the master lemma", and the frozen
      group PR-E of registry_reductions.py pins the two-branch instrument,
      the branch-weight constraint in its operator and scalar forms, and the
      flag PVM as top element. No source says which of the six carry the
      code.

