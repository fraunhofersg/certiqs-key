  C8: [meat-core/def:feasible, meat-core/thm:reduction, meat-core/cor:reduction-constrained]
  C9a: [foundations/fact:concavity, meat-core/cor:concavity]
  C9b: [foundations/lem:kernel, meat-core/thm:convexity]
  C10: [meat-core/def:classes, meat-core/thm:removal, meat-core/prop:retention, meat-core/prop:no-averaging]
  C11: [meat-core/lem:choi-marginal, meat-core/thm:choi]
  C12: [meat-core/lem:dk, meat-core/thm:gradient, meat-core/cor:full-gradient]
  C14: [meat-core/thm:keylength]
  C15: [meat-core/prop:monotone, meat-core/cor:keylength-bound]
  C16: [meat-core/lem:b-derivative, meat-core/thm:oracle]
  C17: [meat-core/thm:constrained-accumulation, meat-core/cor:constrained-key-length]
  C21: [meat-core/lem:cone-concavity, meat-core/prop:optol-nobound, meat-core/rem:optol-direction]
  C22: [meat-core/frank-wolfe/lem:fo-face, meat-core/frank-wolfe/lem:fo-khyp, meat-core/frank-wolfe/thm:firstorder, meat-core/frank-wolfe/cor:fo-keylength]

  # protocol-compiler, PC1-PC12. PC1-PC9 are transcribed from
  # WHERE_EACH_LABEL_WENT, the table of test_protocol_compiler_registry_interface.py.
  # PC10 and PC11 belong to transmitter: the frozen header of registry_transmitter.py states the split
  # ("PC10 -> transmitter/fact:sr and rem:import; PC11 -> transmitter/def:srcert,
  # thm:pc11, rem:xreg, rem:boundary and cor:noncanonical"), and the titles of
  # fact:sr ("PC10: ...") and thm:pc11 ("PC11: ...") agree. PC12 is under no_claim.
  PC1: [protocol-compiler/def:compile, protocol-compiler/thm:typing]
  PC2: [protocol-compiler/thm:measurements-and-statistics, protocol-compiler/def:phi]
  PC3: [protocol-compiler/def:weighted, protocol-compiler/lem:weighted, protocol-compiler/thm:choice-encoding]
  PC4: [protocol-compiler/thm:sifting-and-key]
  PC5: [protocol-compiler/thm:feasibility, protocol-compiler/def:feasible]
  PC6: [protocol-compiler/def:validator, protocol-compiler/thm:validator-soundness]
  PC7: [protocol-compiler/def:chaincond, protocol-compiler/thm:chain-consumption]
  PC8: [protocol-compiler/def:banda, protocol-compiler/thm:band-a]
  PC9: [protocol-compiler/def:eligible, protocol-compiler/thm:gates]
  PC10: [transmitter/fact:sr, transmitter/rem:import]
  PC11: [transmitter/def:srcert, transmitter/thm:certificate-sufficiency, transmitter/rem:xreg, transmitter/rem:boundary, transmitter/cor:noncanonical]

  # reductions, PR1-PR13. Each was a SECTION of the original contract, of
  # several claims, listed below as the code's candidates. Listed is the
  # claim whose title carried the code ("PR2: ..."), PR6 having two. PR7 has no
  # such title: it is the corollary that spec/modules.yaml ("PR7 flags are
  # enough (a calculus lemma)") and the frozen group PR-G of
  # registry_reductions.py ("flags are enough on the zero-weight block") name,
  # titled "Flags are enough". PR1, PR4 and PR5 are unresolved.
  PR2: [reductions/thm:factorization]
  PR3: [reductions/thm:transfer]
  PR6: [reductions/wpfss/prop:chain, reductions/wpfss/prop:route]
  PR7: [reductions/cor:flagsenough]
  PR8: [reductions/thm:mixture]
  PR10: [reductions/prop:obstruction]
  PR11: [reductions/thm:licence]
  PR12: [reductions/thm:chain]
  PR13: [reductions/thm:emit]

  # receiver, RC1-RC12, the rows of the original claims table. Each code
  # is the claims whose original label, recorded in the claim's `origin`,
  # carries it (lem:fock-functor, thm:multiclick-bound, thm:conditional-povm, ...), in contract
  # order. RC10 is also receiver/lem:deficiency, whose `origin` records it as
  # "thm:efficiency (v) and the part (v) of its proof ... moved into the core".
  RC1: [receiver/prop:mode-algebra, receiver/lem:fock-functor, receiver/lem:fock-block-spectrum, receiver/lem:fock-monotone]
  RC2: [receiver/thm:compilation-well-defined]
  RC3: [receiver/component-catalogue/thm:catalogue-admissibility]
  RC4: [receiver/thm:port-grams]
  RC5: [receiver/thm:representation-independence]
  RC6: [receiver/thm:click-povm]
  RC7: [receiver/thm:coarse-graining]
  RC8: [receiver/thm:multiclick-bound, receiver/thm:emitted-bound]
  RC9: [receiver/thm:exact-and-evaluated]
  RC10: [receiver/detector-imperfections/thm:efficiency, receiver/lem:deficiency]
  RC11: [receiver/detector-imperfections/thm:dark-counts]
  RC12: [receiver/probe-conditioning/thm:conditional-povm, receiver/probe-conditioning/thm:gaussian-schur, receiver/probe-conditioning/thm:channel-block-diagonal]

  # statistics, SA1-SA9. Transcribed from CLAIM_LABELS, the table of
  # test_statistics_acceptance_registry_interface.py. SA3 is split into the exact rule's proposition and the
  # rule-independent guard, and the registry's SA3 entries pin values of both.
  SA1: [statistics/thm:geometry-validation]
  SA2: [statistics/thm:binomial-tails]
  SA3: [statistics/binomial-box/prop:rule-exact, statistics/binomial-box/lem:guard]
  SA4: [statistics/binomial-box/thm:box-construction]
  SA5: [statistics/binomial-box/thm:completeness-bound]
  SA6: [statistics/binomial-box/thm:honest-containment]
  SA7: [statistics/binomial-box/thm:monotonicity-limits]
  SA8: [statistics/thm:box-oracle]
  SA9: [statistics/singleton/thm:singleton-completeness]

