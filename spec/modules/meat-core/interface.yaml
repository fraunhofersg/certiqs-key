# spec/modules/meat-core/interface.yaml -- the MEAT key-rate engine's
# interface: inputs, outputs, parameters, conventions, the declared numerical
# thresholds, the refusal rules, the refusal vocabulary, the
# consumer-agreement record and the assumption ledger
# (spec/claim-format.md section 5). The claim files under claims/ and
# frank-wolfe/claims/ are the contract; this file states no mathematics of
# its own and repeats none. The submodule's own rows are
# spec/modules/meat-core/frank-wolfe/interface.yaml; that file adds rows to
# the tables here and changes none of them, and this file adds nothing to
# its rows. The claims of the module, with their kinds and statuses, are
# listed by `python -m harness.check_claims --module meat-core --status`.
#
# Machine keys and refusal spellings are binding for the implementation.
# Where this file and a claim disagree, the claim decides.
# Where this file fixes something no claim states -- an emitted record, a
# presence rule, a key name -- the row says so under `fixed_here`, and
# `fixed_by_this_file` at the end lists those rows.
#
# Every row names, in a `locator` or `fixed_by` field, the claims it rests
# on. A bare label is this module's; a label carrying a module prefix is that
# module's. No row carries a third assurance tier (PRINCIPLES.md section 10).
#
# Five structural facts shape the rows, and each row that rests on one names
# its claim:
#   The solver is a submodule. The Frank-Wolfe bound, its verified feasible
#      side and its windows are frank-wolfe's; the core carries the two claims
#      lem:estimate and cor:keylength-bound, at which any solver submodule
#      docks (`submodules_today`).
#   There is no tolerance. This module has no tolerance input, no tolerance
#      assumption, no tolerance report and no threshold decided at a declared
#      tolerance. Declared data is exactly admissible or refused
#      (req:exact-admission, reading def:declaration's exact-admissibility
#      paragraph; protocol-compiler/def:exact, mentioned), and
#      prop:optol-nobound is the reason no tolerance could license a
#      key-length claim.
#   The declaration twins are the compiler's. def:declaration, def:feasible
#      and def:homog use the compiler's definitions of the same names and
#      keep only what this module adds. The other counterparts (def:admissible-declaration
#      against the compiler's def:target, the edge on def:declaration's
#      lead-in; the exact-admissibility paragraph against its def:exact;
#      def:roundmodel against reductions') keep a mentions edge, and their
#      coincidence is an interface check, recorded in `consumer_agreement`
#      below from the compiler's own record.
#   Assumptions are owned by their suppliers. The ledger's inherited rows
#      carry the owners' short ids and machine keys.
#   The block restriction is no assumption. The compiler states it as a
#      remark (protocol-compiler/rem:block-restriction), thm:reduction step 1
#      proves it, and no ledger carries a row for it.

module_id: meat-core

candidate_search_note: >-
  solve_declaration and solve_general_declaration take a common SearchRequest.
  Candidate search, including the entropy-limit initializer, is assessed by
  the frank-wolfe submodule's original first-order boundary. The result's
  search_report describes search effort independently of the reported tier;
  key assembly reads only the qualifying original bound and existing gates.
  See frank-wolfe/interface.yaml, candidate_search_interface.

# ---------------------------------------------------------------------------
# inputs
#   Every row but `acceptance_set` and `rounds` is read under the compiler's
#   own output key, which is what row (1) of `consumer_agreement` says;
#   `read_under` names that key. The acceptance set is the statistics
#   module's and `rounds` is a run parameter. `source_replacement_license` is
#   the transmitter's record, which the compiler passes on: this module reads
#   only its presence, at its A-SRC gate (req:marginal-licence-gate). A
#   declared tolerance is not an input (`retired_input_rows`).
#
#   The blanket reading, stated once rather than in each row (def:declaration,
#   the exact-admissibility paragraph; req:exact-admission).
#   Representation: a declared operator on Q arrives as the list of its
#   sector blocks together with the declared sector map -- the block kind,
#   the block identifiers and their ordering -- and never as a d_Q x d_Q
#   array; sector-block diagonality is a property of the type and not a
#   measured predicate, and the structural check is the comparison of this
#   module's sector map with the producer's (spec/architecture.md 2.9).
#   Arithmetic: every declared number is a binary64 datum and is the value
#   it declares, with the single exception of the acceptance data, which are
#   exact rationals on the exact island (conventions, `number_model` and
#   `exact_island`). Admission: every declared operator family is exactly
#   admissible or the run is refused -- exactly Hermitian per block, exactly
#   positive semidefinite per block where the family is a POVM or a state (a
#   constraint operator is asked only to be Hermitian), exactly complete,
#   with the declared-order completeness sum rounding nowhere -- and nothing
#   is decided at a window and nothing is repaired here (def:declaration;
#   req:exact-admission; protocol-compiler/def:exact, mentioned and not
#   used). This module declares no numerical tolerance, reads none and emits
#   none.
# ---------------------------------------------------------------------------
inputs:

  - name: alice_dim
    symbol: d_A
    type: int
    presence: always
    domain: "d_A >= 1. At d_A = 1 the two source modes are the same declaration (rem:modes-da1 (b))."
    locator: "def:declaration; def:admissible-declaration (i); rem:modes-da1 (b)"
    read_under: "protocol-compiler `alice_dim`"

  - name: alice_marginal
    symbol: "tau_A, or null"
    type: "matrix on A, or null"
    presence: always
    domain: >-
      The marginal slot, and its two values are the two source modes: a
      density matrix tau_A in S_=(A) is trusted-source mode, the machine
      value null spelling nomarg is untrusted-source mode (def:declaration;
      rem:modes-da1). Hermitian, tau_A >= 0 and tr tau_A = 1, all three
      decided exactly and the trace accumulated over the row index of the
      emitted array without rounding. A singular tau_A is admissible
      (rem:basis-invariance; the support frame of def:support-frame carries
      it); tau_A = 0 is not, its trace being 0, and is not the way to
      express "no marginal" (def:admissible-declaration (ii); rem:modes-da1 (c)). At d_A = 1
      the value [1] in the slot is the transmitter's fill, passed through by
      the compiler, and it is read here as the trusted mode it spells --
      which at d_A = 1 is the same program as the untrusted one
      (prop:trivial-alice-system (i); def:untrusted-choi (d)).
    locator: "protocol-compiler/def:declaration (the marginal slot); def:declaration (its two values as the two source modes); def:admissible-declaration (ii); rem:modes-da1; def:support-frame; lem:choi-marginal; rem:basis-invariance"
    read_under: "protocol-compiler `alice_marginal`"
    the_mode_is_read_off_this_slot_and_off_nothing_else: >-
      `source_model` is derived and is never a second key (conventions,
      `source_model`). Locator: rem:modes-da1; def:declaration.
    what_the_licence_closes: >-
      The presence of the marginal does not depend on the licence record:
      the slot arrives filled or null and this module reads the mode off it,
      while the licence's own row reads the licence's presence only. A
      marginal declared without the licence is admitted, and what the
      licence's absence closes is the key length: this module's A-SRC gate
      refuses a key-length output for a declared tau_A at d_A >= 2 without it
      (req:marginal-licence-gate). The licence is the transmitter's, and the
      compiler consumes it at its gate (G2).

  - name: sector_index_set
    symbol: S
    type: ordered label list
    presence: always
    domain: "|S| >= 1, with the declared total order that indexes every sector-block list and every sum over sectors."
    locator: "def:declaration; def:admissible-declaration (i); def:feasible"
    read_under: "protocol-compiler `sector_index_set`"

  - name: sector_dims
    symbol: "(d_s)_s"
    type: int list
    presence: always
    domain: "d_s >= 1 and d_Q = sum_s d_s."
    locator: "def:declaration; def:admissible-declaration (i)"
    read_under: "protocol-compiler `sector_dims`"

  - name: sector_block_kind
    symbol: null
    type: label
    presence: always
    domain: >-
      The block kind that names what the sector identifiers mean. The
      comparison this module makes is the sector-map comparison in three
      components -- the block kind, the block identifiers and their
      ordering -- and a disagreement is a refusal with
      `sector_map_disagreement`, naming the first position at which the two
      lists differ (spec/architecture.md 2.9). A key of the compiler's,
      emitted so that the third component of that comparison has a datum to
      run on; it is a key name and not a new condition.
    locator: "protocol-compiler/def:declaration (operators on Q are block lists), which def:declaration reads; row (1) of `consumer_agreement`; spec/architecture.md 2.9"
    read_under: "protocol-compiler `sector_block_kind`"

  - name: alice_povm
    symbol: "{M_x}_{x in X}"
    type: matrix list
    presence: always
    domain: >-
      One matrix on A per x -- A carries no sector decomposition -- with M_x
      Hermitian, M_x >= 0 and sum_x M_x = 1_A, all decided exactly, and the
      completeness sum in the declared index order verified to round
      nowhere, so that the computed sum is the real sum. The proofs of
      thm:protocol-channel (i) and (iii) read that relation as an identity
      of real operators -- it is what makes the generated measurement
      isometry an isometry -- which is why the rounding clause is part of
      the admission and not a nicety.
    locator: "def:declaration; def:admissible-declaration (iii); thm:protocol-channel (i), (iii); the `alice_povm_exact` threshold row"
    read_under: "protocol-compiler `alice_povm`"

  - name: bob_povm
    symbol: "{F_v}_{v in V}"
    type: "sector-block list per outcome, against the sector map"
    presence: always
    domain: >-
      One block list (F_v^(s))_{s in S} per outcome v, against the sector
      map of the three rows above. The identity F_v = (+)_s F_v^(s) is what
      the list means and not a condition on it. Admitted exactly and at no
      window: the sector map compared in its three components; F_v
      Hermitian and F_v >= 0 per block, decided exactly; and the
      completeness sum sum_v F_v^(s) = 1_{Q_s} per sector, accumulated in
      the declared order of V (eq:declorder) and verified to round nowhere.
      A family failing any of these is refused, naming the predicate, and
      nothing is repaired.
    locator: "def:declaration (the exact-admissibility paragraph and eq:declorder); req:exact-admission; def:admissible-declaration (iii); protocol-compiler/def:exact (mentioned)"
    read_under: "protocol-compiler `bob_povm`"

  - name: constraint_list
    symbol: "CList = {(hat O_k, bowtie_k, c_k)}_{k=1..m}"
    type: "list; each hat O_k a sector-block list against the sector map"
    presence: "always; m >= 0, and m = 0 is the default route"
    domain: >-
      hat O_k Hermitian block by block and sector-block-diagonal, decided
      exactly; bowtie_k in {precedes-or-equal, =, succeeds-or-equal} in
      trusted-source mode and in {<=, =, >=} in untrusted-source mode. The
      right-hand side arrives in one of two tagged forms and the tag is part
      of the datum (def:homog): `homogeneous`, carrying a real c_k, from
      which this module constructs Theta_k := c_k tau_A; or `general`,
      carrying a Hermitian Theta_k on A. In untrusted-source mode only the
      scalar form exists. Licensing is a type check on the tag and compares
      no numbers (def:homog; rem:cgate): a `general` entry in trusted-source
      mode is admissible input -- every structural and numerical claim of
      this module is proved for it -- and is never licensed, so a list
      containing one carries no key-length claim.
    locator: "def:declaration; def:admissible-declaration (iii), (vi); def:homog; rem:cgate; rem:homog"
    read_under: "protocol-compiler `constraint_list` and `constraint_rhs_tag`"
    the_two_part_gate: >-
      A key-length statement may rest on m >= 1 only when (i) the list is
      licensed for the declared source mode (def:homog) and (ii) the
      supplier's attack-set licence is present (A-ATK,
      protocol-compiler/ass:atk). Part (i) is a type check and part (ii) is
      a presence test; neither is a measurement and neither is verified
      here. The gate degenerates in untrusted-source mode, where part (i) is
      vacuously true, and at d_A = 1, where it rejects only a general tag a
      producer can avoid; there the gate rests entirely on part (ii)
      (rem:cgate). Numerical use outside the security chain is
      unrestricted and a `general` entry is admitted there
      (reductions/rem:sound-and-atk; rem:no-constraints).
      Locator: thm:constrained-accumulation; cor:constrained-key-length;
      def:homog; rem:cgate; req:constrained-key-gate.
    what_the_compilers_flag_adds: >-
      A declaration whose `key_length_eligible` is false may be explored
      numerically and must not reach a key-length output; that flag and
      this module's own gate agree by row (5) of `consumer_agreement`, the
      compiler deciding the same type check on the same tags.

  - name: attack_set_license
    symbol: null
    type: record
    presence: >-
      optional; required by part (ii) of the two-part gate whenever m >= 1
      and a key-length statement is wanted. Absent there, the engine refuses
      the key-length output (req:constrained-key-gate): the key-length entry
      points raise SecurityGateError naming the failing part, and a run
      emits no key length, its reason naming the failing part unless h_low
      is infinite, which is reported first. The program is still solved and
      its numbers are reported for exploration; they do not reach
      eq:keylength.
    domain: >-
      A pass-through attestation from the supplier of the chain, naming the
      licensed reduction of A-ATK (protocol-compiler/ass:atk, machine key
      `attack_set_license`) for this declaration's CList. Never verified
      here: this module tests presence and never truth, and never
      synthesises one. Not engaged at m = 0 (rem:no-constraints).
    locator: "protocol-compiler/ass:atk (A-ATK); thm:constrained-accumulation; cor:constrained-key-length; rem:cgate; rem:not-licensed; req:constrained-key-gate"
    read_under: "protocol-compiler `attack_set_license`"
    one_attestation: >-
      One attestation under one id: protocol-compiler/ass:atk, short id
      A-ATK, machine key `attack_set_license`. The record the compiler tests
      for presence at its gate (G3)(b) is the record
      thm:constrained-accumulation rests on.

  - name: source_replacement_license
    symbol: "the transmitter's source-replacement licence record, or absent"
    type: "opaque record (transmitter/def:srcert); its presence is read, never its content"
    presence: "read in trusted-source mode at d_A >= 2; at d_A = 1 it is vacuous and must not be demanded (prop:trivial-alice-system (iv); req:marginal-licence-gate; transmitter/req:licence-scope)"
    domain: >-
      Presence only. The record is the transmitter's; the compiler consumes
      it at its gate (G2) and passes it on as an opaque record. This module
      reads only whether it is present, at its own A-SRC gate
      (req:marginal-licence-gate): a declared tau_A at d_A >= 2 without the
      record is refused before any key-length output -- the key-length entry
      points raise SecurityGateError and a run emits no key length -- while
      the marginal itself is admitted and the program solved. A-SRC is
      inherited as a ledger row (`assumption_ledger.inherited_rows`), which
      is what the attestation travels in.
    locator: "req:marginal-licence-gate; rem:modes-da1 (a); prop:trivial-alice-system (iv); transmitter/ass:src; protocol-compiler/def:eligible (G2)"
    read_under: "protocol-compiler `source_replacement_license`"

  - name: party_partition
    symbol: Party
    type: record
    presence: always
    domain: >-
      (a) Two total readout maps rd_A, rd_B on X x V onto declared finite
      alphabets, naming what each party physically observes in a round; and
      (b) system metadata: a party label for A and, per sector s, a declared
      tensor factorisation of H(Q_s) with a party label per factor. Part (a)
      is consumed by the derivations, through def:admissible-declaration
      (viii) (party computability). Part (b) is consumed by no derivation and
      carries a supplier obligation -- that the declared POVMs are realisable
      by each party measuring the factors it is labelled with -- which this
      module never verifies; the premises that place the parties'
      laboratories read its labels -- ass:lab (A-LAB) all of them, and
      transmitter/ass:src (A-SRC) the label of A -- so a run attests the
      obligation there and every claim that assumes them rests on it. The
      default partition, rd_A(x, v) = x
      and rd_B(x, v) = v with A labelled A and every Q_s labelled B, is that
      of protocol-compiler/def:target (def:declaration).
    locator: "def:declaration (the party partition); def:admissible-declaration (viii); ass:lab; transmitter/ass:src"
    read_under: "protocol-compiler `party_partition`"

  - name: public_structure
    symbol: "(a_A, a_B, phi, r, h)"
    type: function tables
    presence: always
    domain: >-
      Four total tables and one enum, read as the compiler emits them:
      `announce_alice` a_A on the Alice readout alphabet and `announce_bob`
      a_B on the Bob readout alphabet, jointly a(x,v); `accept_statistic`
      phi into the acceptance alphabet Chat, total; `key_map`
      r: X x V -> Z with Z = Zval u {perp}, Zval = {0,...,d_Z-1}, with
      sifting announcement-determined (there is a total sigma on the
      announcement classes with r(x,v) = perp iff sigma(a(x,v)) = fail); and
      `key_holder` h in {A, B} such that r is party-computable through the
      holder's own readout and the announcements (eq:partycomp). The
      key-live set Chkey of eq:chkey is derived from phi and sigma and is no
      declared slot.
    locator: "def:declaration (eq:chkey, eq:partycomp); def:admissible-declaration (i), (iv), (v), (viii)"
    read_under: "protocol-compiler `announce_alice`, `announce_bob`, `accept_statistic`, `key_map`, `key_holder`"
    why_viii_matters: >-
      def:admissible-declaration (viii) is what makes the error-correction and verification
      steps of thm:keylength physically executable: without it no party
      computes Z_1^n and the key-length statement is undefined. A
      declaration that places both parties' data in v satisfies the
      default-partition reading of (viii) vacuously, which is why (viii) is
      stated for a declared party partition (def:admissible-declaration, its lead-in).

  - name: label_index_map
    symbol: idxm
    type: bijection table
    presence: always
    domain: >-
      The one order the two contracts must agree on, and this module reads
      it rather than choosing one: the declared summation order of
      eq:declorder is read off the declared outcome alphabet V in idxm's
      component there, and the order of the sector blocks off its component
      on S. In exact arithmetic the order is immaterial; in binary64
      addition is commutative and not associative, so the order is part of
      the datum (def:declaration, the declared summation order).
    locator: "def:declaration (eq:declorder); row (7) of `consumer_agreement`; foundations/req:declared-order; spec/architecture.md 2.8 (the producer's summation-order obligation)"
    read_under: "protocol-compiler `label_index_map`"
    fixed_here: >-
      The key name is the compiler's, not this module's and not a claim's:
      def:declaration says the order is part of the declared alphabet and
      names no machine key. The compiler emits the order under this name so
      that the agreement has a datum on the wire (its `label_index_map`
      row).

  - name: acceptance_set
    symbol: Qacc
    type: convex set
    presence: always
    domain: >-
      A closed convex subset of the probability simplex on the declared
      acceptance alphabet Chat, an admissible acceptance set
      (def:admissible-acceptance-set), admitted under
      req:acceptance-set-admission. Its data are exact rationals on the
      exact island and never binary64 (conventions, `number_model`,
      `exact_island`): an implementation that admits a floating-point
      acceptance datum has left this contract. Qacc is a protocol parameter
      fixed before the run and is never inferred from observed counts; this
      module minimises over it. The empty set is admissible and is
      degenerate throughout: h_low = +infinity as an infimum over an empty
      set, no first-order bound is reported, and no key length is claimed
      (frank-wolfe/lem:fo-khyp (i); rem:hlow-range; req:infinite-value).
    locator: "def:admissible-acceptance-set; def:feasible (eq:hlow-def); rem:hlow-range; frank-wolfe/lem:fo-khyp (i)"
    supplied_by: "statistics (spec/architecture.md 3.2); it is no output of the compiler"
    the_geometry_tag: >-
      The set arrives with its geometry tag, which this module reads as data
      and never guesses. The taxonomy is the statistics module's
      (spec/architecture.md 3.2); the two values this contract's
      acceptance-side minimisation is stated for are `singleton` and
      `polytope` (frank-wolfe/rem:acc-side (a), (b)), and any other tag is
      refused at admission rather than guessed
      (frank-wolfe/req:acceptance-geometries).

  - name: rounds
    symbol: n
    type: int
    presence: always
    domain: "n >= 1. A run parameter selected by the run tier together with the completeness budget; it is no slot of the declaration (spec/architecture.md 3.3)."
    locator: "thm:keylength (eq:keylength); cor:keylength-bound (eq:keylength-h); def:admissible-declaration"

  # -------------------------------------------------------------------------
  # The general format's input rows. Each key is present only in the general
  # format, and its absence is the basic format, which every row above
  # describes. The keys and their spellings are the compiler's: this module
  # reads them under the names spec/modules/protocol-compiler/interface.yaml
  # emits, as it does every other input key, and decides on them only what
  # def:admissible-declaration asks.
  # -------------------------------------------------------------------------

  - name: sector_factorisation
    symbol: "the ordered factor list of (DX1)"
    type: "list of (system tag A or Q, party label, sector map)"
    presence: "general format only; absent is one measured factor and no A factor"
    domain: >-
      At most one factor tagged A and then first; at least one tagged Q; one
      block kind. The product sector map, the product alphabet and the joint
      sectors (t, s) are derived, not read: the engine forms Kronecker blocks
      in floating point inside its objective and no product datum arrives.
    what_this_module_reads_it_for: >-
      The variable and the feasible set are lists over the joint sectors
      (def:feasible, eq:feas-general); the Choi program is one coupling
      constraint per Alice sector (thm:choi, the general format);
      key-activity is refined to joint pairs (def:joint-sectors), and a
      factor block is tested for being zero per factor, no product being
      formed.
    locator: "protocol-compiler/def:declaration (DX1); def:declaration, eq:productmap; def:feasible (the general format); thm:choi (the general format); def:joint-sectors"
    read_under: "protocol-compiler `sector_factorisation`"

  - name: alice_form
    symbol: "`povm` or `ensemble`"
    type: enum
    presence: "general format only; absent is `povm`"
    domain: "Which of the two slots of protocol-compiler/def:declaration (DX4) is filled. `ensemble` in trusted-source mode only."
    read_under: "protocol-compiler `alice_form`"
    locator: "protocol-compiler/def:declaration (DX4); lem:ensemble-form; lem:choi-factor (iv)"

  - name: alice_ensemble
    symbol: "{N_x}_{x in X}"
    type: "one block list per x along T"
    presence: "general format, ensemble form only; in place of `alice_povm`"
    domain: >-
      Blocks N_x^(t) with sum_x N_x^(t) = tau_A^(t) and tau_A^(t) non-zero,
      all decided by the compiler on the declared numbers. The declaration
      the form denotes is admissible (def:admissible-declaration), and this
      module decides nothing new.
    what_this_module_does_with_it: >-
      It evaluates the program in these operators and forms neither {M_x}
      nor an inverse nor a rank. On the full frame per Alice sector the
      factor is W_t = (tau_A^(t))^(1/2), the objective, the statistics and
      their derivatives read Alice's side only through N_x at every rank
      (lem:choi-factor (iii), (iv)), and every constraint row is read in its
      conjugated form (thm:choi, the general format). So lem:choi-marginal
      and the rule that no rank is computed anywhere hold unchanged; what is
      forgone is the W-free row dividend where tau_A is not diagonal, which
      moves no value.
    locator: "protocol-compiler/def:declaration (DX4); def:declaration, eq:ensembleform; lem:ensemble-form; lem:choi-factor (iii), (iv); thm:choi (the general format)"
    read_under: "protocol-compiler `alice_ensemble`"

  - name: bob_povm.per_factor
    symbol: "({F^f_v_f})_{f in F}"
    type: "one family of block lists per measured factor, plus the product rule"
    presence: "general format only; one factor is the `bob_povm` row"
    domain: >-
      One exactly admissible family per measured factor against that
      factor's own map, over that factor's ordered alphabet. No product
      datum is read, declared or snapped.
    what_this_module_does_with_it: >-
      It forms the Kronecker block F_v^(s) = (x)_f F^(f,s_f)_v_f in floating
      point inside the objective, where it is needed, and reads the predicate
      "F_v^(s) is non-zero" per factor (def:joint-sectors).
    locator: "protocol-compiler/def:declaration (DX3); def:declaration, eq:productfamily; def:joint-sectors; reductions/thm:emitted-product"
    read_under: "protocol-compiler `bob_povm.per_factor`"

  - name: transcript
    symbol: "((pi_m, C_m, a_m))_{m = 1..L}"
    type: "ordered message list"
    presence: "general format only; L = 2 is the pair `announce_alice`, `announce_bob`"
    domain: >-
      The messages and their tables; the joint announcement function a and
      its alphabet are derived (eq:transcript).
    what_this_module_does_with_it: >-
      Nothing beyond what it does with a in the basic format. def:maps reads
      only the joint announcement function, so no claim of this module
      changes for a transcript protocol; the party-locality of the messages
      is a realisability condition the compiler decides
      (protocol-compiler/thm:sifting-and-key (iv), (vi)) and is no
      hypothesis of any entropy claim here.
    locator: "protocol-compiler/def:declaration (DX5); def:declaration, eq:transcript; def:maps; def:admissible-declaration (viii)"
    read_under: "protocol-compiler `transcript`"

  - name: constraint_scope_and_party_local_tag
    symbol: "(O_k, rel_k, c_k; f_k)"
    type: "per entry: a factor label and the tag"
    presence: "general format only"
    domain: >-
      The entry's operator is a block list against its scope's map; the tag
      is `homogeneous`, `general` or `party_local`, the third in either
      source mode with a real c_k and with the operator relation symbols
      {preceq, =, succeq} in either mode, its reading being an operator
      relation; the scalar symbols coincide with them where every row of the
      entry is 1x1.
    what_this_module_does_with_it: >-
      It reads the entry as the corresponding line of eq:feas-general: the
      lifted reading for the first two tags, and for `party_local` the
      operator inequality on the other systems, one row per pair
      (t, s_f^c). The lifted operator is never formed as a declared datum. A
      list carrying a `party_local` entry sets `removable` for no sector
      (req:removal-checklist; rem:removal-general-format), which costs
      program size and not soundness; thm:removal refuses such a list.
    locator: "protocol-compiler/def:declaration (DX6); protocol-compiler/def:homog (the party-local form); def:homog, eq:partylocal-entry; def:feasible, eq:feas-general; def:classes; rem:removal-general-format; req:removal-checklist; thm:removal"
    read_under: "protocol-compiler `constraint_scope`, `constraint_rhs_tag`"

  - name: reference_companion
    symbol: "D^ref, beside D"
    type: "a compiled declaration, its measured family given as an entrywise enclosure (Gaussian-rational centres, rational radii), on some blocks of data sectors also as a factor enclosure, marked evaluation-only"
    presence: "where the protocol compiler emits one beside the declaration (protocol-compiler/req:reference-companion-compiled)"
    domain: >-
      The tuple the compilation map gives from the same specification with
      the reference companion of every measured factor whose chain carries
      one in place of its snapped target: every component of D but the
      measured families of those factors and the entries of the replaced
      links (prop:reference-companion (i)), those entries
      relaxed (reductions/lem:row-relaxation). Admissible save possibly
      (vii) by prop:reference-companion (ii), its family being a POVM by
      reductions/cor:reference-companion (i). A block read with a factor
      enclosure is a member of it by cor:reference-companion-factors, which
      the certified evaluation reads as (H-FAC)
      (frank-wolfe/lem:certified-bracket-enclosed).
    what_this_module_does_with_it: >-
      Admits it only beside D (req:companion-admission): decides exactly that the shared components
      are D's and reads D's acceptance set; generates the companion's
      statistics map, protocol and branch maps, objective and gradient from
      the companion's own slots (def:maps; consumer_agreement point 2), never
      reusing a map generated from D's measured family; decides nothing of
      its family, docks the family at the binary64 numbers nearest the
      enclosure's centres and records their completeness defect, least
      eigenvalue and the largest radius; solves no program over it but the
      polish of frank-wolfe/req:bracket-on-reference (i), a short search
      continued from the searched declaration's points whose points serve
      only as points, and reports no estimate from it. The frank-wolfe
      submodule evaluates the first-order bound on it
      (frank-wolfe/req:bracket-on-reference).
    locator: "prop:reference-companion; cor:reference-companion-factors; req:companion-admission; req:exact-admission; req:declaration-admission; frank-wolfe/cor:fo-reference"

# ---------------------------------------------------------------------------
# retired_input_rows
#   Names that are not inputs of this module, recorded so that no row takes
#   them up and a reader does not look for them.
# ---------------------------------------------------------------------------
retired_input_rows:

  - name: declared_tolerance
    symbol: tau_num
    why_it_is_not_an_input: >-
      The module takes no tolerance. Declared data reaches it exactly
      admissible or it is refused (req:exact-admission; def:declaration,
      the exact-admissibility paragraph), which is the decision the compiler
      has already taken on the numbers it emits (protocol-compiler/def:exact,
      mentioned and not used), and which spec/architecture.md 2.8 and
      foundations/req:consumer-decides-exactly state as the platform rule:
      no module has a tolerance input. The reason a tolerance could not
      license a key-length claim is prop:optol-nobound -- no bound in the
      declared dimensions, alphabet sizes and alpha alone exists at any
      scale a key length could use -- with rem:optol-direction on how to
      read it.
    what_is_not_a_tolerance: >-
      Two things stay that a reader might take for a tolerance. The declared
      summation order is part of the declaration, because the datum it
      governs is declared, and it lives in def:declaration (eq:declorder).
      The windows of `declared_thresholds.group_b_computed_objects` decide
      predicates on objects this module computed: they are not instances of
      tau_num and are declared beside it (foundations/req:tolerance-scope
      (ii); frank-wolfe/rem:fo-oracle-repair;
      frank-wolfe/rem:fo-iterate-repair).
    locator: "req:exact-admission; def:declaration (the exact-admissibility paragraph); prop:optol-nobound; rem:optol-direction; spec/architecture.md 2.8"

not_inputs:
  preamble: >-
    What this module does not read, recorded because a reader could take
    the silence for permission.

  rows:
    - item: "the reductions artefact"
      detail: >-
        No reductions artefact is an input of this module. The chain record
        reaches the compiler, which types it and re-emits it; what this
        module consumes is the declaration. The soundness of each constraint
        entry reductions emits (a conclusion of that module's theorems,
        reductions/rem:sound-and-atk) and the attack-set licence (A-ATK, a
        supplier obligation) are verified nowhere in this module. The run manifest computes the reductions closure from
        the reductions artefact's module version and claim ids
        (spec/architecture.md 4.4); this module's graph does not carry it,
        which is the same reading the compiler takes.
      locator: "reductions/rem:sound-and-atk; protocol-compiler/ass:atk; spec/architecture.md 4.4; reductions/interface.yaml"

    - item: "a removal witness"
      detail: >-
        The witnesses (s_i, chi_i, mu_i) that set the `removable` flag are
        exhibited by the implementation, by any search it likes, and are not
        declared input: no declaration supplies one. The flag rests on
        (W1)-(W6) and on nothing about the witness's origin (def:classes;
        req:removal-checklist). The witness and its evaluation order are
        emitted, in `sector_report` (req:sector-report).
      locator: "def:classes (the removal checklist); req:removal-checklist; req:sector-report; thm:removal"

    - item: "a tolerance, in either direction"
      detail: >-
        No tolerance row, no window on any predicate on declared data, no
        defect functional, and no statement of this contract is made "at" a
        number.
      locator: "def:declaration; req:exact-admission; `retired_input_rows`"

# ---------------------------------------------------------------------------
# outputs
#   Every run reports the number of every tier it reaches -- the estimate;
#   where the submodule's hypotheses held, the first-order bound; and where
#   its certified evaluation succeeded, the certified number -- with
#   `reported_tier` naming the strongest, which carries the claim. A caller never receives a
#   stronger label than the checks support, and no number is silently
#   upgraded (spec/architecture.md 2.8; foundations/req:tiers;
#   frank-wolfe/rem:fo-interface).
#
#   The rows the submodule owns -- `h_lb`, `optimizer_certificate` and the
#   withdrawal vocabulary -- are stated in
#   spec/modules/meat-core/frank-wolfe/interface.yaml and are named here only
#   where a core row reads one. A gradient callable is an internal API and
#   not a serialised field (`not_outputs`).
# ---------------------------------------------------------------------------
outputs:

  - name: h_low
    symbol: h_low
    type: extended real
    presence: always
    domain: >-
      h_low in [0, +infinity], bits per round: the value of eq:hlow-def, the
      infimum of the objective over Qacc x Feas, and a lower bound on the
      single-round rate h_qkd (thm:reduction; constrained variant
      cor:reduction-constrained). What a run reports under this key is the
      objective evaluated at the point the optimiser returned -- a
      convergence diagnostic and never a bound on the key rate. This is the
      `estimate` tier of spec/architecture.md 2.8 (foundations/def:tiers).
    locator: "def:feasible (eq:objective, eq:hlow-def); lem:estimate; rem:hlow-range; thm:reduction; cor:reduction-constrained"
    its_warrant: >-
      lem:estimate, and it is the whole of it: every point of Qacc x Feas has
      objective value at least h_low (state form (i), Choi form (ii)), so the
      reported number is an upper estimate of h_low and nothing says how far
      above it lies. The membership of the reported point is what must be
      checked for the warrant to hold, and lem:estimate states that the
      check, its window and what an only-approximately-feasible point
      establishes instead are the solver submodule's business and not the
      core's. For the submodule this repository carries, the point is
      established only in the relaxed feasible set, so what a run is in is
      frank-wolfe/thm:firstorder (iiia), and what that gives is an upper
      estimate of h_low[Feas^J(epsilon)], a quantity itself no larger than
      h_low: the reported number is not established to lie on either side of
      h_low.
    whether_the_premise_held_at_the_returned_point: >-
      The point the reported number is the objective at is measured once, at
      the end of the run, against the three checks of
      frank-wolfe/req:iterate-checks (frank-wolfe/req:returned-point-measured):
      per-block positivity at exactly 0, the coupling residual at
      `iterate_coupling` and each declared-row residual at `constraint_rows`.
      All three are checks on the Choi factor J; the acceptance factor is not
      measured (it holds by construction only where the acceptance-side point
      is formed on the exact island, frank-wolfe/rem:acc-side), and the
      record states that island property of the points consumed at the
      iterates and does not state it of the returned point as such; where
      that point is the last one consumed, the last `per_iterate` entry's
      `acceptance_iterate_exact` carries it. That point need not be one the
      per-iterate checks saw: a run that stops at its iteration limit returns
      a point formed after the last point it consumed. The record carries the
      outcome beside this row as the boolean `estimate_point_relaxed_member`
      in `stages.key_rate`, true exactly when the point passes all three
      J-side checks, and the three measured quantities under `returned_point`
      in `optimizer_certificate.group_b_worst` (the submodule's row). A true
      flag establishes the J half of the premise only: the premise of
      frank-wolfe/thm:firstorder (iiia) then holds at that point exactly when
      its acceptance-side component was formed on the exact island, which the
      record does not state of the returned point as such (where that point
      is the last one consumed, the last `per_iterate` entry carries it).
      When it is false, the premise of frank-wolfe/thm:firstorder (iiia) is
      not established at that point, so the reported number is not
      established to be an upper estimate even of h_low[Feas^J(epsilon)], and
      the record says so by that field. The number is still reported
      (`presence: always`) and is still never a bound, so there is nothing to
      withdraw. The first-order bound and the key length rest on no property
      of that point: h_lb is formed only at the iterates each checked when
      consumed, and the key length reads the solver only through h_lb,
      respectively h_lb_dropped (h^FO,D of frank-wolfe/eq:hlb-dropped) under
      a non-empty dropped set (frank-wolfe/cor:fo-keylength, respectively
      cor:keylength-bound at h = h^FO,D by frank-wolfe/cor:fo-dropped); the
      flag and the measurement enter no bracket, tier or key length. The one
      way that point bears on a run is
      frank-wolfe/req:negative-estimate-refused: a negative objective there
      refuses the run with `negative_objective`, and no key length is
      emitted -- a refusal, never a changed value.
      Locator: frank-wolfe/req:returned-point-measured;
      frank-wolfe/rem:fo-returned-point; frank-wolfe/rem:fo-iterate-checks;
      frank-wolfe/rem:acc-side;
      frank-wolfe/req:acceptance-iterate-exact;
      frank-wolfe/req:negative-estimate-refused; frank-wolfe/cor:fo-dropped.
    infinity_is_propagated_and_never_clamped: >-
      The divergence penalty is unbounded, so no finite a-priori ceiling
      exists, and h_low = +infinity signals that no feasible statistics are
      compatible with Qacc. An implementation must propagate that value; the
      extended-real domain of this row is declared for it. If +infinity
      reaches the key-length step the conforming behaviour is to emit no
      key-length claim and to report the declaration/acceptance mismatch: the
      accepted event has probability zero under every attack the declared
      list admits (every attack for an empty list, every admissible one for a
      licensed list), so the accumulation theorem's hypothesis fails and
      there is no run on which a key would be produced.
      Locator: req:infinite-value; prop:value-range; rem:hlow-range.
    a_negative_value_is_a_refusal_and_is_never_clamped: >-
      The objective is non-negative at every point of the exact feasible set
      (prop:value-range (i); thm:branch-formula's cone clause), so a negative
      computed estimate is evidence that a hypothesis does not hold of the
      point it was computed at. The run is refused with `negative_objective`,
      naming the value and the point; zero cannot stand in for it, the
      estimate not being a lower bound, and a bare exception is not a
      conforming implementation of the rule.
      Locator: frank-wolfe/req:negative-estimate-refused;
      frank-wolfe/rem:fo-negative-values.

  - name: h_lb
    symbol: h_lb
    type: "extended real, or absent"
    presence: >-
      The submodule's row, restated here only as far as a consumer of this
      module needs it: present exactly when at least one iterate contributes
      a bracket, every hypothesis of frank-wolfe/thm:firstorder having held
      at it; absent otherwise, with a machine-readable reason naming the
      hypothesis that failed (frank-wolfe/req:first-order-withdrawal). The
      oracle's return and its status remove no iterate, the feasible side of
      every bracket being a lower bound verified without them
      (frank-wolfe/req:verified-feasible-side). The domain, the withdrawal
      vocabulary, the clamp and the recorded repairs are
      spec/modules/meat-core/frank-wolfe/interface.yaml's.
    domain: >-
      Bits per round. Under those hypotheses, with lower bounds on the two
      linear minima in place of the oracle's pairings
      (frank-wolfe/thm:firstorder (iv)), h_lb <= h_low in exact real
      arithmetic; this is not a floating-point invariant, and a computed
      h_lb may exceed h_low (frank-wolfe/rem:fo-arithmetic). What reaches the
      key-length step is max{0, h_lb}, with the unclamped value carried under
      this key and the boolean `first_order_clamped` beside it
      (frank-wolfe/req:first-order-clamp).
    locator: "frank-wolfe/thm:firstorder (ii), (iiib), (iv); frank-wolfe/req:verified-feasible-side; frank-wolfe/req:first-order-withdrawal; frank-wolfe/req:first-order-clamp; frank-wolfe/rem:fo-interface; frank-wolfe/rem:fo-negative-values; frank-wolfe/rem:fo-arithmetic"
    the_core_side_of_it: >-
      What the core asserts of any such number is cor:keylength-bound: for
      any h <= h_low the key-length expression holds with max{0, h} in place
      of h_low. A second solver submodule docks at that claim with its own h,
      and this row becomes one of several; nothing of the core changes when
      it does.

  - name: reported_tier
    symbol: null
    type: enum
    presence: always
    domain: >-
      One of the three tiers of foundations/def:tiers, `estimate`,
      `first-order` and `certified`, and the vocabulary is foundations' and
      not this module's. `certified` exactly when the submodule's certified
      evaluation reports a certified number and a `key_length` is emitted
      from it (frank-wolfe/req:certified-evaluation (vi), (vii));
      `first-order` when `h_lb` is present, a `key_length` is emitted from it
      and the run is not certified; `estimate` otherwise. The field names the
      strongest tier the run reached, the one whose number carries the run's
      claim, and the achieved tier is never silently upgraded, nor
      downgraded without a machine-readable reason.
    locator: "foundations/def:tiers; foundations/req:tiers; spec/architecture.md 2.8 (the tiers and the field); frank-wolfe/rem:fo-interface; frank-wolfe/cor:fo-keylength; frank-wolfe/req:certified-evaluation; frank-wolfe/cor:certified-keylength"
    the_certified_tier: >-
      A run is certified, never requested to be: the submodule's option
      `certified_evaluation` (on by default, off, or strict) decides whether
      the evaluation runs and whether a run that certifies no point refuses,
      and the tier reached is decided by the evaluation alone
      (frank-wolfe/req:certified-evaluation; `certified_evaluation` in
      spec/modules/meat-core/frank-wolfe/interface.yaml). A certified run
      records its first-order number and the key length formed from it
      beside the certified ones. A request naming any tier
      foundations/def:tiers does not list is an unknown tier and is refused
      like any other (foundations/req:tiers).

  - name: key_length
    symbol: ell
    type: "int, or absent"
    presence: >-
      Emitted only on a run whose `reported_tier` is `first-order` or
      `certified`, and formed from the number of that tier. Absent --
      not zero, not clamped -- when `h_lb` is absent, when h_low = +infinity,
      and on a declaration the run tier did not pass as the compiler's
      emission (req:compiled-declaration-only; `key_length_reason` then opens
      with `declaration_not_compiled`); in every case the reason is
      machine-readable and no key-length claim is made.
    domain: >-
      ell >= 0, bits, computed from max{0, h} through the key-length
      expression of thm:keylength with no new floor and no additional term,
      where h is the lower bound on h_low the solver submodule established.
      The key-length corollaries ask no exact arithmetic of it, and at the
      first-order tier none is required. On a run at the certified tier it
      is ell_max at h, computed exactly: n h, lambda_ec and
      ceil(log2(1/eps_ev)) exactly, the term alpha/(alpha-1) log2(1/eps_pa)
      exactly where 1/eps_pa is a power of two and otherwise through a
      rigorous enclosure refined until the floor of the expression is decided
      (frank-wolfe/req:certified-evaluation (vi)). The warrant is cor:keylength-bound, and the
      instances this repository computes are frank-wolfe/cor:fo-keylength at
      h = h_lb and, on a certified run, frank-wolfe/cor:certified-keylength at
      h the certified number (on a reference companion with
      frank-wolfe/cor:certified-keylength-reference). The integer output is floored and a negative value reported
      as zero (req:reported-key-length); if h <= 0 no positive length
      satisfies the expression and no key is claimed (cor:keylength-bound
      (b)) -- the conservative outcome. Confined to alpha in (1, 2) like
      every key-length statement (req:key-length-alpha-domain).
    locator: "cor:keylength-bound (eq:keylength-h); thm:keylength (eq:keylength); frank-wolfe/cor:fo-keylength; frank-wolfe/cor:certified-keylength; frank-wolfe/cor:certified-keylength-reference; prop:monotone; def:max-key-length; req:reported-key-length; req:key-length-alpha-domain; rem:alpha-domain"
    what_the_four_conditions_are: >-
      Part of the expression rather than commentary, and each is a
      hypothesis of thm:keylength rather than a reading of it: lambda_ec is
      the total transcript in bits held in a fixed-length padded register and
      never a per-round average (A-KEYREG); the constant assumes an ideal
      two-universal hash family, and a merely two-universal one costs one
      further bit (A-HASH); no acceptance-probability term appears, this
      profile's acceptance convention making that factor cancel
      (thm:keylength; rem:plus2); and entropies and logarithms are in bits
      (conventions, `log_base`).

  - name: security_parameter
    symbol: "eps_PA + eps_EV + 2 eps_auth"
    type: "float, or absent"
    presence: "emitted exactly when `key_length` is"
    domain: >-
      The security parameter the reported key length carries: eps_pa + eps_ev
      + 2 eps_auth, the composition of secrecy, correctness and the
      authentication scheme's error, which the triangle inequality of
      cor:composed-security (iii) charges twice (a tighter eps_pa + eps_ev +
      eps_auth is expected but not derived; design.md, Limitations). With
      eps_auth = 0 it is equal to eps_pa + eps_ev, the parameter of (ii) (and
      numerically of (i)). It bounds one execution. Executions that share
      no key material and no device state, and leave their keys unused until
      all have ended, add their parameters (cor:separate-executions, under
      A-SEPARATE). A reused authentication key enters through eps_auth,
      which then includes the key's distance from an ideal key, is charged
      twice, and is not bounded by the earlier execution's parameter by
      itself; a chain of executions each authenticating the next is not
      derived (rem:repeated-executions; design.md, Limitations). A zero eps_auth is reported as such and
      flagged: it states that no authentication error is counted. At
      key_length = 0 the parameter is carried for uniformity only: no key is
      output, so no key is secured by it. The engine computes it; the run record carries it.
    locator: "cor:composed-security (i), (iii); ass:auth; cor:separate-executions; rem:repeated-executions"

  - name: net_key_length
    symbol: "ell - k_auth"
    type: "int, or absent"
    presence: "emitted exactly when `key_length` is"
    domain: >-
      The net key gain of the run when both parties output a key,
      key_length minus the declared authentication key consumption k_auth,
      in bits; it may be zero or
      negative, and then the run yields no net key. No clamp is applied: a
      negative value is the report that the run consumed more key than it
      produced. A zero k_auth is reported as such and flagged: it states
      that no key consumption is counted. The engine computes it; the run record carries it.
    locator: "cor:composed-security (iii); ass:auth"

  - name: sector_report
    symbol: null
    type: table
    presence: always
    domain: >-
      Per sector s: the class `key-active` or `constraint-active`, the flags
      `state-blind` and `removable`, and per pair (chat, s) the underlying
      key-inertness predicate. For every s whose `removable` flag is set, the
      report also carries the removal witness (s_i, chi_i, mu_i) that set it,
      the outcome of each of the six conditions (W1)-(W6) on it -- including
      the target list, which (W2) requires to omit s itself and to name no
      sector twice; the exhibited form of each chi_i that (W4) requires; and
      the key-inertness of every (chat, s_i) required by (W5) -- the
      `witness_evaluation_order` in which the sum of (W3), the sums of (W4)
      and the residuals of (RM1) and (RM3) were formed, and those residuals,
      which are the datum 0. It carries in addition the set of sectors the
      run actually deleted, which is not the set of flagged sectors and may
      be smaller: deleting a set needs the composition hypothesis of
      prop:removal-compose -- every deleted sector's witness names targets
      outside the deleted set -- and that is checkable from this table alone.
    locator: "def:classes (the four predicates and the removal checklist); def:keyinert; thm:removal; prop:retention; prop:no-averaging; prop:removal-compose; rem:classes; req:sector-report; req:removal-checklist"
    the_witness_evaluation_order: >-
      Exhibited with the witness and recorded with it, and this is the one
      difference from the declared summation order of eq:declorder, which is
      part of the declaration because the datum it governs is declared.
      Every elementary operation of the exhibited order is verified to round
      nothing, so that the computed residual is the real residual.
      Locator: def:classes (W6); req:sector-report; req:removal-checklist.
    the_direction: >-
      `removable` is a licence to delete, and every outcome other than all
      six of (W1)-(W6) retains the sector. Retention is unconditionally sound
      and costs nothing; a removal on an approximate match computes a
      restricted infimum and reports it under the name h_low -- an
      overstatement no function of any tolerance bounds. A tolerance may only
      ever refuse a removal, never license one, which is why the
      `sector_criterion` threshold row is decided at exactly zero.
      Locator: rem:classes; req:removal-checklist; prop:optol-nobound (i).

  - name: sector_weight_report
    symbol: "(w_s)_s"
    type: table
    presence: always
    domain: >-
      Per sector s, the weight the returned point places on it: w_s = tr
      omega_s in the state form and w_s = tr[chi_{Q_s}(J_s)] in the Choi
      form, the two being equal by the definition of chi_{Q_s} -- the
      assignment omega_s = chi_{Q_s}(J_s) of lem:choi-marginal and thm:choi
      is what relates the two forms, and no property of that theorem beyond
      the assignment is read here. Non-negative, and summing to tr omega,
      which is not 1 at the point a run returns: that point lies in the
      relaxed feasible set of frank-wolfe/def:relaxed-feasible-set, where
      the normalisation is relaxed with the coupling residual
      (frank-wolfe/prop:relaxed-set-properties (c')). The report carries the
      sum it formed and its residue against 1, and that residue is the two
      effects together, the displacement and the arithmetic of the sum.
    locator: "thm:choi (the assignment); frank-wolfe/def:relaxed-feasible-set; frank-wolfe/prop:relaxed-set-properties (c'); def:classes"
    it_is_a_diagnostic: >-
      No claim of this contract is stated in terms of it, and a run's key
      length does not depend on it. It is emitted because the sector
      decomposition is the structure every simplification of this contract
      is a theorem about (thm:reduction, prop:exact-cancellation,
      thm:removal, prop:no-averaging), so where the optimiser put its mass is
      the first thing a reader of a surprising h_low needs.

  - name: map_validation_report
    symbol: null
    type: record
    presence: always
    domain: >-
      The outcome of the input validation and of the cross-validation of the
      generated maps, per check and per object. The maps are generated from
      the declaration and are no declared datum (def:maps;
      thm:protocol-channel), and the checks are: that each generated isometry
      is an isometry and that the generated single-round channel is a
      channel with its classical output registers (thm:protocol-channel (i));
      that the acceptance-statistic marginal of the generated channel is the
      affine statistics map applied to the state, and that the latter is a
      probability distribution on every normalised state
      (thm:protocol-channel (iii)); that the branch maps are completely
      positive and trace-non-increasing with the generation and
      non-generation branches summing to the statistics map, their supports
      orthogonal (lem:branch-maps (i), (ii)); and the block-versus-whole
      agreement, that on a sector-block-diagonal state the branch maps and
      the statistics map are the direct sum, respectively the sum, of their
      per-sector restrictions (lem:branch-maps (iii)). Plus the admission
      outcomes of every declared family (`inputs`, the blanket reading) and
      the bundle-validation outcomes below. A failure is a hard error: a
      bundle that does not validate produces no result at all, never a
      warning and never a repair. It follows that the cross-validation
      outcomes are recorded as the list of checks the run passed, and not as
      a table of verdicts: the checks are decided as the maps are built and a
      failure raises, so a verdict field could only ever carry `true`, and a
      table that can only be true invites a consumer to branch on a value no
      run can produce. The admission outcomes above are a table, and the
      difference is the reason: they are decided per block and per sector
      before anything is built, so which block held and which failed is a
      fact about a run that exists.
    locator: "def:maps; thm:protocol-channel (i), (iii); lem:branch-maps (i)-(iii); spec/architecture.md 3.6 and 6 (bundle validation is this module's input validation, and the maps are cross-validated)"
    what_bundle_validation_covers: >-
      That outcome alphabets, bases, subsystem order and dimensions agree
      across the compiled maps, the reduction and the statistics; that the
      compiled finite measurement is the target named by the reduction; that
      every physical or source reduction is represented in the chain; and
      that the active profile supports the declared trusted marginal, attack
      set, test-statistics model and round structure. The checks are not
      optional and only their owner is fixed (spec/architecture.md 3.6): the
      emitted declaration was decided by the compiler's own validator before
      it was emitted, and this module decides again on the numbers it was
      handed, which is the platform's rule that a consumer decides and never
      infers (foundations/req:consumer-decides-exactly).
    fixed_here: >-
      The key name and the record are this file's. thm:protocol-channel and
      lem:branch-maps state the properties, and req:sector-report states
      what the sector report must carry; no claim says that the validation
      outcomes are emitted as a record. The run record carries what each
      module said at its boundary (spec/architecture.md 3.3, 4.4), which
      needs this module to say it under a key.

  - name: optimizer_certificate
    symbol: null
    type: record
    presence: always
    domain: >-
      The submodule's row. Solver status, residuals, the achieved tier and,
      per contributing iterate, the objective value, the linearisation value,
      the verified feasible-side bound with its diagnostics (the oracle's
      pairing, the dual gap, the frame deduction and the source of the
      multipliers), the oracle status as a diagnostic, the three measured
      residuals of the relaxed membership, the recorded positivity repairs
      with the two kinds kept apart, and which of the acceptance-side
      minimiser or the certified acceptance-side bound was used. Plus, on every trusted-source-mode run,
      `choi_input_basis` -- the support frame actually used, the Choi input
      dimension and the declared isometry, with which construction produced
      it -- and `constraint_row_form`, one value per declared entry. In
      untrusted-source mode there is no Choi input register and both fields
      are absent (def:untrusted-choi (a)). The full field list and every
      presence rule are spec/modules/meat-core/frank-wolfe/interface.yaml's.
    locator: "frank-wolfe/rem:fo-returned-point; frank-wolfe/rem:fo-iterate-checks; frank-wolfe/rem:fo-oracle-repair; frank-wolfe/rem:fo-iterate-repair; frank-wolfe/req:verified-feasible-side; req:frame-recorded; req:row-form-record; def:support-frame; rem:ordering; rem:basis-invariance; def:untrusted-choi (a); prop:frame-free-rows"
    why_the_frame_is_recorded: >-
      No quantity of this contract depends on the choice of frame or of basis
      within it -- h_low, the key length and the sector report included
      (rem:basis-invariance) -- while the reported Choi blocks, the iterates,
      h_lb and the channel reading of rem:ordering are relative to it. So the
      frame is recorded rather than canonicalised (req:frame-recorded), and
      an implementation must not refuse a singular marginal on the ground
      that this contract names no canonical frame: it deliberately names
      none, and the full frame is always available and is exact.

  - name: refusal
    symbol: null
    type: "record or absent"
    presence: "present exactly when this module refuses"
    domain: >-
      Carries a machine-readable reason from `refusal_reasons` naming the
      failed predicate, check or hypothesis, together with the block,
      outcome, sector or entry index at which it failed. A refusal emits no
      key length and no tier above `estimate`, and a withdrawal of the
      first-order number is not a refusal of the run: the vocabulary
      distinguishes the two.
    locator: "req:exact-admission; def:declaration (a declaration is exactly admissible or it is refused); frank-wolfe/req:first-order-withdrawal; frank-wolfe/req:negative-estimate-refused; the `fail_closed` rules"

  - name: assumption_ledger
    symbol: "A-..."
    type: "list of machine keys"
    presence: "always; empty on a run that reports neither a first-order bound nor a key length"
    domain: >-
      The machine keys of the assumptions the reported numbers rest on, with
      the declared values each row binds (`assumption_bindings`): this
      module's own rows under their emission rules and the inherited keys
      read off the supplier artefacts; the submodule carries no live row
      (its A-LMO is superseded). Every row is a premise of a claim root the
      result names in `optimizer_certificate.claim_roots`: lem:estimate,
      which rests on no assumption, on a run that reports neither a bound
      nor a length; the first-order root (frank-wolfe/thm:firstorder, or
      frank-wolfe/cor:fo-dropped for a dropped program, or
      frank-wolfe/cor:fo-reference where the bound is formed on the reference
      companion) whenever a bound is reported, beside lem:estimate where the
      length is withheld and beside cor:keylength-bound where it is reported;
      and on a run reported at the certified tier
      frank-wolfe/cor:certified-keylength beside them, with
      frank-wolfe/cor:certified-keylength-reference on the reference
      companion, neither adding a premise to the first-order length's. The
      rows, their keys and their emission rules are `assumption_ledger`
      below; what each assumption
      carries if violated is its claim file. The run manifest of
      spec/architecture.md 4.4 is assembled from these keys and from the
      claim graph, and a manifest that cannot be generated refuses the run.
    locator: "the assumption files (ass:*); spec/architecture.md 4.4"
    fixed_here: >-
      The emitted key is this file's. The transmitter, reductions and
      compiler artefacts all emit a ledger and a run manifest is assembled
      from them (spec/architecture.md 4.4), so this module emits one too. No
      claim states it; each assumption file states its own machine key.

  - name: assumption_bindings
    symbol: null
    type: "list of (machine key, list of (name, value)) pairs"
    presence: "always; one entry per `assumption_ledger` row, in its order"
    domain: >-
      Beside each row of `assumption_ledger`, the declared values the row's
      assumption's clauses are about, each named by the input or parameter it
      comes from: `assumption_ledger.binds` lists the names per row with the
      clause each comes from. A value is a string, an integer, a boolean, a
      binary64 number, a list, or an object of further names. An operator is
      bound by its shape (the alphabet that indexes it and its dimension) and
      never inlined. A row whose clauses name no value this module holds
      carries an empty list. Held on the result and joined by the run tier
      into the run's assumption set; the result's payload in the run record
      does not carry it until the record's schema version moves.
    locator: "ass:keyreg; ass:hash; ass:seed; ass:fixed; ass:conform; ass:auth; protocol-compiler/ass:atk; transmitter/ass:src; protocol-compiler/ass:rhom; transmitter/ass:seq"
    fixed_here: >-
      The key, its shape and its names are this file's; values are bound
      per assumption. The assumption files state what each assumption is about; no claim states
      that the values are emitted.

  - name: mathematical_spec_version
    symbol: null
    type: string
    presence: always
    domain: >-
      `meat-core@<version>` of the accepted contract; an artefact may not
      claim a draft version. `artifact_bindings` records the pin the code
      emits. `python -m harness.check_claims --status` is the authority on
      what each claim's status is.
    locator: "module.yaml version; PRINCIPLES.md section 6; `artifact_bindings`"
    fixed_here: >-
      The key, and that an artefact may not claim a draft version. No claim
      states it; this file keeps it as a row, as the compiler's file does.

  # -------------------------------------------------------------------------
  # The general format's output rows. Each key is emitted only in the
  # general format or only where a run makes the choice it records, and its
  # absence is the basic format's record.
  # -------------------------------------------------------------------------

  - name: sector_report.joint_pairs
    symbol: "J_K(c-hat) and the key-inert joint pairs"
    type: "mapping from acceptance value to a list of [Alice-sector, measured-sector] pairs"
    presence: "every run (one Frank-Wolfe driver: an accepted-format declaration is solved as its degenerate general embedding and writes the general report)"
    domain: >-
      Which pairs (c-hat, (t, s)) carry a deficit. A sector key-active in the
      sector report may have key-inert joint pairs, and the four sector
      classes are unchanged predicates of the sectors of the measured system.
      Decided on declared data: r constant on the effective outcome set of
      the joint sector, with M_x^(t) non-zero read off the declared block --
      in ensemble form off N_x^(t), by lem:ensemble-form (iii) -- and
      F_v^(s) non-zero read per factor.
    locator: "def:joint-sectors; lem:joint-sectors (iii); def:classes (the general format)"
    record_shape: >-
      The general report has `records`, `joint_pairs`, and
      `removable_refused_because`. Each measured-sector record carries
      `sector`, `key_active`, `constraint_active`, `state_blind`,
      `removable`, and its `removable_refused_because` value. The
      report-level refusal list records all applicable grounds; the
      per-sector field records its applicable ground. Joint-pair activity
      does not replace the measured sector's key-activity predicate, which
      unions the Alice sectors first.

  - name: sector_report.records[].removable
    symbol: "the `removable` flag"
    type: "bool per measured-sector record; refusal grounds recorded separately"
    presence: always
    domain: >-
      Set for no sector of a declaration whose list carries a `party_local`
      entry, and for no sector of a declaration with more than one measured
      factor. Both are refusals to remove, hence retentions, hence
      unconditionally sound; the cost, the size of the program, is written
      out in design.md.
    why: >-
      thm:removal's move transfers weight between sectors of the measured
      system and does not preserve a party-local value, which is an operator
      on the other factors; and with several measured factors the blocks
      F_v^(s) are products that are never formed as data, so (W1)'s
      bit-level test and (W6)'s residuals have no declared datum to read.
    locator: "thm:removal (the party-local hypothesis); req:removal-checklist; rem:removal-general-format"

  - name: dropped_set
    symbol: "D, and h_low^D"
    type: "set of (acceptance value, joint sector) pairs, recorded with the run"
    presence: "only when the run chooses a non-empty dropped set"
    domain: >-
      A formulation choice of a run and not a declared datum. A value
      computed with a non-empty D is reported under its own name, h_low^D,
      together with D, and never under the name of the undropped quantity
      (req:dropped-set-record). Dropped sectors remain optimisation
      variables: their blocks stay in Phi, in every P_c, in the marginal
      condition and in every constraint row.
    what_it_is_worth: >-
      0 <= h_low^D <= h_low <= h_qkd (prop:drop-bound (iii)), monotone in D
      and an identity when every dropped pair is key-inert. The first-order
      bound for the dropped program is frank-wolfe/cor:fo-dropped, whose
      hypotheses ask nothing of a dropped or key-inert joint pair.
    locator: "def:dropped; prop:drop-bound; cor:drop-program; req:dropped-set-record; frank-wolfe/cor:fo-dropped"
  - name: statistics_consistency
    symbol: "b, alpha_0, x, tau, n f(alpha')"
    type: record
    presence: always
    domain: >-
      The record of req:unreachable-acceptance-set (v), in the run record as
      `payload.statistics_consistency`, on completed and refused runs
      alike. Whether the run is checked and, where not, why
      (`out_of_scope`: its honest statistics are the engine's own model of
      the declared devices and the caller declared no constraint entry;
      `opted_out`: `statistics_check` is `off`), the unchecked run naming
      A-REACH as the caller's to vouch for. On a checked run: the
      declaration the solve ran on (the one the run searches); alpha_0 and
      the rule of item (i) that fixed it (the run's fixed order, the lowest
      order the search evaluates, or the lower end of its declared domain);
      b with its tier and the lower bound (alpha_0-1)/alpha_0 b on D_min, or
      the reason none was formed; tau (`min_model_pass_probability`); where
      b > 0, the exponent x = n (alpha_0-1)/alpha_0 b in bits rounded toward
      -inf (`model_pass_exponent_bits`) with the tier of b
      (`model_pass_exponent_tier`), so that the cap 2^(-x) bounds the
      probability that devices the declaration admits, each round's
      acceptance value following the statistics of a feasible state given
      the earlier ones, pass the acceptance test (prop:model-pass-bound
      (ii)), both null where b <= 0 or no bound was formed; how the
      comparison of item (iv) was decided (exactly, by an enclosure of
      log2(1/tau), or undecided and refused) and whether the run was
      refused under it (`acceptance_set_unreachable`); where the solve ran,
      the share `statistics_check_budget_share`, the wall budget it gave
      the solve, the wall time it took and the cause it stopped on, as the
      solver reports it; the estimate O_0, whether it is negative (a
      diagnostic: b is formed whatever its sign, item (ii)) and its relaxed
      membership where the solve returned a point; the gap O_0 - b where b
      was formed; and, where a bound was formed, n f in bits at each order
      the run evaluates, a diagnostic the report does not show.
    locator: "req:unreachable-acceptance-set; prop:minimal-divergence (iv); prop:model-pass-bound (ii); statistics/ass:reach"
    fixed_parameters:
      - name: statistics_check_budget_share
        value: "1/4"
        reading: >-
          The share of the wall budget of one evaluation of the run that the
          check's solve is given as its own wall budget
          (req:unreachable-acceptance-set (i)); where an evaluation has no
          wall budget, the solve runs with the run's iteration cap and gap
          target alone. A smaller share can leave a mismatch unproven, so
          that a run is not refused that a longer solve would refuse, and
          leaves the cap looser; it makes no bound unsound. A constant of
          this file, not a run option: b is a lower bound at any effort, so
          the share bears on how tight the cap is and on the run's wall
          time, never on soundness, and a knob would add a choice no user
          needs. Recorded with the solve.
    options:
      - name: statistics_check
        values: ["on", "off"]
        default: "on"
        reading: >-
          `on` checks a run whose acceptance set is built from an honest law
          or envelope the caller gives as numbers, or whose declaration
          carries a constraint entry the caller declares; `off` opts such a
          run out, and the record says so. Which runs are in scope is a
          property of where the honest statistics and the constraint entries
          came from, which the run tier knows (the facade's or MCP's honest
          override, a protocol document's acceptance or raw table or
          envelope, a document's explicit constraint entries).
      - name: min_model_pass_probability
        values: "an exact rational tau in (0, 1]"
        default: "1/2"
        reading: >-
          A checked run with b > 0 whose cap 2^(-x) on the probability that
          devices as declared pass the acceptance test is at most tau
          (x >= log2(1/tau)) is refused as a whole before any order is
          evaluated (`acceptance_set_unreachable`); decided exactly where
          tau is a power of two and otherwise by a rigorous enclosure of
          log2(1/tau), an undecided comparison refusing. At tau = 1 every
          run with b > 0 is refused.
    no_number_reads_it: >-
      No key length and no other number of the run reads these entries
      (req:unreachable-acceptance-set (v)). The refusal is the one thing
      the check does to a run, and it only withholds a key.

not_outputs:
  preamble: >-
    What this module never emits, recorded because a reader could take the
    silence for permission.

  rows:
    - item: tolerance_report
      detail: >-
        Not emitted: there is no tolerance to report, no defect is measured on
        declared data, admission is exact so exact admissibility is the
        condition of the run existing at all, and whether a key-length claim
        is made is the tier field. The numbers this module does compare
        against fixed values are the Group B thresholds on objects it
        computed, and those are recorded, each with the worst quantity it was
        compared against, in `optimizer_certificate`, which is where the
        objects they decide live.
      locator: "def:declaration (the exact-admissibility paragraph); req:exact-admission; `declared_thresholds.group_b_computed_objects`; frank-wolfe/rem:fo-oracle-repair; frank-wolfe/rem:fo-iterate-repair"

    - item: "a protocol declaration, or any slot of one"
      detail: >-
        The declaration is the compiler's artefact and this module consumes
        it and never fills a slot of it, repairs one, or emits a modified
        one. No declared operator is projected, clamped, symmetrised or
        renormalised here at any tolerance.
      locator: "def:declaration; conventions, `no_snapping`"

    - item: "an acceptance set"
      detail: >-
        The set is constructed by the statistics module from an honest
        distribution before the run; this module minimises over it and
        infers nothing from observed counts.
      locator: "def:admissible-acceptance-set; spec/architecture.md 3.2"

    - item: "a gradient callable, a solver handle or any backend object"
      detail: >-
        The gradient formulas of thm:gradient and cor:full-gradient are part
        of this contract; any gradient callable is an internal implementation
        or regression-test API and is not a field of the serialised bundle or
        of the result record, which carry data only -- matrices, tables,
        scalars, status records -- and never embed a callable, a solver
        handle or a backend-library object. Which backend implements the
        formulas is an implementation consequence outside this contract.
      locator: "thm:gradient; cor:full-gradient; spec/architecture.md 4.1 (no backend-native object graphs and no pickle)"

    - item: "a lower bound from the validation oracle"
      detail: >-
        The alpha -> 1 limit of thm:oracle validates consistency and is not a
        bound of any kind -- in particular it is not the first-order number
        and no run may report it as one (req:limit-not-a-bound). Disagreement
        between an implementation and either reference value is a defect in
        the implementation, never a research question.
      locator: "thm:oracle; rem:oracle; req:limit-not-a-bound"

    - item: "a supplier's attestation"
      detail: >-
        This module never verifies, supplies or synthesises the attack-set
        licence or the source-replacement attestation; it tests presence
        where a gate asks for it and names the owner otherwise
        (`never_verified`).
      locator: "protocol-compiler/ass:atk; transmitter/ass:src"

# ---------------------------------------------------------------------------
# parameters
#   There is no tolerance parameter and no free numerical parameter besides
#   the rows below: every other number this module compares against is a
#   declared threshold and is listed in `declared_thresholds`.
# ---------------------------------------------------------------------------
parameters:

  free_numerical_parameters: "the seven rows below; no other"

  tolerances: >-
    NONE. No module has a tolerance input (spec/architecture.md 2.8;
    foundations/req:consumer-decides-exactly), and this module reads the
    compiler's exact admissibility and decides exactly. The Group B numbers
    are not tolerances in that sense: they decide predicates on objects this
    module computed, they are declared beside the instance's tolerance and
    never as instances of it, and no declared datum is decided at one.
    Locator: def:declaration; req:exact-admission;
    foundations/req:tolerance-scope; frank-wolfe/rem:fo-oracle-repair;
    frank-wolfe/rem:fo-iterate-repair; frank-wolfe/def:relaxed-feasible-set.

  rows:

    - name: alpha
      symbol: alpha
      domain: "(1, 2) for every key-length statement; (1, infinity) for the structural and program claims"
      rationale: >-
        The intersection of the imports, each claim stating its own interval
        (rem:alpha-domain): the accumulation bound and its constrained variant hold
        on (1, infinity), the leftover-hashing step of thm:keylength requires
        (1, 2), the concavity import and the branch identity hold on
        (1, infinity). Any key-length statement -- thm:keylength,
        cor:keylength-bound and frank-wolfe/cor:fo-keylength alike -- is
        confined to (1, 2). The accumulation import itself extends to
        alpha = infinity, an endpoint foundations/def:renyi does not define
        and no claim uses. The outer search is the run tier's (design.md;
        this module is a function of one alpha) and never reports a length
        obtained outside the active profile's domain (spec/architecture.md
        6). The engine decides both intervals: req:key-length-alpha-domain
        and req:objective-alpha-domain. The order is fixed before the run
        (ass:fixed (iii)); a search that compares the lengths the declared
        model gives at several orders reads no data of the run.
      locator: "rem:alpha-domain; req:key-length-alpha-domain; req:objective-alpha-domain; thm:keylength; cor:keylength-bound; fact:meat (locator note (vi)); ass:fixed (iii)"

    - name: eps_pa
      symbol: eps_pa
      domain: "(0, 1] and eps_pa + eps_ev + 2 eps_auth < 1"
      rationale: >-
        The privacy-amplification (secrecy) budget of the key-length
        expression. The joint condition is the gate of
        req:security-statement-not-vacuous, not a hypothesis of the
        corollary: a run with eps_pa + eps_ev + 2 eps_auth >= 1 is refused at
        parameter validation with
        `security_statement_vacuous`, because a security statement with a
        parameter at such a sum is empty and the length reported under it
        would carry no security claim (the `security_statement_not_vacuous`
        rule). cor:keylength-bound's own hypotheses admit the corner; this
        module refuses to run there.
      locator: "thm:keylength; cor:keylength-bound; req:security-statement-not-vacuous; ass:hash; the `security_statement_not_vacuous` rule"

    - name: eps_ev
      symbol: eps_ev
      domain: "(0, 1] and eps_pa + eps_ev + 2 eps_auth < 1"
      rationale: >-
        The error-verification (correctness) budget. The no-key clause of
        cor:keylength-bound (b) is stated for eps_ev < 1. At eps_ev = 1 the
        correctness statement is empty and the clause does not apply: with
        eps_pa = 1 and lambda_ec = 0 the expression admits ell = 1 under an
        empty security statement, and the corner carries no security claim.
        The gate is what this module does about it: the joint condition
        eps_pa + eps_ev + 2 eps_auth < 1 is decided at parameter validation and a run in
        the corner is refused with `security_statement_vacuous` (the
        `security_statement_not_vacuous` rule). The corollary still admits
        the corner.
      locator: "thm:keylength; cor:keylength-bound (b); req:security-statement-not-vacuous; ass:keyreg; the `security_statement_not_vacuous` rule"

    - name: lambda_ec
      symbol: lambda_ec
      domain: "non-negative integer"
      rationale: >-
        The error-correction transcript length in bits, total and not per
        round: the transcript occupies a fixed-length register of that many
        bits and shorter transcripts are padded, so the chain-rule penalty
        counts register dimension and not average length. Reconciliation is
        one-way from the declared key holder.
      locator: "ass:keyreg; thm:keylength"

    - name: eps_auth
      symbol: eps_auth
      domain: "[0, 1) and eps_pa + eps_ev + 2 eps_auth < 1; default 0"
      rationale: >-
        The error of the authentication scheme in the composable sense on
        an ideal key plus the distance of the key the run uses from an ideal
        one (ass:auth (iii)-(v)), a run input fixed before the run
        (ass:fixed). It
        enters the security parameter twice (cor:composed-security (iii)) and
        does not
        enter the key-length expression; it enters the gate of
        req:security-statement-not-vacuous, which at eps_auth = 0 is the
        two-budget rule. The default 0 asserts a perfectly authenticated
        channel; the report flags a zero value as an
        authentication error that is not counted.
      locator: "ass:auth; ass:fixed; cor:composed-security"

    - name: k_auth
      symbol: k_auth
      domain: "non-negative integer, bits; default 0"
      rationale: >-
        The pre-shared key the authentication scheme consumes in one run
        (ass:auth (ii)), fixed before the run (ass:fixed). It is subtracted
        from the key length to give the net key gain
        (cor:composed-security (iii)) and does not enter the key-length
        expression. The default 0 counts no key consumption; the report
        flags a zero value.
      locator: "ass:auth; ass:fixed; cor:composed-security"

    - name: purifier_dim
      symbol: "dim H(Etilde)"
      domain: ">= d_A d_Q"
      rationale: >-
        For the defining optimisations, so that purifications of every
        feasible A Q marginal exist; the bound is part of the definition of
        the rate (def:hqkd-list) and of the statement of
        thm:accumulated-entropy, and no run attests it. Etilde is a
        proof-internal register: any larger purifier gives the
        same value (lem:purifier-indep), the accumulation proof's larger
        purifier never surfaces, and no implementation object depends on it
        -- h_low is a function of the A Q marginal only (thm:reduction).
      locator: "def:hqkd-list; thm:accumulated-entropy; lem:purifier-indep; thm:reduction"

# ---------------------------------------------------------------------------
# retired_parameter_rows
#   Names that are not parameters of this module, recorded so that no row
#   takes them up.
# ---------------------------------------------------------------------------
retired_parameter_rows:

  - name: requested_assurance
    why_it_is_not_a_parameter: >-
      Every run reports the number of every tier it reaches with
      `reported_tier` naming the claim (spec/architecture.md 2.8;
      foundations/req:tiers), and
      frank-wolfe/rem:fo-interface states the two-numbers rule with no
      request in it: the tier is achieved, never requested. A request row
      would reserve nothing and gate nothing: the certified tier too is
      reached by the submodule's certified evaluation, whose option decides
      only whether the evaluation runs and whether its failure refuses
      (frank-wolfe/req:certified-evaluation).
    what_follows: >-
      The presence of the `h_lb` and `optimizer_certificate` rows is decided
      by the hypotheses alone, and no request enters it; the string that
      would refuse a request for a tier is among
      `refusal_reasons.retired`.
    locator: "spec/architecture.md 2.8; foundations/def:tiers; foundations/req:tiers; frank-wolfe/rem:fo-interface; frank-wolfe/req:certified-evaluation"

# ---------------------------------------------------------------------------
# conventions
#   Declared once, used everywhere; each is a reading the claim files take
#   and none adds a rule. The platform's numerical policy is stated as claims
#   of the foundations module (spec/architecture.md 2.8: the number model,
#   the tiers, who snaps, the exact island), and the operator type and the
#   sector-map comparison are spec/architecture.md 2.9; symbols are
#   spec/notation.md's.
# ---------------------------------------------------------------------------
conventions:

  general_format: "the declaration's general format, with the basic format its degenerate case entry for entry"
  general_format_note: >-
    protocol-compiler/def:declaration (DX1) to (DX6), which def:declaration
    reads, defines the general format. Every row of this file that names no
    general-format key describes its degenerate case -- one Alice sector,
    one measured factor, POVM form, two independent messages and no
    party_local entry -- and that case is the basic format key for key, so
    no emitted number, no frozen registry and no existing artefact differs
    between the two readings. The wire keys the general format needs, named
    here in one list: `sector_factorisation` inside `declaration` (the ordered
    factor list: per factor a system tag A or Q, a party label and that
    factor's own sector map; at most one A factor and it is first; one block
    kind); `alice_form` with the two values `povm` and `ensemble`;
    `alice_ensemble` (the block lists N_x per Alice sector, present exactly
    in ensemble form, in place of `alice_povm_blocks`);
    `alice_marginal_blocks`, `alice_povm_blocks` and a general right-hand
    side as block lists per Alice sector; the measured family as one family
    per measured factor with its own ordered alphabet (no product array is
    ever a datum; every exact predicate runs per factor); `transcript` (the
    ordered message list: sender, alphabet, table over the sender's readout
    and the earlier messages) in place of `announce_alice` and
    `announce_bob`, which remain the two-message case; per constraint entry a
    `scope` naming a measured factor, and the tag value `party_local` beside
    `homogeneous` and `general`. What is never a key: the POVM an ensemble
    form denotes, a product block, a lifted constraint operator, a rank of
    tau_A. Declared party readout maps are consumed by transcript evaluation
    and key-computability validation.
    Engine side (meat-core): an ensemble-form declaration is evaluated in the
    Choi coordinates of the full frame per Alice sector with every constraint
    row in its conjugated form (lem:choi-factor (iv)); no numerical rank
    decision on tau_A is required, and the W-free row dividend stays under
    the standard of req:row-form-by-construction, per sector. The feasible
    set and the variable are lists over joint sectors (def:feasible);
    `sector_report` records the joint key-active pairs (def:joint-sectors)
    and the run's dropped set (def:dropped), and a value computed with a
    non-empty dropped set is reported under its own name, h_low^D with D,
    never as h_low (prop:drop-bound; req:dropped-set-record). `removable` is
    set for no sector of a declaration with a party_local entry or more than
    one measured factor (req:removal-checklist). In trusted-source mode the
    linear minimisation may be run, and its feasible-side minimum bounded, as
    one independent program per Alice sector (thm:choi, general format;
    frank-wolfe/rem:fo-general-format; frank-wolfe/lem:feasible-side-dual
    (ii)).

  number_model: "binary64, declared data exactly admissible, with one named exception"
  number_model_note: >-
    The platform's numerical policy is stated once, as claims of the
    foundations module (spec/architecture.md 2.8), and this module reads it
    rather than restating it. Every quantity of this contract is computed in
    binary64 and every declared number is its binary64 datum -- there is no
    exact object behind it of which the float is an approximation
    (foundations/def:binary64) -- and declared operator data is exactly
    admissible at every module boundary (foundations/req:boundary-admission).
    No claim here rests on a floating-point error budget and none is
    tracked: the optimiser's own rounding is trusted and unbudgeted, which
    is what the `first-order` tier means. The one named exception is the
    exact island below.
    Locator: def:declaration; foundations/req:exact-island;
    frank-wolfe/rem:fo-arithmetic.

  exact_island: "the acceptance side, in full"
  exact_island_note: >-
    The declared acceptance set, the acceptance-side linear minimisation and
    the acceptance-side iterate arithmetic are exact rational arithmetic
    (spec/architecture.md 2.8, the exact island; foundations/def:exact-island).
    The third is what makes the acceptance factor of the membership
    hypothesis true by construction rather than checked, and it costs one
    vector of rationals per iterate and one convex combination. An
    implementation that admits a floating-point acceptance datum, or that
    forms the acceptance iterate in binary64, has left this contract and
    withdraws the first-order number.
    Locator: def:admissible-acceptance-set; frank-wolfe/rem:acc-side (alpha), (beta);
    frank-wolfe/req:acceptance-iterate-exact; frank-wolfe/rem:fo-iterate-checks.
    The implementation keeps the exact iterate's bit length bounded by
    adopting exactly checked short points; frank-wolfe/interface.yaml,
    `exact_island_bounded_bits`, records how and why this departs from the
    cost sentence above and not from the claims.

  exact_equality: ieee754
  exact_equality_note: >-
    What "equal as binary64 data" means, fixed here and used wherever this
    contract decides an identity exactly: IEEE-754 equality of the values
    -- the predicate IEEE 754 writes compareQuietEqual -- and not equality
    of bit patterns. What every such decision must establish is an identity
    of real numbers (that a block is a scalar multiple of the identity, that
    a residual is zero), and on non-NaN operands IEEE equality holds exactly
    when the two data denote the same real number, whereas bit-pattern
    equality would additionally refuse the honest pair of signed zeros. In
    the other direction IEEE equality is false for every operand pair
    containing a NaN, including a NaN against itself, so a NaN datum refuses
    every exact decision it enters, in the direction def:classes requires.
    Both readings refuse in the safe direction, and an implementation must
    be told which: that is the whole reason this row exists.
    Locator: def:classes (c); req:state-blind-test; req:removal-checklist.

  operator_form: "sector blocks plus a sector map"
  operator_form_note: >-
    From input to output an operator on Q is a list of sector blocks
    together with the map that names them. Sector-block diagonality holds by
    construction; nothing verifies that the off-sector entries vanish,
    because nothing can write them. A consumer's structural check is the
    sector-map comparison -- block kind, identifiers, order -- and nothing
    else; positivity, completeness, Hermiticity and trace are per block,
    maximised over blocks. No full d_Q x d_Q array is materialised or
    checked on any path this contract specifies.
    Locator: protocol-compiler/def:declaration (operators on Q are block
    lists), which def:declaration reads; foundations/def:sector-map;
    def:admissible-declaration (iii); thm:reduction; spec/architecture.md 2.9.

  summation_order: "the declared order of the outcome alphabet, read and never chosen"
  summation_order_note: >-
    A binary64 sum is a determinate number only once the accumulation order
    is fixed, so the order is part of the datum. The completeness sum of
    each sector is formed left to right, entrywise, with no re-ordering and
    no re-association, in the declared total order of V (eq:declorder), and
    this module reads that order off the declared alphabet rather than
    choosing one; it travels under the compiler's `label_index_map`. Sums
    over sector blocks are formed in the declared order of S, and a trace
    over the row index of the emitted array. An ordering a supplier did not
    choose is never the ground of a refusal here. The one order this module
    does fix is the witness evaluation order of def:classes (W6), which is
    exhibited with the witness because the witness is exhibited by the
    implementation.
    Locator: def:declaration (eq:declorder and the paragraph on it);
    foundations/req:declared-order; def:classes (W6); row (7) of
    `consumer_agreement`.

  subsystem_order: "A, Q, Etilde for states; output registers Z, Chat, I; branch-map retained registers R, X, Y, C_A, C_B, A, Q"
  subsystem_order_note: >-
    Within each sector, the declared tensor factors in their declared order;
    a comma-indexed tensor factor is never the parenthesised superscript,
    which this contract reserves for sector blocks of an operator.
    Locator: def:declaration (the party partition); def:maps; def:branch.

  choi_ordering: "the Choi input factor first, in the recorded declared basis"
  choi_ordering_note: >-
    Trusted-source mode only; in untrusted-source mode the Choi
    parametrisation is the identity and none of this applies
    (def:untrusted-choi (a)). Choi blocks live on the Choi input register
    tensor the sector, with the input factor first (req:choi-convention). No
    run computes the rank of the declared marginal: the support frame is
    asked only to contain the support, so the frame is whichever of the two
    constructions of def:support-frame the implementation used -- the full
    frame, always available and the default, or the diagonal frame -- and
    the transpose is taken in the declared basis of that frame. A singular
    marginal is admissible and needs no special handling. The frame is
    recorded, in `optimizer_certificate.choi_input_basis`, on every
    trusted-source-mode run, and no quantity of this contract depends on it
    (rem:basis-invariance; req:frame-recorded). The construction also
    decides which form each declared constraint row is imposed in, recorded
    per row as `constraint_row_form`: the frame-free form is licensed only
    on a frame whose construction exhibits tightness, and where it is not
    licensed the conjugated form is mandatory -- exact on every admissible
    frame, so a safe default available on every run and never a numerical
    decision (req:row-form-by-construction; req:row-form-record).
    Locator: def:support-frame; lem:choi-marginal; thm:choi; rem:ordering;
    req:choi-convention; rem:basis-invariance; def:untrusted-choi;
    prop:frame-free-rows; req:frame-recorded; req:row-form-by-construction;
    req:row-form-record.

  assurance_ladder: "estimate, first-order, certified"
  assurance_ladder_note: >-
    Three tiers, each reported on every run that reaches it, with
    `reported_tier` naming the strongest, which carries the claim. The
    vocabulary lives in the foundations module (foundations/def:tiers;
    spec/architecture.md 2.8) and not in this module. The certified tier is
    reached by the submodule's certified evaluation, whose `strict` value of
    the option refuses a run that certifies no point; there is no other
    strict/lenient mode, no exact-rational mode and no per-run floating-point
    budget, the certified evaluation's ball arithmetic being rigorously
    enclosed and not a budget (foundations/req:exact-island).
    Locator: spec/architecture.md 2.8; foundations/def:tiers;
    foundations/req:tiers; frank-wolfe/rem:fo-interface;
    frank-wolfe/req:certified-evaluation.

  log_base: 2
  entropy_units: bits
  log_base_note: >-
    Every log of this contract is log base 2 unless written ln; every
    entropy and divergence is in bits. Natural logarithms appear only inside
    derivative formulas and carry explicit conversion factors. Mixed bases
    are a defect wherever they appear, and any change of base requires an
    explicit verified conversion (spec/architecture.md 6).
    Locator: foundations/def:kl; foundations/def:renyi; thm:gradient.

  entropy_variant: sandwiched-renyi
  arrow: up
  entropy_variant_note: >-
    The sandwiched family; the Petz family is not used. The security chain
    bounds the up-arrow quantity, and the sanctioned computable relaxation
    replaces it by the down-arrow one, valid in that conservative direction
    only: the reverse replacement is a hard error.
    Locator: foundations/def:renyi; thm:branch-formula; rem:losses.

  test_statistics_model: output_state
  test_statistics_model_note: >-
    Binding. The round-type mass is part of the output statistics and no
    fixed test fraction is split off anywhere: every per-round public choice
    of known bias is a component of the joint outcome and enters as a
    weight inside the POVM elements, which is the declaration this module is
    written against. A profile wishing to use a fixed-fraction model must
    supply a trusted-selector argument outside this contract and re-enter
    review; nothing here licenses it, and bundle validation rejects a
    fixed-fraction decomposition offered without that argument
    (spec/architecture.md 3.6 and 6). The state-dependent round-type
    marginal that flag-state squashing produces is covered by A-TSM
    (reductions/ass:tsm), named here and not assumed.
    Locator: def:declaration; thm:protocol-channel; reductions/ass:tsm.

  source_model: derived
  source_model_note: >-
    `trusted` or `untrusted`, derived from whether the marginal slot is
    filled, never a second key: a second carrier of the mode would be a
    second source of truth. At d_A = 1 the two modes are the same
    declaration and the attestation is vacuous and must not be demanded.
    Every mode-dependent statement branches on this one bit --
    def:declaration, def:homog, def:roundmodel, def:hqkd-list, def:feasible,
    lem:range, thm:accumulated-entropy, thm:removal, thm:choi,
    thm:constrained-accumulation, thm:keylength, cor:full-gradient,
    lem:product-marginal -- and the mode-dependence of the Choi step is def:untrusted-choi.
    Locator: rem:modes-da1 (a), (b); prop:trivial-alice-system;
    req:marginal-licence-gate; transmitter/rem:source-mode (a);
    transmitter/rem:da1.

  round_homogeneity: required
  round_homogeneity_note: >-
    Every round uses the same declaration, hence the same source mode and,
    in trusted-source mode, the same marginal (A-RHOM,
    protocol-compiler/ass:rhom, machine key `round_homogeneity_declaration`).
    A specification whose rounds differ is refused, not averaged, and
    heterogeneous rounds are a later theorem profile and not an implicit
    generalisation (spec/architecture.md 6). No collapse of the attack
    sequence is used anywhere: the adversary's channels vary freely across
    rounds and homogeneity enters only through the common target set of
    lem:range (ii).
    Locator: protocol-compiler/ass:rhom; thm:accumulated-entropy; lem:range
    (ii).

  no_snapping: true
  no_snapping_note: >-
    This module never repairs what it was handed, at any tolerance and by
    any route: no projection, no clamp, no symmetrisation, no
    renormalisation of a declared operator. Declared data is snapped by
    whoever declares it, once, with the snap recorded -- the instance for
    what it declares about its device, a producer for its own emission --
    and every consumer downstream decides exactly and refuses
    (spec/architecture.md 2.8, "Who snaps"; foundations/req:who-snaps). The
    two positivity repairs this contract does license are on objects this
    module computed -- an oracle return and a formed iterate -- they are
    recorded and kept apart, and they are the submodule's rows
    (frank-wolfe/rem:fo-oracle-repair; frank-wolfe/rem:fo-iterate-repair;
    frank-wolfe/req:oracle-repair; frank-wolfe/req:iterate-repair). This module also emits no operator
    family, so the producer half of the snapping table has no site here.
    Locator: def:declaration; foundations/req:who-snaps;
    frank-wolfe/rem:fo-oracle-repair; frank-wolfe/rem:fo-iterate-repair.

  decide_never_infer: true
  decide_never_infer_note: >-
    A predicate on a datum this module consumes is decided by inspecting
    that datum and never by inferring it from the supplier's verdict: the
    compiler decided the exact admissibility of the numbers it emitted, and
    this module decides it again on the numbers it was handed. That is the
    platform's rule (foundations/req:consumer-decides-exactly), and it is why
    the admission is stated in def:declaration and req:exact-admission rather
    than assumed from protocol-compiler/def:exact, which is mentioned and
    not used.
    Locator: def:declaration (the exact-admissibility paragraph);
    req:exact-admission; foundations/req:consumer-decides-exactly;
    spec/architecture.md 2.8.

  fail_closed: >-
    No default value is ever substituted for a missing datum: a run whose
    declaration, acceptance set or parameter block is incomplete is refused
    before anything is constructed, because a defaulted datum decides a
    security-relevant question on nobody's authority. An infinite value of
    the program is propagated and never clamped (req:infinite-value). A
    negative estimate is a typed refusal and is never clamped
    (frank-wolfe/req:negative-estimate-refused), while a negative
    first-order bound is clamped to zero, flagged, and the unclamped value
    emitted beside it (frank-wolfe/req:first-order-clamp) -- the two are
    handled oppositely, because one is a lower bound and the other is not.
    An iterate at which a hypothesis fails contributes no bracket to the
    first-order number, and where no iterate is left the number is withdrawn
    and the estimate stays, with a machine-readable reason
    (frank-wolfe/req:first-order-withdrawal); withdrawal is never a
    weakening of what the number means, there being no reduced form of the
    claim. A supplier attestation is never synthesised and never verified.
    Locator: req:infinite-value; rem:hlow-range;
    frank-wolfe/req:first-order-withdrawal;
    frank-wolfe/req:negative-estimate-refused;
    frank-wolfe/req:first-order-clamp; frank-wolfe/rem:fo-interface;
    frank-wolfe/rem:fo-negative-values; spec/architecture.md 2.8.

  artifact_bindings_mathematical_spec_version: >-
    `meat-core@<version>` of the accepted contract; no artefact may claim a
    draft version. See `artifact_bindings` for the pin the code emits.

# ---------------------------------------------------------------------------
# declared_thresholds
#   Every comparison this module makes against a fixed number. The section
#   exists because the platform draws one line a reader cannot draw for
#   himself: the instance's tolerance governs declared data at a module
#   boundary and never the arithmetic a module performs on objects it
#   computed itself (foundations/req:tolerance-scope; spec/architecture.md
#   2.8, "What tau does not reach"). This module takes no tolerance, so
#   every predicate on declared data is decided at exactly zero (Group A),
#   and every declared number of this module decides a predicate on an
#   object it computed (Group B).
#
#   The norm, stated once, and the one predicate that is not a norm. Every
#   defect of a difference is measured in the entrywise maximum modulus, per
#   sector block. Positivity is not of that kind: it is decided by a
#   spectral floor, and so is the relaxation of a declared operator
#   inequality. Every row says which of the two it is, and the two are never
#   converted into each other: the spectral test implies the entrywise one
#   and the converse fails by up to a factor of the block dimension, so the
#   spectral test is the stricter (foundations/lem:floor-stricter), and
#   reading one as the other would put a factor of the dimension inside a
#   security decision. Where a derivation needs an operator-norm bound it
#   converts explicitly, with the dimension factor written into the
#   statement that uses it (foundations/req:norm-conversion); the conversion
#   sites are frank-wolfe/prop:relaxed-set-properties (b) and (c') and
#   frank-wolfe/rem:fo-iterate-repair.
#   Locator: spec/architecture.md 2.8; foundations/req:norm-conversion;
#   frank-wolfe/def:relaxed-feasible-set.
#
#   Which constant of an implementation carries a row is that
#   implementation's business, but every row must be carried by exactly one
#   and no row by two.
# ---------------------------------------------------------------------------
declared_thresholds:

  group_a_declared_data:
    preamble: >-
      Predicates on declared data. Every row is decided exactly and carries
      no window -- there is no number in this group and no row has a
      `window` field to fill. The reading is def:declaration's
      exact-admissibility paragraph (req:exact-admission), which is the
      compiler's protocol-compiler/def:exact read on the numbers this module
      was handed (mentioned and not used), and it is the stricter of the
      readings spec/architecture.md 2.8 licenses: it admits a subset of what
      any window would, so nothing that passes here could have failed the
      policy.
    rows:

      - machine_key: bob_povm_admission
        predicate: >-
          On the declared receiver family, per sector block: the sector map
          compared in its three components; Hermiticity; positive
          semidefiniteness (an exact decision, not a floating-point
          eigenvalue); and completeness, the sector sum being the identity.
        decided: "exactly, no window"
        why_positivity_is_not_a_spectral_floor: >-
          A spectral floor computed in floating point would contradict
          `fail_closed.how_a_rule_is_decided` -- positivity by an exact
          decision and not by a floating-point eigenvalue -- and would refuse
          declared families this contract admits. numpy.linalg.eigvalsh
          returns a negative smallest eigenvalue on a block that is exactly
          positive semidefinite and exactly singular: -5.50e-18 on the dyadic
          rank-one block v v^T with v = (2^-1, 2^-2, 2^-3, 2^-4), and
          -8.53e-18 on the optical instance's two 4x4 nb_3 blocks at photon
          cutoff 3, where the exact decision says positive semidefinite. A
          floor compared against zero refuses those; a window around the
          comparison would be the undeclared default the exact rule exists to
          forbid. So the row is decided by a rational LDL^* with the
          zero-pivot rule, and a singular declared operator is ordinary
          rather than special (rem:basis-invariance; the support frame of
          def:support-frame carries it).
        locator: "def:declaration (the exact-admissibility paragraph); req:exact-admission; def:admissible-declaration (iii); protocol-compiler/def:exact (mentioned)"

      - machine_key: bob_povm_summation_exact
        predicate: >-
          The declared-order completeness sum of each sector, formed left to
          right with no re-ordering and no re-association (eq:declorder), has
          every entrywise addition exact in binary64, so that the computed
          sum is the real sum.
        decided: "exactly, no window"
        locator: "def:declaration (eq:declorder and the exact-admissibility paragraph)"
        why_it_is_separate_from_the_row_above: >-
          A completeness defect of zero on a sum that rounded does not say
          that the family is complete as declared: the two differ in the
          unsafe direction and by an amount no declared number bounds. This
          row is therefore decided on its own, at exactly zero.

      - machine_key: alice_povm_exact
        predicate: >-
          Each declared Alice POVM element Hermitian and positive
          semidefinite -- an exact decision, not a floating-point eigenvalue,
          for the reason the `bob_povm_admission` row gives -- the family
          complete, and the completeness sum in the emitted index order
          verified to round nowhere.
        decided: "exactly, no window"
        locator: "def:declaration; def:admissible-declaration (iii); thm:protocol-channel (i), (iii)"

      - machine_key: alice_marginal_exact
        predicate: >-
          The declared marginal Hermitian, positive semidefinite (an exact
          decision, not a floating-point eigenvalue, for the reason the
          `bob_povm_admission` row gives; a singular tau_A is admissible and
          is exactly the case that distinguishes the two) and of trace one,
          with the trace formed by additions over the row index verified to
          round nowhere; and, on a run whose support frame is the diagonal
          construction, that construction's precondition -- every
          off-diagonal entry of the declared marginal is the datum zero, by
          the bit-level test of req:diagonal-frame-test.
        decided: "exactly, no window; the diagonality clause likewise"
        locator: "def:declaration; def:admissible-declaration (ii); def:support-frame (the two constructions and the precondition); req:diagonal-frame-test"
        why_the_diagonality_clause_is_exact: >-
          A nearly diagonal marginal admitted by the diagonal construction
          would return a frame that is not tight, while
          req:row-form-by-construction reads the tightness dividend off that
          construction -- the direction that cuts the feasible set down and
          raises an infimum. Locator: req:diagonal-frame-test;
          rem:tightness-by-construction.

      - machine_key: constraint_operator_exact
        predicate: >-
          Each declared constraint operator Hermitian block by block and
          sector-block-diagonal, and its right-hand side of the type its tag
          declares -- a real scalar for a `homogeneous` entry, a Hermitian
          operator on A for a `general` one. The tag and the typing are type
          decisions and compare no numbers. Positivity is asked of no
          constraint operator: def:declaration's exact-admissibility
          paragraph, def:admissible-declaration (iii) and the compiler's emission agree on
          that.
        decided: "exactly, no window; the tag and the typing are decided and not measured"
        locator: "def:admissible-declaration (iii), (vi); def:homog; def:declaration"
        fixed_here: >-
          The machine key is this file's. Hermiticity of a constraint
          operator is a predicate on the declared numbers and not a type
          condition, so it has a row of its own, and the row records the tag
          and the typing beside it. The predicate is def:admissible-declaration (vi)'s and
          def:homog's.

      - machine_key: acceptance_data_exact
        predicate: >-
          The declared acceptance data are a probability vector,
          respectively define a closed convex subset of the simplex on the
          acceptance alphabet (an admissible acceptance set).
        decided: "exactly, no window; exact rational arithmetic, on the exact island"
        locator: "def:admissible-acceptance-set; the `exact_island` convention"

      - machine_key: sector_criterion
        predicate: >-
          The six conditions (W1)-(W6) that set the `removable` flag: the
          scalar-multiple test of def:classes (c) on the declared operators
          of the sector (req:state-blind-test); the disjointness and pairwise
          distinctness of the targets (W2); the weight condition (W3), whose
          sum is formed in the exhibited order and verified to round nowhere;
          the state condition (W4), decided on the exhibited form of each
          witness state and never on a computed spectrum; the key-inertness
          of every target (W5); and the two equality families of (W6) at
          residual exactly zero. Plus the composition hypothesis of
          prop:removal-compose on the set a run actually deletes.
        decided: >-
          exactly, no window: a bit-level identity of binary64 data,
          respectively a comparison of index data, respectively a sum or
          residual verified to round nowhere.
        locator: "def:classes; req:removal-checklist; rem:classes; thm:removal; prop:removal-compose"
        the_direction: >-
          A tolerance may only ever refuse a removal, never license one.
          rem:classes states the direction and why the other one is
          unbounded: a removal on an approximate match reports a restricted
          infimum under the name h_low, an overstatement that no function of
          any declared number bounds. req:removal-checklist is the rule every
          check implements.
        note_on_the_group: >-
          Part of this row decides declared data (the state-blindness of a
          sector) and part decides a witness the implementation exhibited. It
          is one row in this group because it is one flag and because both
          halves are decided at exactly zero. The two halves reach zero by
          different routes (rem:witness-exactness; req:state-blind-test;
          req:sector-report): the declared half because a consumer takes
          declared data as it finds it, and the exhibited half because an
          implementation can make its own witness exact by construction.

  group_b_computed_objects:
    preamble: >-
      Predicates on objects this module computed. These are not instances of
      the instance's tolerance and must not be declared under it: each is a
      number of its own, declared beside it, and recorded with the worst
      quantity it was compared against on the run (`optimizer_certificate`).
      The reason is stated once for the group: what these decide is
      accumulated arithmetic on iterates and on oracle returns, not a
      property of anybody's declaration -- so a window sized on declaration
      defects would refuse correct runs, and conversely a declaration
      admitted exactly says nothing about them.
      Locator: foundations/req:tolerance-scope (ii); spec/architecture.md 2.8
      ("What tau does not reach"); frank-wolfe/rem:fo-oracle-repair;
      frank-wolfe/rem:fo-iterate-repair.
    rows:

      - machine_key: choi_isometry
        predicate: >-
          The two identities of the support frame -- that the constructed
          isometry is an isometry, and that its range projector fixes the
          declared marginal -- on the isometry this module constructed.
        window: "exactly 0, entrywise, as binary64 data; no declared number"
        locator: "def:support-frame (eq:iota and the two constructions); req:frame-constructed"
        why_zero: >-
          Both constructions meet it by arithmetic on the data zero and one;
          anything else is refused with `choi_isometry_inexact`. Group B
          because the isometry is computed here and not declared.

      - machine_key: degeneracy_window
        predicate: >-
          Which eigenvalue pairs of an iterate's branch operator take the
          derivative value rather than the difference quotient in the kernel
          of the gradient formula.
        window: "declared, relative"
        locator: "lem:dk (the divided-difference kernel); thm:gradient"

      - machine_key: internal_hermiticity
        predicate: >-
          Hermiticity of an operator this module formed -- a branch
          operator, a pinched power -- before a spectral decomposition is
          taken of it.
        window: >-
          declared, relative. What the run then consumes is the Hermitian
          part, which is Hermitian by construction, the window bounding the
          discarded anti-Hermitian half; the substitution is recorded like
          any other repair of a computed object. Above the window the
          operator is refused, no spectral decomposition being taken of it.
        locator: "thm:gradient; lem:dk; def:branch"

    rows_the_submodule_declares:
      note: >-
        The remaining Group B rows decide objects the solver produced -- the
        iterates, the oracle returns and the support comparison of (H-SUPP)
        -- and are declared in
        spec/modules/meat-core/frank-wolfe/interface.yaml, with their
        windows, their reasons and the two repairs they license. They are
        named here so that a reader of this section knows the group is not
        complete in this file.
      keys: [iterate_positivity, iterate_repair_window, iterate_coupling, constraint_rows, oracle_repair_window, support_cutoff, optimizer_gap]
      locator: "frank-wolfe/rem:fo-one-ruler; frank-wolfe/rem:fo-check-exposures; frank-wolfe/rem:fo-iterate-checks; frank-wolfe/rem:fo-oracle-repair; frank-wolfe/rem:fo-iterate-repair; frank-wolfe/req:iterate-checks; frank-wolfe/req:iterate-repair; frank-wolfe/req:oracle-repair; frank-wolfe/req:support-rank-check; frank-wolfe/def:relaxed-feasible-set"

  group_c_retired:
    preamble: >-
      Thresholds this module does not declare, each with what stands in its
      place, so that a reader who looks for one finds its disposition. No
      row reuses their keys.
    rows:

      - machine_key: "the tolerance window on bob_povm_admission"
        disposition: >-
          There is no window on the admission of the declared receiver
          family: there is no tolerance input, and the predicate is decided
          at exactly zero (`group_a_declared_data`, `bob_povm_admission`).
          prop:optol-nobound is the reason no such window could license a
          key-length claim, and the defect-named refusals such a window
          would produce are among `refusal_reasons.retired`.

      - machine_key: limit_membership
        disposition: >-
          The membership test of the alpha -> 1 validation oracle. The oracle
          is a validation statement and no key-length claim passes through
          it, so this number is reached only on a run that invokes it. It
          goes with the code it guards: an implementation that does not run
          the oracle carries neither, and one that does declares it as a
          Group B number, the object it decides being one the module
          computed.
          Locator: thm:oracle; rem:oracle; req:limit-not-a-bound.

      - machine_key: branch_support_dim
        disposition: >-
          A window on the singular values of the Kraus stack of eq:Kstack at
          the value of `support_cutoff`, at which the reference of the
          (H-SUPP) rank comparison, dim W as the rank of that stack, would be
          read. It measures in the wrong units: a direction enters the branch
          operator with weight sigma^2, so a direction counted by it lies
          below the operator's count at every iterate with a
          well-conditioned input, and in every recorded run the comparison at
          that window withdrew at every iterate. The predicate is decided on
          every run at a window derived from `support_cutoff` (its square
          root on singular values), which the submodule's `support_cutoff`
          row states.
          Locator: frank-wolfe/rem:fo-one-ruler;
          frank-wolfe/req:support-rank-check; def:branch-support (eq:Kstack).

      - machine_key: certificate_series
        disposition: >-
          The series-truncation target of a numerical lower-bound
          certificate. No statement of this contract mentions a series
          truncation, so there is nothing for it to guard; the tier it would
          serve is not built in this repository (PRINCIPLES.md section 10).

      - machine_key: homogeneity
        disposition: >-
          A test that a declared operator right-hand side is a scalar
          multiple of the declared marginal. The predicate is not numerical:
          a licensed entry declares its scalar and the right-hand side is
          constructed from it, so licensing is a type check on the declared
          form. Nothing is compared, so no window is declared.
          Locator: def:homog; rem:scalar-declaration; rem:cgate.

      - machine_key: marginal_support_floor
        disposition: >-
          Which eigenvalues of the declared marginal span its support, and
          hence its rank. No run needs the rank: the Choi input register is
          asked only to contain the support, the frame identity then holds
          for every admissible frame, and thm:choi maps the Choi feasible set
          onto the state one in each -- so the value is the same and the
          truncation the row would decide has no site. The full frame is
          always available and is exact.
          Locator: def:support-frame; lem:choi-marginal; thm:choi;
          rem:basis-invariance.

# ---------------------------------------------------------------------------
# fail_closed
#   The refusal rules, in the order a conforming implementation decides
#   them. Every rule is decided before a number is reported; `reasons` names
#   the refusal string where one is spelled, and `fixed_by` names the claim.
#   A rule whose outcome is not a refusal says so on its own row.
# ---------------------------------------------------------------------------
fail_closed:

  policy: >-
    No rule below is decided at a window on declared data, no defect is
    measured on declared data, and no rule repairs anything this module was
    handed. The rules that do carry a window decide objects this module
    computed and say so. No default value is ever substituted for a missing
    datum.

  how_a_rule_is_decided: >-
    Stated once for the whole set. An operator identity or inequality on
    declared data is decided entry by entry on the declared binary64 numbers
    read as the dyadic rationals they are, positivity by an exact decision
    and not by a floating-point eigenvalue; a structural condition by
    comparison of declared labels; a summation condition by emulating the
    binary64 additions in the declared order; a type condition by inspecting
    which of two objects a slot holds; a presence condition by testing
    presence and never truth; an acceptance-side condition in exact rational
    arithmetic.
    Locator: def:declaration; req:exact-admission; def:classes (c); the
    `exact_equality` and `exact_island` conventions.

  rows:

    - rule: required_datum_present
      order: 1
      checked: >-
        Every input row marked `presence: always` is present, and every
        parameter row has a declared value in its domain.
      outcome: "refusal before anything is constructed, naming the missing datum"
      reasons: ["no string is spelled; the refusal names the datum"]
      fixed_by: "the `fail_closed` convention; def:admissible-declaration (i); req:objective-alpha-domain; req:key-length-alpha-domain"
      why: >-
        A defaulted datum decides a security-relevant question on nobody's
        authority.
      fixed_here: >-
        No claim spells a string for it, and this file spells none either
        rather than inventing a vocabulary the claims do not ask for. The
        naming requirement is the convention's.

    - rule: declaration_admissible
      order: 2
      checked: >-
        The declared families are exactly admissible on the numbers this
        module was handed: the sector map compared in its three components
        on every declared Q-operator family; Hermiticity, positive
        semidefiniteness and completeness per block; the declared-order
        completeness sum rounding nowhere; the marginal's predicates and its
        trace; each constraint operator Hermitian per block with its declared
        tag and typing.
      outcome: "refusal, naming the predicate and the block, outcome or entry index at which it first failed; no result of any kind"
      reasons: [sector_map_disagreement, bob_povm_summation_rounds, declaration_not_exactly_admissible]
      fixed_by: "req:exact-admission; def:declaration (the exact-admissibility paragraph and eq:declorder); def:admissible-declaration (ii), (iii), (vi); def:homog"
      why: >-
        A declaration that fails a predicate is a modelling error, not noise,
        and this module repairs nothing it was handed. The compiler decided
        the same predicates on the same numbers before emitting them; a
        consumer decides and never infers, so the decision is taken again
        here.

    - rule: bundle_validation
      order: 3
      checked: >-
        That outcome alphabets, bases, subsystem order and dimensions agree
        across the compiled maps, the reduction and the statistics; that the
        compiled finite measurement is the target named by the reduction;
        that every physical or source reduction is represented in the chain;
        and that the active theorem profile supports the declared trusted
        marginal, attack set, test-statistics model and round structure --
        including that a fixed-fraction decomposition offered without a
        trusted-selector argument is rejected.
      outcome: "a hard error, never a warning and never a repair: a bundle that does not validate produces no result at all"
      reasons: ["no string is spelled; the refusal names the check"]
      fixed_by: "spec/architecture.md 3.6 and 6; the `test_statistics_model` convention; def:admissible-declaration (i)"
      why: >-
        In one process a composition root is not a module; it is the input
        validation this module runs before it solves anything. The checks
        are not optional and only their owner is fixed.
      fixed_here: >-
        The row is the architecture's and not a claim's. No claim of this
        module states the bundle-validation list; spec/architecture.md 3.6
        does, and names this module as its owner.

    - rule: maps_cross_validated
      order: 4
      checked: >-
        The generated maps satisfy what thm:protocol-channel and
        lem:branch-maps state of them: isometry and channel property, the
        statistics marginal agreeing with the affine statistics map, the
        branch maps completely positive and trace-non-increasing with
        orthogonal supports, and the per-sector restrictions summing to the
        whole on a sector-block-diagonal state.
      outcome: "a hard error; the outcomes are emitted in `map_validation_report`"
      reasons: ["no string is spelled; the report names the check"]
      fixed_by: "thm:protocol-channel (i), (iii); lem:branch-maps (i)-(iii); spec/architecture.md 6"
      why: >-
        The maps are generated from the declaration and are no declared
        datum. Generating them and cross-validating the result closes the
        gap where a protocol as described and a protocol as solved diverge
        silently.

    - rule: acceptance_geometry_known
      order: 5
      checked: >-
        The acceptance set's geometry tag is one this contract's
        acceptance-side minimisation is stated for. A declaration with any
        other tag is refused at admission
        (frank-wolfe/req:acceptance-geometries) and never reaches this rule.
      outcome: >-
        None: no run reaches this rule, the refusal being at admission.
      reasons: []
      fixed_by: "frank-wolfe/req:acceptance-geometries; frank-wolfe/rem:acc-side (the two geometries); def:admissible-acceptance-set"
      why: >-
        The taxonomy is the statistics module's, and this module reads the
        tag rather than guessing; a geometry whose exact minimisation this
        contract does not state cannot discharge the acceptance-side
        inequality of the first-order bound, and guessing one would put an unverified minimum inside
        the bracket.

    - rule: licensed_class_and_licence
      order: 6
      checked: >-
        Where m >= 1 and a key length is wanted: (i) every entry of the
        constraint list is in the licensed form of the declared source mode
        -- a type check on the declared tag, comparing no numbers -- and
        (ii) the attack-set licence record is present.
      outcome: >-
        A refusal of the key-length output, not of the run
        (req:constrained-key-gate): the key-length entry points raise
        SecurityGateError naming each failing part; a run solves the
        program, reports both numbers, emits no key length and carries no
        key-length claim, its key-length reason naming each failing part
        unless h_low is infinite, which is reported first. Numerical use
        outside the security chain is unrestricted, and its output does not
        reach eq:keylength.
      reasons: ["no string is spelled; the outcome is the absence of a key length with the gate named"]
      fixed_by: "def:homog; thm:constrained-accumulation; cor:constrained-key-length; rem:cgate; req:constrained-key-gate; req:degenerate-gate-report; protocol-compiler/ass:atk"
      why: >-
        A trusted marginal and a non-empty constraint list are the two
        inputs that delete attacks from the model, and each is admitted into
        the security chain only behind a supplier attestation this module
        never verifies. The gate degenerates in untrusted-source mode, where
        part (i) is vacuously true, and at d_A = 1, where it rejects only a
        general tag a producer can avoid; there the gate rests entirely on
        part (ii) (rem:cgate). The compiler's own flag
        decides the same type check on the same tags, so the flag and this
        gate agree (row (5) of `consumer_agreement`).

    - rule: security_statement_not_vacuous
      order: 7
      checked: >-
        At parameter validation, before any solve and before any key length
        is computed: eps_pa + eps_ev + 2 eps_auth < 1 for the declared budgets
        (at the default eps_auth = 0, eps_pa + eps_ev < 1). The sum is
        compared exactly on the three declared binary64 numbers and nothing else is
        read; no state, no acceptance set and no constraint list enters the
        decision.
      outcome: "refusal of the run, before the program is built: reason `security_statement_vacuous`, naming eps_pa, eps_ev, eps_auth and their sum. No result of any kind, and in particular no key length and no tier."
      reasons: [security_statement_vacuous]
      fixed_by: "req:security-statement-not-vacuous; cor:composed-security; cor:keylength-bound (b) and its proof; thm:keylength; the eps_pa, eps_ev and eps_auth parameter rows"
      why: >-
        A security statement whose parameter, eps_pa + eps_ev + 2 eps_auth
        (cor:composed-security), is at least 1 is empty: it excludes nothing, so a key length reported under it carries
        no security claim whatever its value. cor:keylength-bound (b) states
        the corner rather than claiming it -- its proof exhibits ell = 1 at
        eps_pa = eps_ev = 1, lambda_ec = 0 under a security statement that
        is empty -- and the arithmetic there is correct. What this rule
        decides is not the mathematics but what a run may advertise: a
        record carrying key_length with reported_tier `first-order` at a
        parameter point the corollary disowns is the output PRINCIPLES.md
        section 2.3 refuses, and refusing the corner is the narrowing the
        engine can make while the claims stay as they are. The narrowing is
        of a corner no run wants: every usable budget pair sums far below
        one.
      fixed_here: >-
        req:security-statement-not-vacuous states this gate and
        cor:keylength-bound (b) the corner: the corollary's hypotheses admit
        eps_pa, eps_ev in (0, 1], and the requirement refuses every run whose
        budgets sum to at least 1.

    - rule: alpha_in_the_profile_domain
      order: 8
      checked: >-
        The Renyi order lies in the domain of the claim the reported number
        is an instance of: the key-length interval for any key-length
        statement, the wider interval for the structural and program claims.
      outcome: "no key length is reported outside the key-length interval (the run tier's outer search, which is not this module's, never reports a length obtained outside the active profile's domain: the alpha parameter row)"
      reasons: ["no string is spelled"]
      fixed_by: "req:key-length-alpha-domain; req:objective-alpha-domain; rem:alpha-domain; thm:keylength; cor:keylength-bound; spec/architecture.md 6"

    - rule: infeasible_acceptance_set
      order: 9
      checked: "Whether the value of the program is infinite."
      outcome: >-
        The value is propagated and never clamped; no key-length claim is
        emitted and the declaration/acceptance mismatch is reported.
        Declaring an incompatible acceptance set is a specification error
        the statistics module surfaces.
      reasons: ["no string is spelled; the report names the mismatch"]
      fixed_by: "req:infinite-value; prop:value-range (iv); rem:hlow-range; thm:accumulated-entropy; spec/architecture.md 6"

    - rule: unreachable_acceptance_set
      order: 10
      checked: >-
        On a checked run (honest law or envelope supplied by the caller, or a
        constraint entry the caller declared; `statistics_check: off` opts
        out, recorded), once and before any Renyi order is evaluated: the
        lower bound b the run forms on the value of the dropped program with
        every pair dropped, at an order alpha_0 fixed before any order is
        evaluated (the run's fixed order, or the lowest order its search
        evaluates where the search fixes it in advance, else the lower end
        of the declared search domain), with the run's method, iteration cap
        and gap target and the share `statistics_check_budget_share` of the
        wall budget of one evaluation of the run, and at the tier it reaches, whatever the
        sign of the solve's estimate. That
        value is alpha/(alpha-1) times the minimal divergence between the
        accepted distributions and the statistics of the feasible set, so
        b > 0 bounds that divergence from below, and with
        x = n (alpha_0-1)/alpha_0 b devices the declaration admits pass the
        acceptance test with probability at most 2^(-x), the cap
        (prop:model-pass-bound (ii)). With tau the run option
        `min_model_pass_probability` in (0, 1], default 1/2, a run with
        b > 0 and 2^(-x) <= tau (x >= log2(1/tau)) is refused, decided
        exactly where tau is a power of two and otherwise by a rigorous
        enclosure of log2(1/tau), an undecided comparison refusing; the
        decision carries the tier of b. Where no bound was formed or
        b <= 0 nothing is refused. Every run, checked or not, records
        whether it is checked and why not.
      outcome: >-
        A refused run is refused as a whole before any order is evaluated
        and reports no key length. A checked run records b or the reason
        none was formed, tau, x with the tier of b where b > 0, how the
        comparison was decided and whether the run was refused; the stop
        cause, as the solver reports it, where the solve ran; where it
        returned a point, the estimate; and, where a bound was formed, the
        gap and the proven part n f at each order evaluated as a diagnostic.
        The report shows the cap as a probability (2^(-x) with an upward
        rounded decimal approximation), with the tier of b, beside each key
        length or in place of one on a refused run, and never a share of
        the key length or a number of bits.
      reasons: [acceptance_set_unreachable]
      fixed_by: "req:unreachable-acceptance-set; prop:minimal-divergence; prop:model-pass-bound; def:dropped; frank-wolfe/cor:fo-dropped; frank-wolfe/lem:certified-bracket (iv); frank-wolfe/req:certified-evaluation"

    - rule: negative_estimate
      order: 11
      checked: "Whether the computed objective at the returned point is negative."
      outcome: "refusal, typed, naming the value and the point; the estimate is never clamped to zero"
      reasons: [negative_objective]
      fixed_by: "frank-wolfe/req:negative-estimate-refused; frank-wolfe/rem:fo-negative-values; prop:value-range (i); thm:branch-formula (the cone clause)"
      why: >-
        The objective is non-negative at every point of the exact feasible
        set, so a negative value is evidence that a hypothesis does not hold
        of the point it was computed at. Unlike the first-order bound the
        estimate is not a lower bound, and zero cannot stand in for it:
        replacing it by zero would report a plausible number in place of a
        detected inconsistency. A bare exception is not a conforming
        implementation of this rule.

    - rule: first_order_hypotheses
      order: 12
      checked: >-
        The submodule's rows: the positivity and support hypotheses at each
        iterate, the absence of a gradient perturbation, and the relaxed
        membership of the consumed point with its acceptance factor formed on
        the exact island. Nothing is checked of the oracle's return or its
        status (frank-wolfe/req:verified-feasible-side).
      outcome: >-
        an iterate at which a check fails contributes no bracket, with a
        machine-readable reason naming the hypothesis that failed; where no
        iterate is left the first-order number is withdrawn and the tier
        falls to the estimate; the run is not refused.
      reasons: ["the submodule's, see frank-wolfe/interface.yaml"]
      fixed_by: "frank-wolfe/req:first-order-withdrawal; frank-wolfe/thm:firstorder"

  no_row_repairs_declared_data: >-
    Binding. No row of this table projects, clamps, symmetrises or
    renormalises a declared operator, at any tolerance and for any reason,
    and no row admits a datum that failed a predicate. The two positivity
    repairs this contract licenses are on objects this module computed, are
    recorded, and are the submodule's rows.
    Locator: def:declaration; conventions, `no_snapping`;
    frank-wolfe/rem:fo-oracle-repair; frank-wolfe/rem:fo-iterate-repair.

# ---------------------------------------------------------------------------
# refusal_reasons
#   The machine strings. `frozen_spellings` holds the strings of the frozen
#   oracle registry's reason vocabulary that this module and its submodule
#   emit, each named by a claim and listed with it below;
#   `this_files_own_spelling` holds the strings this file spells, for
#   refusals the claims require and name no string for and for the gates
#   whose requirements name the string this file spelled
#   (`security_statement_vacuous`, req:security-statement-not-vacuous;
#   `acceptance_set_unreachable`, req:unreachable-acceptance-set);
#   `retired` holds the frozen strings no run emits. An implementation emits
#   these spellings and no synonyms.
# ---------------------------------------------------------------------------
refusal_reasons:

  frozen_spellings:
    core: [sector_map_disagreement, bob_povm_summation_rounds, choi_isometry_inexact, negative_objective]
    submodule: [gradient_hypothesis_positivity, gradient_hypothesis_support, gradient_perturbation_applied, iterate_not_feasible]

  this_files_own_spelling:
    - declaration_not_exactly_admissible
    - security_statement_vacuous
    - certification_refused
    - acceptance_set_unreachable

  implementation_reasons_beside_the_vocabulary:
    preamble: >-
      Strings an implementation emits that are not refusals and are not
      withdrawals, listed so that a reader of a run record finds every string
      it can carry in one of these blocks. They travel in
      `optimizer_certificate.assurance_reason`, which is a diagnostic field on
      a result that exists; a refusal produces no output at all, so no
      implementation string can travel on one. The claims name the outcome
      and leave the diagnosis open, which is why these are named here rather
      than spelled as contract strings.
    rows:
      - reason: acceptance_set_empty
        condition: >-
          The declared acceptance set is well formed and its denotation is
          empty -- which satisfies def:admissible-acceptance-set, an empty set
          being a closed convex subset of the simplex, so the refusal cannot
          come from the definition and has to be decided. eq:hlow-def is then an infimum
          over nothing, h_low = +infinity is propagated and never clamped,
          and no key-length claim is emitted.
        fixed_by: "req:infinite-value; rem:hlow-range; def:admissible-acceptance-set"
      - reason: acceptance_set_ill_formed
        condition: >-
          The declared acceptance data are not well formed for the geometry
          they claim. Decided before the denotation is looked at, a set whose
          data contradict its own form denoting nothing to take an infimum
          over.
        fixed_by: "req:acceptance-set-admission; def:admissible-acceptance-set"
      - reason: first_order_no_bracket
        condition: >-
          The run reached no first-order bracket to report and nothing
          failed. The tier is achieved and never requested
          (`retired_parameter_rows`), so there is no request to have
          declined, and the record simply carries no bracket.
        fixed_by: "spec/architecture.md 2.8; foundations/req:tiers; frank-wolfe/rem:fo-interface"
      - reason: objective_infinite
        condition: >-
          The objective is +infinity at the returned point, so eq:hlb has no
          finite bracket to take a maximum of. The value is propagated and
          never clamped (req:infinite-value) and no key length is emitted;
          this names the route rather than the symptom the three
          acceptance-side diagnoses share with it.
        fixed_by: "req:infinite-value; rem:hlow-range; frank-wolfe/thm:firstorder"
      - reason: first_order_reported
        condition: >-
          The run earned the tier: at least one iterate contributed a
          bracket, every hypothesis of frank-wolfe/thm:firstorder having held
          at it. Not a failure of anything, and the one value of this field
          that is not a reason something was withheld.
        fixed_by: "frank-wolfe/thm:firstorder; frank-wolfe/req:first-order-withdrawal; frank-wolfe/rem:fo-interface"
    fixed_here: >-
      The spellings are the implementation's and this block is this file's.
      No claim states any of them: rem:hlow-range and req:infinite-value name
      the outcome of an unusable acceptance set and leave the diagnosis to an
      implementation, and the achieved-tier and no-bracket values are fields
      of a record no claim knows is emitted. What the block fixes is that
      they are disclosed rather than left for a consumer to discover in a
      record.

  table:

    - reason: sector_map_disagreement
      condition: >-
        The map a declared Q-operator family carries disagrees with the
        declared sector map in the block kind, in the list of block
        identifiers or in their order. The refusal names the first position
        at which the two lists differ.
      fixed_by: "protocol-compiler/def:declaration (operators on Q are block lists), which def:declaration reads; foundations/def:exact-admissibility (T); spec/architecture.md 2.9"
      note: >-
        The comparison is the platform's structural check, which every
        consumer performs, and it is decided before the other admission
        predicates.

    - reason: bob_povm_summation_rounds
      condition: >-
        For some sector, the declared-order completeness sum of the receiver
        family does not round nowhere. The refusal carries the sector and the
        outcome index at which the first inexact addition occurred, and the
        declared order.
      fixed_by: "def:declaration (eq:declorder and the exact-admissibility paragraph); req:exact-admission"
      also_spelled_by: >-
        spec/modules/protocol-compiler/interface.yaml, which decides the same
        predicate on the same family before emitting it. One string for one
        refusal, on both sides of the boundary.

    - reason: declaration_not_exactly_admissible
      condition: >-
        A declared family fails Hermiticity, positive semidefiniteness or
        completeness per block, or the declared marginal fails its predicates
        or its trace, or a declared constraint operator is not Hermitian per
        block. The refusal names the predicate and the block, outcome or
        entry index at which it first failed.
      fixed_by: "req:exact-admission; def:declaration (the exact-admissibility paragraph: a declaration is exactly admissible or it is refused); def:admissible-declaration (ii), (iii), (vi)"
      fixed_here: >-
        The spelling is this file's. req:exact-admission requires the refusal
        and spells no string. One spelling serves the one exact refusal,
        whichever predicate failed, the refusal naming the predicate; the
        defect-named strings of the frozen vocabulary are among `retired`,
        there being no measured defect to carry. It is not a new coinage:
        spec/modules/reductions/wpfss/interface.yaml spells
        `declaration_not_exactly_admissible` for the same decision on the same
        kind of datum, and reusing it is better than a second vocabulary for
        one predicate.

    - reason: security_statement_vacuous
      condition: >-
        The declared budgets satisfy eps_pa + eps_ev + 2 eps_auth >= 1 (at the
        default eps_auth = 0, eps_pa + eps_ev >= 1). Decided at parameter
        validation, before any solve and before any key length is computed;
        the refusal names eps_pa, eps_ev, eps_auth and their sum.
      fixed_by: "req:security-statement-not-vacuous; cor:keylength-bound (b) and its proof; thm:keylength"
      ground: >-
        At eps_ev = 1 the correctness statement is empty and the corner
        carries no security claim -- which is why clause (b) is stated for
        eps_ev < 1 and its proof exhibits the excluded corner rather than
        claiming it -- and more generally a (eps_pa + eps_ev)-security
        statement with eps_pa + eps_ev >= 1 is empty: it constrains no
        adversary, so no length reported under it is a security claim of any
        strength. The expression of eq:keylength-h is evaluated correctly
        there and the number it returns means nothing.
      fixed_here: >-
        The spelling is this file's; the gate is
        req:security-statement-not-vacuous, which names the string.

    - reason: choi_isometry_inexact
      condition: >-
        The two identities of the constructed support frame do not hold at
        exactly zero entrywise as binary64 data.
      fixed_by: "req:frame-constructed; def:support-frame (eq:iota); the `choi_isometry` threshold row"
      note: >-
        The object is one this module constructed, so this is a Group B
        refusal and carries no declared number: both constructions meet the
        identities by arithmetic on the data zero and one.

    - reason: negative_objective
      condition: >-
        The computed estimate at the returned point is negative. Names the
        value and the point.
      fixed_by: "frank-wolfe/req:negative-estimate-refused; frank-wolfe/rem:fo-negative-values"

    - reason: certification_refused
      condition: >-
        The run set the submodule's option `certified_evaluation` to
        `strict` and is not reported at the certified tier: no point was
        certified, the rigorous arithmetic is unavailable, an assumption of
        the category numerical-trust is invoked on the run, or the
        declaration carries a weight routed from a receiver weight evaluated
        in floating point. Names the reasons the certified evaluation
        recorded. No key length is reported.
      fixed_by: "frank-wolfe/req:certified-evaluation (vi), (vii), (viii)"
      note: >-
        A run without the strict option never refuses for this cause: it
        keeps its first-order number, key length and tier, with the
        reasons. A run whose companion certifies no point but whose number
        is certified on the searched declaration (the fallback of
        frank-wolfe/req:certified-evaluation (i)) is reported at the
        certified tier and does not refuse under the strict option either;
        it rests on A-SNAP for the blocks the companion carried, named in its
        record, and only the foundations option strict_snaps, which keeps the
        fallback from running, refuses on that premise. The per-point and
        per-run reasons are
        spec/modules/meat-core/frank-wolfe/interface.yaml's
        (`certified_evaluation.reasons`).

    - reason: acceptance_set_unreachable
      condition: >-
        On a checked run (`statistics_consistency`), the bound b on the value
        with every pair dropped is positive and the cap 2^(-x),
        x = n (alpha_0-1)/alpha_0 b, on the probability that devices as
        declared pass the acceptance test is at most
        `min_model_pass_probability` (an undecided comparison included). The
        run is refused as a whole and reports no key length. Names b, its
        tier, alpha_0 and the cap.
      fixed_by: "req:unreachable-acceptance-set (iv); prop:model-pass-bound (ii); prop:minimal-divergence (iv)"
      note: >-
        Decided once per run, after the check's solve and before any order
        is evaluated, so a refused run spends no evaluation. A positive bound
        alone refuses nothing: the cap reaching the threshold does. The
        numbers are in `statistics_consistency`, not in the refusal.

    - reason: "the four withdrawal strings"
      owner: "meat-core/frank-wolfe"
      strings: [gradient_hypothesis_positivity, gradient_hypothesis_support, gradient_perturbation_applied, iterate_not_feasible]
      condition: >-
        Each names why an iterate contributes no bracket to the first-order
        number; where no iterate is left the number is withdrawn and the
        tier falls to the estimate. None refuses the run. Their conditions,
        their claims and the acceptance-geometry string that joins them are
        spec/modules/meat-core/frank-wolfe/interface.yaml's.
      fixed_by: "frank-wolfe/req:first-order-withdrawal; frank-wolfe/rem:fo-interface"

  retired:
    preamble: >-
      Strings of the frozen registry's vocabulary that no run of this module
      emits. None is reused and none is respelled.
    rows:
      - reason: declared_tolerance_absent
        why: "There is no tolerance input to be absent (`retired_input_rows`)."
      - reason: declared_tolerance_out_of_domain
        why: "There is no tolerance input and no domain to check."
      - reason: bob_povm_hermiticity_defect
        why: >-
          It would name a measured Hermiticity defect exceeding a declared
          tolerance. No defect is measured on declared data; the predicate is
          decided exactly and its failure is
          `declaration_not_exactly_admissible`, naming the predicate.
      - reason: bob_povm_negative_part
        why: "As above, for the negative part."
      - reason: bob_povm_completeness_defect
        why: "As above, for the completeness defect."
      - reason: bob_povm_not_evaluable
        why: >-
          It would name a family admitted with a nonzero Hermiticity or
          positivity defect. No family is admitted with a defect, so the
          state it names does not arise.
      - reason: declared_operator_tolerance_open
        why: >-
          It would force the tier to the estimate for a declared family
          admitted with a nonzero defect. No family is admitted with a
          defect.
      - reason: assurance_tier_not_available
        why: >-
          It would refuse a request naming a tier. There is no tier
          request (`retired_parameter_rows`): every tier of
          foundations/def:tiers, the third included, is reached and never
          requested, so there is no request to refuse and no value to
          reserve.
      - reason: oracle_not_optimal
        why: >-
          It would withdraw an iterate's bracket on an oracle status that does
          not assert optimality. No bracket reads the oracle's return or its
          status: the feasible side is a lower bound verified without them
          (frank-wolfe/req:verified-feasible-side), and
          frank-wolfe/req:first-order-withdrawal withdraws for neither.

# ---------------------------------------------------------------------------
# consumer_agreement
#   The seven places where this module's contract and the compiler's must
#   agree, mirrored from this side. They are the compiler's own
#   `consumer_agreement` rows; that file writes them from the supplier's
#   side with the meat-core locators typeset and edgeless, because the
#   compiler cannot depend on the module that depends on it. This side can,
#   and does, so the locators here are edges of the claim files.
#
#   The three declaration twins are not duplicated: def:declaration,
#   def:feasible and def:homog cite protocol-compiler/def:declaration,
#   def:feasible and def:homog with a `uses` edge, so rows 1, 2, 4 and 5
#   below rest on one definition read from both sides, and a proof here may
#   lean on the compiler's text. What stays a `mentions` edge and an
#   interface check, which a human reviewer diffs, is the rest: def:admissible-declaration
#   against the compiler's def:target (the edge on def:declaration's
#   lead-in), the exact-admissibility paragraph of def:declaration against
#   its def:exact (row 3), and def:roundmodel against the round model the
#   compiler's ass:atk names.
# ---------------------------------------------------------------------------
consumer_agreement:

  supplier: protocol-compiler
  supplier_record: "spec/modules/protocol-compiler/interface.yaml, `consumer_agreement`"
  locator: "def:declaration, def:feasible and def:homog, each using the protocol-compiler definition of the same name; def:declaration (the exact-admissibility paragraph); def:admissible-declaration; def:roundmodel"

  rows:

    - point: 1
      agreement: >-
        This module reads the emitted declaration slot by slot under the
        compiler's machine keys, with every Q-operator a block list against
        one sector map, and compares that map in three components -- the
        block kind, the block identifiers and their ordering.
      this_module: "def:declaration, reading protocol-compiler/def:declaration (operators on Q are block lists); the `inputs` table's `read_under` fields; conventions, `operator_form`"
      the_supplier: "protocol-compiler/def:declaration; def:exact (T); its `sector_index_set`, `sector_dims` and `sector_block_kind` output rows"
      the_comparison: >-
        The comparison is stated in def:declaration and in
        spec/architecture.md 2.9, and its third component has the key
        `sector_block_kind` on the wire.

    - point: 2
      agreement: >-
        This module generates its single-round protocol channel, its branch
        maps and its test-statistics map from those slots, and
        cross-validates the result; the compiler emits no such object and
        this module accepts none hand-written.
      this_module: "def:maps; thm:protocol-channel; lem:branch-maps; def:branch; the `map_validation_report` output row"
      the_supplier: "protocol-compiler/def:declaration; def:compile (every slot a stated function of the specification)"

    - point: 3
      agreement: >-
        This module requires its well-formedness assumption of the
        declaration and decides every operator predicate of it exactly, at
        zero defect and with every declared sum verified to round nowhere --
        which is the compiler's own exactness definition, decided on the same
        numbers before they were emitted.
      this_module: "def:admissible-declaration (i)-(viii); def:declaration (the exact-admissibility paragraph); req:exact-admission; req:declaration-admission; `group_a_declared_data`"
      the_supplier: "protocol-compiler/def:target D(i)-D(viii); def:exact; def:validator; thm:validator-soundness (i), (ii)"
      at_which_reading: >-
        The two rules coincide everywhere and at one reading: all five
        conditions are decided at exactly zero, unconditionally, on both
        sides, and neither side takes a tolerance input. spec/architecture.md
        2.8 says the same: every consumer decides exactly and carries no
        tolerance row (foundations/req:consumer-decides-exactly).
      two_conditions_are_deliberately_stronger_on_the_supplier_side: >-
        The compiler's D(iii) restates Hermiticity of each constraint block
        so that its check V3 has a target condition to be complete for, and
        its D(i) requires the index map's restriction to the sectors to be
        the sector map's own total order, which has no counterpart in
        def:admissible-declaration. Both differences are in the safe direction -- a declaration
        well-formed there is well-formed here, never the reverse -- and both
        are disclosed on that side.

    - point: 4
      agreement: >-
        This module minimises over the feasible set of eq:feas, which carries
        no parameter, and it is the set the compiler denotes by Feas:
        def:feasible defines it as the set of protocol-compiler/def:feasible
        -- one symbol, one referent, one definition. The compiler's
        well-formedness condition includes non-emptiness of that set, which
        is def:admissible-declaration (vii) here, and a declaration it emits
        establishes it; this module reports a key length only on a declaration
        the compiler emitted (req:compiled-declaration-only).
      this_module: "def:feasible (eq:feas, eq:feas-modes); def:admissible-declaration (vii); thm:reduction"
      the_supplier: "protocol-compiler/def:feasible; rem:wellposed; thm:feasibility; def:validator V7"
      and_the_block_restriction: >-
        The compiler states the licence to minimise over the sector-block
        form as a consumer obligation it does not discharge
        (protocol-compiler/rem:block-restriction). Step 1 of thm:reduction is
        that statement's proof, so the obligation is a theorem here, no claim
        of either module declares it, and no ledger carries a row for it.

    - point: 5
      agreement: >-
        This module admits a non-empty constraint list into a key-length
        statement only under def:homog, whose licensed class is the
        compiler's (protocol-compiler/def:homog) -- a type check on the tag
        of each entry, comparing no numbers -- plus the supplier's attack-set
        licence; and for a `homogeneous` entry it constructs the right-hand
        side from the same declared scalar and the same declared marginal
        the compiler emits.
      this_module: "def:homog; rem:cgate; rem:homog; thm:constrained-accumulation; cor:constrained-key-length; req:constrained-key-gate; the `constraint_list` and `attack_set_license` input rows"
      the_supplier: "protocol-compiler/def:homog; def:eligible (G3); its `constraint_rhs_tag` output row; protocol-compiler/ass:atk"
      one_attestation: >-
        One attestation, one id: protocol-compiler/ass:atk, under this
        module's short id A-ATK and its machine key, and the record the
        compiler tests for presence at its gate is the record
        thm:constrained-accumulation rests on.

    - point: 6
      agreement: >-
        This module computes the joint-distribution map by the same formula
        the compiler emits its acceptance-statistic map for, and reads the
        acceptance alphabet the compiler emits for the statistics module.
      this_module: "thm:protocol-channel (ii), (iii) (the joint distribution and the statistics marginal); def:maps"
      the_supplier: "protocol-compiler/def:phi; thm:measurements-and-statistics (iv); rem:phitotal"

    - point: 7
      agreement: >-
        This module accumulates the completeness sum it re-forms over the
        outcome index in the declared order, and the order is the one this
        contract fixes: def:declaration declares a total order as part of
        the declared outcome alphabet and declares an order for no other
        sum, while the sector sum and the trace are accumulated in orders
        that the emitted array and the sector map determine.
      this_module: "def:declaration (eq:declorder); the `summation_order` convention; the `label_index_map` input row"
      the_supplier: "protocol-compiler/def:compile (the supplier's order becomes the index map's component); def:exact (S); its `label_index_map` output row; its `summation_order` convention"
      where_the_order_lives: >-
        The order is part of the declaration because the datum it governs is
        declared, so it is a paragraph of def:declaration, and that is the
        citation for it.

# ---------------------------------------------------------------------------
# assumption_ledger
#   The rows of the emitted `assumption_ledger` key, each an id and its
#   machine key. The own rows are this module's, and their machine keys bind
#   the implementation. The inherited rows carry the owning module's short
#   id and key, short ids being repository-wide. The submodule emits no row:
#   its A-LMO is superseded, and its key stays in the submodule's own
#   interface file. When each key is emitted is `emission_rule`; what an
#   assumption says and what fails if it is violated is its claim file.
#
#   Which claims declare an assumption is a fact about the graph and is
#   named by the command that computes it, never by a count or a list
#   (spec/claim-format.md section 4.5; PRINCIPLES.md section 7):
#     python -m harness.check_claims --dependents meat-core/<assumption label>
#   and, for the closure of a theorem,
#     python -m harness.check_claims --assumptions meat-core/<label>
# ---------------------------------------------------------------------------
assumption_ledger:

  emitted_as: "the `assumption_ledger` output key: the machine keys, per `emission_rule`"
  the_command: "python -m harness.check_claims --dependents meat-core/<assumption label>"
  the_closure_command: "python -m harness.check_claims --assumptions meat-core/<label>"
  closures_a_reader_should_re_derive: >-
    The ones that decide what a result carries:
    `--assumptions meat-core/thm:keylength` (secrecy of the unconstrained
    and constrained key length), `--assumptions
    meat-core/lem:ev-correctness` (correctness), `--assumptions
    meat-core/cor:composed-security` (the composed security statement with
    authentication), `--assumptions
    meat-core/thm:constrained-accumulation` (the constrained accumulation,
    where the attack-set attestation is spent) and `--assumptions
    meat-core/frank-wolfe/cor:fo-keylength` (the first-order key length,
    which is the headline). Run them; this file names no closure it does not
    compute.

  own_rows:
    - {id: A-KEYREG, machine_key: key_register}
    - {id: A-HASH, machine_key: pa_hash_family}
    - {id: A-SEED, machine_key: post_processing_seeds}
    - {id: A-FIXED, machine_key: parameters_fixed_before_run}
    - {id: A-CONFORM, machine_key: post_processing_as_analysed}
    - {id: A-AUTH, machine_key: classical_channel_authenticated}
    - {id: A-LAB, machine_key: laboratory_sealed}

  inherited_rows:
    preamble: >-
      Rows whose short id and machine key belong to another module. Short ids
      are repository-wide, so this module assumes the owner's rather than
      restating one of its own; the resolution of each id to the owner's
      assumption file is the checker's.
    rows:
      - {id: A-ATK, machine_key: attack_set_license}
      - {id: A-SRC, machine_key: source_replacement_license}
      - {id: A-RHOM, machine_key: round_homogeneity_declaration}
      - {id: A-SEQ, machine_key: sequential_round_model}
    a_tsm_note: >-
      A-TSM (reductions/ass:tsm, key test_statistics_model) is no row here:
      no claim root a result names reaches it (`--dependents A-TSM` names the
      claims that assume it), and the reductions artefact
      emits it on the routes whose squashing results rest on it
      (reductions/wpfss/cor:emitted-flat and the instances that embed it).
      The `output_state` convention it covers is still this module's
      (`conventions.test_statistics_model`).
    a_ens_note: >-
      A-ENS is reached by the closure of every key-length root and of the
      first-order bound (lem:product-marginal) and is no row here: in
      trusted-source mode the transmitter's own ledger, which a run emits
      always, carries A-ENS, or A-WCP in its place for a source model, which
      the run's route-exact set reads as covering A-ENS. In untrusted-source
      mode thm:accumulated-entropy does not use it, nor do the compiler
      claims that declare it without a mode condition (named in
      transmitter/interface.yaml, outputs.assumption_ledger), and no ledger
      carries it.
      A standalone engine result is not a run and carries no route-exact
      set.
    a_link_note: >-
      A-LINK (protocol-compiler/ass:link) is reached by the closure of every
      key-length root through thm:keylength, whose hypothesis (H-CHAIN), that
      the reduction chain carries the run onto the round model, its clauses
      (i)(a), (i)(b), (ii)(a) and (iv) attest, and is no row here: the
      compiler's own ledger carries it under its presence rule
      (req:link-row-provenance). Where (H-CHAIN) is proved instead, on the
      identity link of Band A (thm:band-a) and for a chain the reductions
      module emitted with status exact (thm:two-sided, cor:sequential,
      thm:licence; rem:obligations-discharged), that ledger omits the row and
      a run records the premise as discharged. The premises of those
      reductions theorems (A-MEAS, A-ROUND-SQ, A-CONST) stay on that route's
      reductions ledger and outside this module's closures, as the
      compiler's design decision 7 keeps them.
    a_spec_note: >-
      A-SPEC (protocol-compiler/ass:spec) is reached by the closure of every
      key-length root through thm:keylength, whose run is that of
      lem:memory-lift (a): its clause (i) attests that the declared physical
      family is the measurement performed in every round on that round's
      system alone. Where no source-replacement certificate is demanded (in
      untrusted-source mode, or at d_A = 1) Alice's measurement is part of
      that run too, and A-ALICE-MEAS (protocol-compiler/ass:alice-meas) (i),
      which refines A-SPEC, attests that it is the declared one in every
      round, on that round's system alone; thm:keylength assumes it as well,
      so the closure names it, and on other runs it is not engaged. Neither
      is a row here; the compiler's ledger carries A-SPEC on every run and
      A-ALICE-MEAS on the runs its presence rule names.
    owners:
      A-ATK: "protocol-compiler/ass:atk"
      A-SRC: "transmitter/ass:src"
      A-RHOM: "protocol-compiler/ass:rhom"
      A-SEQ: "transmitter/ass:seq"

  submodule_rows: []

  unemitted_rows:
    preamble: >-
      Assumptions this module owns that no run emits: no claim root a
      key-rate result names reaches them (check with `--dependents` on the
      short id). Each still carries a machine key, because the claim-closure
      table lists every assumption with its key and a run record refuses a
      table in which one has none (certiqs_key.domain.claim_closure). They
      are not in `own_rows`, which is the ledger a run emits.
    rows:
      - {id: A-SEPARATE, machine_key: separate_executions}
      - {id: A-EVE-DIM, machine_key: adversary_registers_finite}
    a_eve_dim_note: >-
      A-EVE-DIM (ass:eve-dim) is superseded and assumed by no claim: the
      round model keeps the adversary's registers finite-dimensional as part
      of its definition, at every fixed dimension, and cor:composed-security,
      through lem:memory-lift,
      carries a run's security statement to registers of any dimension. No
      run emits it, and no ledger of another module carries it.

  emission_rule:
    A-KEYREG: "on every run that reports a key length"
    A-HASH: "on every run that reports a key length"
    A-SEED: "on every run that reports a key length or a first-order bound"
    A-FIXED: "on every run that reports a key length"
    A-CONFORM: "on every run that reports a key length"
    A-AUTH: "on every run that reports a key length, with the declared eps_auth and k_auth bound to it, zeros included"
    A-LAB: "once per party of the declaration, its row naming the party: on a run that reports a key length, at both parties, unconditionally, as thm:keylength assumes it at each of the two; on a run that reports a first-order bound and no key length, in trusted-source mode only and only at the party to which the party partition assigns A, the one instance thm:accumulated-entropy uses, and in untrusted-source mode not at all"
    A-ATK: "whenever the constraint list is non-empty and a key length is wanted, on a run that reports a key length or a first-order bound"
    A-SRC: "trusted-source mode at d_A >= 2, on a run that reports a key length or a first-order bound; vacuous at d_A = 1 and never demanded there"
    A-RHOM: "on every run that reports a key length or a first-order bound (the compiler emits it always)"
    A-SEQ: "on every run that reports a key length or a first-order bound (the transmitter emits it always)"
  emission_rule_note: >-
    Every rule follows the assumption closure of the claim roots the result
    names (the `assumption_ledger` output row), computed by
    `python -m harness.check_claims --assumptions <root>`: a row is emitted
    on an outcome exactly when a root that outcome names reaches it and the
    row's own condition holds. lem:estimate, the one root of a run that
    reports neither a bound nor a length, reaches no assumption, so such a
    run emits no row. tests/unit/test_ledger_closure_agree.py holds every
    flag combination to the closures, both ways.
  binds:
    A-KEYREG: "lambda_ec -- the fixed transcript register (ass:keyreg (iv)); key_holder -- the declared holder that computes Z_1^n (ii)"
    A-HASH: "key_length -- l, the privacy-amplification output (ass:hash (i)); ideal_hash -- whether the length was computed for an ideal family, which (i) asserts (req:hash-penalty); ev_hash_bits -- ceil(log2(1/eps_EV)), the verification output (ii), read from the engine's deductions"
    A-SEED: "source_mode -- clause (v) is stated in trusted-source mode; (i)-(iv) are about the post-processing seeds, which no input describes"
    A-FIXED: "acceptance_set, rounds, key_length, lambda_ec, eps_pa, eps_ev, eps_auth, k_auth -- the values ass:fixed (i) says are fixed before the first round, in its order"
    A-CONFORM: "acceptance_set -- the test (ass:conform (i)); lambda_ec and ev_hash_bits -- the post-processing messages (ii); key_length -- the l-bit key (iv)"
    A-AUTH: "eps_auth and k_auth (ass:auth (ii), (v); both zero in (i)'s second case), zeros included"
    A-LAB: "party -- the party the row is emitted for, whose laboratory ass:lab is about; source_mode -- which with the party label of A decides the systems handed out of that laboratory (trusted-source mode at the party of A) and whether A is delivered into it (untrusted-source mode); the party labels of `party_partition` (part (b)) -- the systems delivered into it"
    A-ATK: "constraint_entries -- the count and the right-hand-side tag of each entry, which decide that the list is licensed (def:homog), the scope of ass:atk; source_mode, likewise; attack_set_license -- its supplier, where the declaration carries one (ass:atk (i)). The shapes are the compiler's"
    A-SRC: "source_mode and alice_marginal (dimension and sector dimensions) -- the premise of transmitter/ass:src, trusted-source mode filling the marginal slot with tau_A; alice_povm (form, alphabet, dimension) -- the measurement of (ii); the party label of A (party_partition (b)) -- whose laboratory (i) names. The shapes are the transmitter's"
    A-RHOM: "rounds and source_mode -- the rounds protocol-compiler/ass:rhom (i) says one declaration and one source mode describe"
    A-SEQ: "rounds -- the n rounds after which transmitter/ass:seq (ii) applies the post-processing; its other clauses are about the order of the physical steps"
  binds_note: >-
    Every name is an input or parameter row of this file or a named part of
    one: `acceptance_set` the row of that name (its geometry tag, the
    alphabet Chat and its data: a singleton's frequencies inline, a
    polytope's number of inequalities), `rounds`, `lambda_ec`, `eps_pa`,
    `eps_ev`, `eps_auth` and `k_auth` the parameter rows, `key_holder` and
    `source_mode` parts of the declaration (`public_structure`, and the
    marginal slot `alice_marginal`), `alice_marginal`, `alice_povm`,
    `constraint_entries` (`constraint_list`) and `attack_set_license` the
    input rows; `party_partition` the input row of that name (its part (b),
    the party labels) and `party` the party a per-party row is emitted for;
    `key_length` and `ev_hash_bits` outputs of this module (the
    `key_length` row and its deductions), `ideal_hash` the solver's choice
    of the hash family the length is computed for. The code
    is meat_core/reasons.py, `ROW_BINDINGS` (with the clause of each name)
    and `assumption_bindings`, and solvers/frank_wolfe/general_keyrate.py,
    `declared_values`. The values are the result's `assumption_bindings`.

  own_row_notes:
    A-HASH: >-
      The family is assumed ideal. For a merely two-universal family the
      pinned source records a one-bit penalty and the key-length expression
      must be tightened by one further bit (req:hash-penalty); the
      error-verification hash needs only ordinary two-universality.
    A-SEED: >-
      The error-correction seed, the verification seed and the
      privacy-amplification hash choice are the post-processing's own
      randomness, and, in trusted-source mode, the source's letters and the
      systems it prepares are independent of the adversary's registers, no
      purification of a prepared system being made available to the
      adversary during or after the protocol (clause (v), which
      lem:product-marginal reads); no declared datum describes any of it, so
      no code path decides any clause. The machine key keeps its name,
      `post_processing_seeds`, though the premise now covers the source's
      draws too; a rename is the implementer's call.
    A-FIXED: >-
      The engine computes a key length from parameters a run declares; that
      the run fixed them before it started and did not adjust them to its
      data is outside anything it sees. eps_auth and k_auth are among them.
      The Renyi order of clause (iii) is a parameter of the computation, not
      of the run; `binds` names the values of clause (i).
    A-CONFORM: >-
      That the implementation runs the analysed post-processing (the
      acceptance test and the verification abort, no further messages, the
      model's key or nothing, no early key use, the authentication
      post-processing) is the implementation's attestation; the engine
      computes the number that implementation may claim and runs none of it.
    A-AUTH: >-
      The declared eps_auth and k_auth are the values this row binds. Both
      default to 0, which states a perfectly authenticated channel that
      consumes no key; the report flags the zeros rather than refusing them.
    A-LAB: >-
      Category laboratory: one premise per party, whatever the party does in
      the protocol, outbound leakage and inbound influence alike -- a
      trusted source's back-reflections and seeding where the party sends,
      emanations from any of its devices, back-flash at each of its
      measuring stations, timing
      and classical-processing side channels everywhere. Its boundary is
      read off the round model and the party labels; nothing in a
      declaration describes what crosses it otherwise, so it is never
      decided.

  inherited_row_notes:
    A-ATK: >-
      The licensed reduction over the round model and the attack set, which
      is what the constrained accumulation theorem rests on. One attestation
      under one id, protocol-compiler/ass:atk, with this module's short id
      and key. Where it is discharged: by the supplier of the chain; for a
      chain emitted by reductions it is that module's licence theorem over
      its own attack set, mentioned and not used. This module tests presence
      at the gate and never truth. Not engaged at an empty constraint list.
    A-SRC: >-
      One of the premises from which lem:product-marginal derives the
      product marginal of Alice's systems, beside A-ENS (or the source model's
      premise), which gives the product across rounds, A-SEQ, A-SEED (v),
      which makes the source's draws independent of the adversary,
      and A-LAB (i), (ii) at the party of A. What
      the transmitter attests here is that Alice's register never passes
      through the adversary's hands; what this module does with it is delete
      from the feasible set every state whose marginal differs. The record's
      content is not read here; its presence is, at this module's A-SRC gate
      (the `source_replacement_license` input row;
      req:marginal-licence-gate): the compiler consumes it at its gate and
      decides its decidable conditions again, and the attestation clause is
      a presence test on both sides and is decided by no code path. At
      d_A = 1 there is nothing to violate: what it licenses is the
      normalisation, satisfied by every state, so it deletes no attack
      (prop:trivial-alice-system (iv)).
    A-RHOM: >-
      One declaration describes every round, hence one source mode and one
      marginal for the run. The compiler owns the statement and spends it on
      the flag that says a declaration may back a key-length claim for the
      run, and this module consumes it where the accumulation is stated over
      n rounds of one declaration: thm:accumulated-entropy, through the
      common target set of lem:range (ii). No collapse of the attack sequence
      is used anywhere, the adversary's channels vary freely across rounds,
      and homogeneity of the declaration and the marginal is the only thing
      the accumulation reads of the round structure. The key is the
      compiler's: `round_homogeneity` is the receiver's, for a different
      assumption.
    A-SEQ: >-
      The sequential round structure: every message of a round follows every
      measurement of that round, and no quantum operation of a round depends
      on that round's messages, and the classical post-processing follows
      all n rounds (clauses (i), (ii) and (iv)). thm:keylength consumes them
      where the physical
      rounds are mapped onto the round channels, and lem:product-marginal,
      hence the first-order bound, where each measurement is moved into its
      round. Clause (v), every measuring party measuring in round order, is
      read by lem:honest-attacks, through which cor:composed-security reaches
      every adversary of the honest-authentication setting; the transmitter
      owns the statement and its row.

  submodule_row_note: >-
    The submodule emits no row. Its one assumption, A-LMO
    (frank-wolfe/ass:lmo), is superseded: both linear minima of its bound are
    bounded exactly, the feasible one from the oracle's dual
    (frank-wolfe/lem:feasible-side-dual; frank-wolfe/req:verified-feasible-side),
    so no first-order number rests on a solver's optimality. The core's
    docking claims (lem:estimate, cor:keylength-bound) assert nothing about
    how a lower bound was obtained or in what arithmetic; what the first-order
    number still leaves unverified, binary64 evaluation that no claim
    budgets, is frank-wolfe/rem:fo-arithmetic's.

never_verified:
  own: [A-KEYREG, A-HASH, A-SEED, A-FIXED, A-CONFORM, A-AUTH, A-LAB]
  inherited: [A-ATK, A-SRC, A-RHOM, A-SEQ]
  submodule: []
  unemitted: [A-SEPARATE, A-EVE-DIM]
  note: >-
    Each list holds, of the rows above, those whose assumption carries
    `verification: never` (spec/claim-format.md section 3.2), each saying
    so in its own text. An inherited row carries its owner's field. The
    code reads the
    field from the claim-closure table rather than from these lists, and
    tests/unit/test_never_verified_agree.py holds the lists to it. No code
    path of this module may decide more of any of them than its clauses on
    the declared data. For A-ATK and
    A-SRC the conforming behaviour is a presence test at a gate and nothing
    more -- and at d_A = 1 not even that, A-SRC being vacuous and never
    demanded; for A-RHOM and A-SEQ there is nothing to check at all
    and the obligation is only named. What the declaration and the acceptance set must satisfy is no row: the
    engine decides it (def:admissible-declaration, req:declaration-admission,
    req:compiled-declaration-only; def:admissible-acceptance-set,
    req:acceptance-set-admission), and the product marginal is
    lem:product-marginal.
    Locator: ass:keyreg; ass:hash; ass:seed; ass:fixed;
    ass:conform; ass:auth; ass:lab; ass:eve-dim;
    ass:separate-executions;
    protocol-compiler/ass:atk; transmitter/ass:src;
    protocol-compiler/ass:rhom; transmitter/ass:seq.

# ---------------------------------------------------------------------------
# submodules_today
#   The one block of this file that names a submodule, so that the others do
#   not have to. Everything above states the mechanism -- a solver submodule
#   docks at lem:estimate and cor:keylength-bound and adds its own rows,
#   reasons, ledger entry and windows in its own interface -- and this block
#   is the module as it stands. Deleting a submodule deletes its entry here
#   and nothing else of this file.
# ---------------------------------------------------------------------------
submodules_today:

  frank-wolfe:
    interface: "spec/modules/meat-core/frank-wolfe/interface.yaml"
    what_it_supplies: >-
      The headline number: a lower bound on the value of the program, by
      Frank-Wolfe linearisation at the iterates, with both linear minima
      bounded exactly, the feasible-side one from the oracle's dual and not
      from its return.
    docks_at: [lem:estimate, cor:keylength-bound]
    output_keys: [h_lb, first_order_clamped, optimizer_certificate]
    ledger_rows: []
    threshold_rows: [iterate_positivity, iterate_repair_window, iterate_coupling, constraint_rows, oracle_repair_window, support_cutoff, optimizer_gap]
    withdrawal_reasons: [gradient_hypothesis_positivity, gradient_hypothesis_support, gradient_perturbation_applied, iterate_not_feasible]
    withdrawal_reasons_note: >-
      The strings of the frozen vocabulary, and no other: an acceptance
      geometry other than the two admitted ones is refused at admission
      (frank-wolfe/req:acceptance-geometries) and reaches no withdrawal. The
      authority is the submodule file, and this row mirrors it:
      spec/modules/meat-core/frank-wolfe/interface.yaml's
      `withdrawal_reasons` is where a string is added or retired.
    removable: true
    removability_note: >-
      Deleting it removes this entry, the `h_lb` and `optimizer_certificate`
      output rows' submodule content and the Group B rows it declares -- and
      nothing else of this file. What would remain is
      a module that states the program, solves nothing and reports the
      estimate at a point somebody else supplies; the two docking claims are
      what make that a coherent contract rather than a gap.

  a_second_solver_submodule:
    status: "future scope; none exists"
    note: >-
      A conic solver with a dual certificate, or any other method, is a
      sibling submodule docking at the same two core claims with its own
      lower bound and its own trust root, and it changes nothing in this
      file except this block and the rows that name a submodule.
      cor:keylength-bound's lead-in says the same: a solver submodule
      establishes its lower bound under its own trust root and in its own
      claims, and the core asserts nothing about how it was obtained.
    locator: "cor:keylength-bound; spec/modules.yaml; spec/future-scope.md"

# ---------------------------------------------------------------------------
# artifact_bindings
# ---------------------------------------------------------------------------
artifact_bindings:
  mathematical_spec_version: "meat-core@1.28.0"
  version_note: >-
    The pin the code emits: an accepted version of this contract, never a
    draft one. The pin names the accepted contract and is not a statement
    about the code's acceptance, which is a separate human gate. It moves by
    a hand edit in the code change that adopts a later accepted version,
    listed there old -> new with every file that spells it, and it is
    regenerated from nothing; it can therefore name an earlier accepted
    version than module.yaml's.
  no_content_hash: >-
    This file carries no content hash and no change log: git and human
    review are the ledger, and there is no second one (PRINCIPLES.md section
    2.5). An accepted version is pinned by its commit and a run manifest pins
    what it used; that is all the pinning there is.
  produces_note: >-
    The output rows above are the result record's payload; the run tier
    assembles them with the records of the other modules and with the
    assumption manifest (spec/architecture.md 3.3, 4.4). No further schema
    extension is authorised.
  consumes_note: >-
    One artefact and two parameter blocks: the compiler's emitted
    declaration, read slot by slot under its keys; the statistics module's
    acceptance set with its geometry tag; and the run parameters of the
    `parameters` table together with the rounds. No reductions artefact is
    read here (`not_inputs`), and of the transmitter's only the presence of
    its licence record, read under the compiler's key (the
    `source_replacement_license` input row).
  package: "src/certiqs_key/meat_core/"
  package_note: >-
    The package is present. The accepted contract pin identifies the
    mathematics; implementation acceptance remains a separate human gate.
    Which file carries which claim is design.md, "Where the code is".

# ---------------------------------------------------------------------------
# depends_on_modules
# ---------------------------------------------------------------------------
depends_on_modules: [protocol-compiler, transmitter, reductions, foundations]
depends_on_modules_note: >-
  As module.yaml declares, and what is read from each is small and is stated
  row by row above. Foundations: no data; the claims use its
  quantum-information preliminaries (operator conventions and pinching, the
  divergences, the divergence kernel, the pinching lemma and the two
  pinching facts) and its numerical policy, and the submodule inherits the
  edge. Protocol-compiler: the emitted declaration, read slot by slot under
  its output keys; the three definitions this module's def:declaration,
  def:feasible and def:homog cite with a `uses` edge (its def:declaration,
  def:feasible and def:homog, the declaration twins that module owns); and
  def:target and def:exact, which def:admissible-declaration and the exact-admissibility
  paragraph of def:declaration coincide with and only mention
  (`consumer_agreement`). It is also where A-ATK and A-RHOM live.
  Transmitter: nothing is read save the presence of its licence record,
  which arrives under the compiler's key (the `source_replacement_license`
  input row): A-SRC is assumed by the claims that state what a declared
  marginal licenses, and rem:modes-da1 points at that module's source-mode
  remark rather than restating it. Reductions: nothing is read;
  def:roundmodel mentions that module's round model and attack set as the
  coincidence its own paragraph records, and A-TSM is assumed where the
  state-dependent round-type marginal is named. The traffic runs the other
  way for the run tier, which reads the reductions artefact and computes
  that module's closure from it (spec/architecture.md 4.4). No module
  depends on this one: it is the consumer at the end of the chain, and what
  the others owe it is what `consumer_agreement` records.

# ---------------------------------------------------------------------------
# fixed_by_this_file
#   Every place this file says something no claim of this module states, so
#   that a reader can separate what the claims decide from what the
#   interface fixes, and a later amendment knows which rows it may move
#   without touching a proof.
# ---------------------------------------------------------------------------
fixed_by_this_file:

  - row: "outputs.map_validation_report"
    what: "the key name, and that the validation and cross-validation outcomes are emitted as a record."
    why: >-
      thm:protocol-channel and lem:branch-maps state the properties of the
      generated maps and req:sector-report states what the sector report
      carries; no claim says the validation outcomes are emitted.
      spec/architecture.md 3.6 makes the bundle validation this module's and
      4.4 makes the run record carry what each module said at its boundary,
      which needs a key.

  - row: "refusal_reasons.security_statement_vacuous (the spelling)"
    what: "the string the gate refusing a run with eps_pa + eps_ev + 2 eps_auth >= 1 refuses with."
    why: >-
      req:security-statement-not-vacuous states the gate and names the
      string, and cor:keylength-bound (b) states the corner: it is stated
      for eps_ev < 1 and its proof exhibits ell = 1 under an empty
      (eps_pa + eps_ev)-security statement without claiming it. The spelling
      is this file's.

  - row: "outputs.assumption_ledger"
    what: "that a ledger of machine keys is emitted with the result, and its shape."
    why: >-
      Each assumption file states its own machine key; no claim says the
      keys are emitted. The transmitter, reductions and compiler artefacts
      all emit one and a run manifest is assembled from them
      (spec/architecture.md 4.4), so this module emits one too.

  - row: "outputs.assumption_bindings / assumption_ledger.binds"
    what: "the key, its shape, and the names each ledger row binds."
    why: >-
      The assumption files state what each assumption is about and no claim
      states that the values it is about are emitted. Values are bound per
      assumption: every emitter records them, and the names are this file's choice of
      the inputs and parameters each clause is about.

  - row: "outputs.mathematical_spec_version"
    what: "the key, and that an artefact may not claim a draft version."
    why: >-
      PRINCIPLES.md section 6; no claim states it.

  - row: "declared_thresholds.group_a_declared_data.constraint_operator_exact"
    what: "the machine key, and giving the constraint operators a row of their own."
    why: >-
      Hermiticity of a constraint operator is a predicate on declared numbers
      and not a type condition, so it is given a row; the predicate is
      def:admissible-declaration (vi)'s and def:homog's.

  - row: "refusal_reasons.implementation_reasons_beside_the_vocabulary"
    what: "the whole block: strings an implementation emits that are neither refusals nor withdrawals."
    why: >-
      No claim states any of them. rem:hlow-range and req:infinite-value name
      the outcome of an unusable acceptance set and leave the diagnosis to
      the implementation; the achieved-tier and no-bracket values of
      `optimizer_certificate.assurance_reason` are fields of a record no
      claim knows is emitted. The block exists so that every string a run
      record can carry is disclosed in one of these tables rather than found
      in a record.

  - row: "refusal_reasons.declaration_not_exactly_admissible"
    what: "the refusal string."
    why: >-
      req:exact-admission requires the refusal -- a declaration is exactly
      admissible or it is refused -- and spells no string. The spelling is
      reductions' own for the same decision on the same kind of datum,
      reused rather than coined.

  - row: "outputs.statistics_consistency.fixed_parameters.statistics_check_budget_share"
    what: "the value 1/4."
    why: >-
      req:unreachable-acceptance-set (i) gives the check's solve the share
      statistics_check_budget_share of one evaluation's wall budget and fixes
      no value: b is a lower bound at any effort, so the value trades the
      tightness of the cap against wall time and decides nothing a
      claim rests on.

  - row: "fail_closed.rows (the order field, and the three rows with no string)"
    what: >-
      the order in which a conforming implementation decides the rules, and
      the decision to spell no string for `required_datum_present`,
      `bundle_validation` and `maps_cross_validated`.
    why: >-
      No claim fixes an order across the whole set. What the claims and the
      architecture do fix, and what the order respects, is that the
      declaration is admitted before the maps are generated from it
      (def:declaration; req:exact-admission; thm:protocol-channel), that the
      maps are validated before anything is solved (spec/architecture.md
      3.6) and that the gate decides a key-length claim and not the run
      (def:homog; rem:cgate; req:constrained-key-gate). The rest of the order
      is this file's, and the three unspelled strings are this file's
      decision not to coin a vocabulary the claims do not ask for.

  - row: "fail_closed.bundle_validation"
    what: "the whole row."
    why: >-
      No claim of this module states the bundle-validation list;
      spec/architecture.md 3.6 does, and names this module as its owner.

  - row: "inputs.acceptance_set.the_geometry_tag"
    what: "that the geometry tag is an input datum read as data, and the refusal of an unknown one at the point the set arrives."
    why: >-
      frank-wolfe/rem:acc-side and frank-wolfe/req:acceptance-geometries
      state the two geometries and the outcome for any other, and name no
      input field; spec/architecture.md 3.2 makes the taxonomy the statistics
      module's and says this module reads it by tag and refuses an unknown
      one. The claims state the mathematics and the architecture states the
      ownership; the input row is this file's.

  - row: "parameters (the five rows) and retired_parameter_rows"
    what: >-
      that the rounds and the three budgets are parameters of this module
      rather than slots of the declaration, and that there is no tier
      request.
    why: >-
      thm:keylength states the expression they enter and no claim says where
      the numbers come from; spec/architecture.md 3.3 makes the composition
      the run tier's. That there is no request is the two-numbers rule of
      foundations/req:tiers read against frank-wolfe/rem:fo-interface,
      which names no request; the reasoning is on the row.

  - row: "assumption_ledger.emission_rule"
    what: "which assumption key is emitted always and which only under a condition."
    why: >-
      The claim files state what each assumption says and where it is spent;
      they do not state an emission rule for a ledger they do not know is
      emitted. The rules follow the claims -- every row is a premise of a
      claim root the result names (`emission_rule_note`); A-SRC is asserted
      only in trusted-source mode and is vacuous at d_A = 1
      (prop:trivial-alice-system (iv)), so its row is emitted at d_A >= 2
      only; A-ATK is not engaged at an empty constraint list -- but the
      emission rule is this file's.
