# artifact_bindings
# ---------------------------------------------------------------------------
artifact_bindings:
  mathematical_spec_version: "transmitter/decoy@0.8.0"
  mathematical_spec_version_note: >-
    The string names an accepted version of the submodule contract, so it is
    claimable. What it does not mean: that anything is emitted by a complete
    analysis.
  package: "src/certiqs_key/transmitter/decoy/"
  package_note: >-
    `model.py` is def:wcp-model, `tagged.py` is def:tagged-source with the
    index set of (T3) and the tail weight of eq:tailweight, `bases.py` is the
    construction of cor:emitted-decoy (iv)(b) at zero, one and two photons,
    `enclosure.py` is lem:poisson-enclosure at the index K_mu of
    req:sector-weight-bound, `emit.py` is the emission with its refusals, and
    `reasons.py` holds the strings of this file's table. What the contract
    requires of the package beyond that: req:signal-dyads requires the signal
    dyads to be formed by the construction of `bases.py` and none to be taken
    from a request, and req:sector-weight-bound requires the enclosure of
    lem:poisson-enclosure, at the index K_mu that requirement fixes, to be
    formed in the package (`enclosure.py`) and recorded (the emitted record's
    `sector_weights` table carries K_mu per intensity as `poisson_index`); an
    implementation conforms only once both hold. The machine keys above are
    binding: the code is written onto these names, not the reverse.
  what_is_not_built_here: >-
    A helper that rounds a supplier's Poisson weights down onto a dyadic
    grid. Neither interface names one among this submodule's inputs or
    outputs; a declarer for which a product is not representable removes the
    refusal by declaring on a coarser dyadic grid (the lead-in of
    req:exact-decoy-blocks), which is a declarer's act on data it is about
    to declare. Building the helper inside the module that decides the
    result would put the choice of grid where the decision is taken. It
    belongs to the instances, and the emission refuses an unrepresentable
    product rather than rounding one.
  the_enclosure_is_formed_here: >-
    What req:sector-weight-bound requires: the enclosure of P_mu(n) that the
    condition of (T2) is decided against must be formed by the emission from
    the declared mu, in exact rational arithmetic, by lem:poisson-enclosure at
    the index K_mu, the least even K >= mu with mu^(K+1)/(K+1)! <= 2^-90,
    which the artefact records per intensity; an implementation must read no
    enclosure from a request. The condition is decided against the lower
    end, which is what makes ptilde <= P_mu(n) follow; the upper end decides
    nothing. No floating-point evaluation and no other module enters it.
  consumes_note: >-
    What the contract lets the emission consume: declared data from an
    instance -- the polarisation labels with the vectors they stand for, the
    intensities, the alphabet with its weights, the cutoffs and the sector
    weights -- and nothing from another module. An implementation must
    consume no enclosure, no signal dyad and no sector basis
    (req:sector-weight-bound; req:signal-dyads).
  produces_note: >-
    The output keys above, which are the core's input keys plus the ones
    this submodule adds: the obligation record, the sector map and the weight
    table, which carries the summation index K_mu of each intensity's
    enclosure (req:sector-weight-bound). Their consumer is the core's
    emission and, through it, the protocol compiler.
  where_k_mu_travels: >-
    K_mu travels only in the decoy declaration's record (its `sector_weights`
    table, as `poisson_index`, req:sector-weight-bound). The core artefact a
    run record carries has no slot for it, and none is added: K_mu is a
    function of the declared intensity alone, which a run record carries
    exactly, so it is recomputed from the recorded intensities by
    lem:poisson-enclosure's index rule (`poisson_index` of
    `src/certiqs_key/transmitter/decoy/enclosure.py`).

depends_on_modules: []
depends_on_modules_note: >-
  Empty, as module.yaml declares. This submodule uses its core's claims and
  nothing else: no sibling submodule, no foreign module. It is a source model
  and a source map, both Alice-side.
