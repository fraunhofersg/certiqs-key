# spec/modules/statistics/binomial-box/interface.yaml -- the `binomial-box`
# submodule's interface: which endpoint rule each request value selects and
# what that rule is known to carry, the parameters its evaluations take, the
# search procedure the enclosure route records, and which completeness report
# is made on each route (spec/claim-format.md section 5). The claim files
# under claims/ are the contract; this file authors no mathematics and repeats
# none.
#
# What is here and what is not. The core states the taxonomy, the tail
# identity, the frequency vector and the acceptance support and box oracle,
# and names no rule (`../interface.yaml`). This submodule is where a set is
# built: the per-outcome interval over an admissible endpoint rule, the
# honest-containment guard, the box, the completeness bound, honest
# containment and the parameter behaviour -- and the two rules this
# repository carries, each proved an instance of one definition. This file
# adds rows to the core's tables and changes none of them. Every row names,
# in a `locator` field, the claims it rests on; a bare label is this
# submodule's and a label prefixed `statistics/` is the core's.
#
# The shape of the coupling, in one sentence: `def:endpoint-rule` is the one
# definition of what a rule is, and every rule is one claim proving an
# instance of it, so adding a rule adds a claim, its entry in the clauses that
# enumerate the rules (def:endpoint-rule (viii), req:rule-in-force), a row of
# `rule_table` and a value of the core's `endpoint_rule` input, and no theorem
# about the construction changes.
#
# Three kinds of thing are fixed here, and the reader should keep them apart.
#   (a) What the claims prove, tabulated so that a consumer can read off which
#       theorem applies on which route -- `rule_table`. Nothing here is a
#       decision.
#   (b) What the requirements leave to the interface and name as such -- the
#       search procedure of `req:search-procedure`, and the completeness
#       report on the routes other than `exact` + `sweep`
#       (`req:completeness-report`) -- and the evaluation parameters, which no
#       claim fixes.
#   (c) The values of the evaluation parameters. Each row gives its proposed
#       default, marked `proposal: true`, the quantity it is sized against,
#       and under `settled` the value in force, with the reason where it
#       differs; none of them can make an endpoint less conservative, which is
#       why they can be proposed rather than decided
#       (prop:bracketed-endpoints (i)).

module_id: statistics/binomial-box
parent_module: statistics

# ---------------------------------------------------------------------------
# claims
#   The submodule's claim files in the order module.yaml assembles them. The
#   authority is the claim files and the command below;
#   tests/oracles/test_statistics_acceptance_registry_interface.py reads this
#   list.
# ---------------------------------------------------------------------------
claims:

  the_command: "python -m harness.check_claims --module statistics/binomial-box --status"
  provenance_note: >-
    Every claim is `newly-derived` with its derivation inline. Every lemma of
    the enclosure and Bernstein groups carries a complete proof and names in
    prose the classical result it restates; nothing is cited and nothing is
    registered in refs/.

  order:
    - {claim: def:endpoint-rule, kind: def, provenance: newly-derived, refs: []}
    - {claim: lem:guard, kind: lem, provenance: newly-derived, refs: []}
    - {claim: def:interval, kind: def, provenance: newly-derived, refs: []}
    - {claim: prop:rule-exact, kind: prop, provenance: newly-derived, refs: []}
    - {claim: rem:guard, kind: rem, provenance: newly-derived, refs: []}
    - {claim: rem:guard-activation, kind: rem, provenance: newly-derived, refs: []}
    - {claim: def:construction, kind: def, provenance: newly-derived, refs: []}
    - {claim: thm:box-construction, kind: thm, provenance: newly-derived, refs: []}
    - {claim: rem:selector, kind: rem, provenance: newly-derived, refs: []}
    - {claim: lem:envelope-dominance, kind: lem, provenance: newly-derived, refs: []}
    - {claim: thm:completeness-bound, kind: thm, provenance: newly-derived, refs: []}
    - {claim: rem:epsstar, kind: rem, provenance: newly-derived, refs: []}
    - {claim: rem:sound-indep, kind: rem, provenance: newly-derived, refs: []}
    - {claim: rem:envelope, kind: rem, provenance: newly-derived, refs: []}
    - {claim: thm:honest-containment, kind: thm, provenance: newly-derived, refs: []}
    - {claim: rem:hlow-consequence, kind: rem, provenance: newly-derived, refs: []}
    - {claim: def:monotone-rule, kind: def, provenance: newly-derived, refs: []}
    - {claim: lem:widening, kind: lem, provenance: newly-derived, refs: []}
    - {claim: lem:cheb, kind: lem, provenance: newly-derived, refs: []}
    - {claim: thm:monotonicity-limits, kind: thm, provenance: newly-derived, refs: []}
    - {claim: rem:n-nonmono, kind: rem, provenance: newly-derived, refs: []}
    - {claim: lem:log-enclosure, kind: lem, provenance: newly-derived, refs: []}
    - {claim: lem:stirling-enclosure, kind: lem, provenance: newly-derived, refs: []}
    - {claim: lem:bernstein-tail, kind: lem, provenance: newly-derived, refs: []}
    - {claim: prop:rule-bernstein, kind: prop, provenance: newly-derived, refs: []}
    - {claim: rem:completeness-on-rules, kind: rem, provenance: newly-derived, refs: []}
    - {claim: lem:pmf-enclosure, kind: lem, provenance: newly-derived, refs: []}
    - {claim: lem:tail-majorant, kind: lem, provenance: newly-derived, refs: []}
    - {claim: prop:bracketed-endpoints, kind: prop, provenance: newly-derived, refs: []}
    - {claim: rem:local-evaluation, kind: rem, provenance: newly-derived, refs: []}
    - {claim: req:rule-in-force, kind: req, provenance: newly-derived, refs: []}
    - {claim: req:request-defaults, kind: req, provenance: newly-derived, refs: []}
