# spec/modules/protocol-compiler/interface.yaml -- the protocol compiler's
# interface: inputs, outputs, parameters, conventions, the refusal rules,
# the refusal strings, the gate outcome table, the consumer-agreement record
# and the assumption ledger (spec/claim-format.md section 5). The claim files
# under claims/ are the contract; this file authors no mathematics and
# repeats none. Where this file and a claim disagree, the claim decides.
#
# Every row names, in a `locator` or `fixed_by` field, the claim labels it
# rests on. Machine keys and refusal strings are binding for the
# implementation: the code is written onto these names, not the reverse.
# Where this file fixes something no claim states -- a key name, a presence
# rule, an emitted record -- the row says so under `fixed_here`, and the list
# of those rows is `fixed_by_this_file` at the end.

module_id: protocol-compiler

# ---------------------------------------------------------------------------
# inputs
#   The rows above the general-format block describe the basic format: one
#   Alice sector, one measured factor, POVM form, two messages neither of
#   which reads the other, and no party-local entry.
#
#   The blanket reading, restated by def:spec and def:exact: every numeric
#   datum is binary64, and every validity condition stated as an operator
#   predicate is decided exactly on those numbers, in the sense of def:exact,
#   the physical receiver family {F^ph_w} included, which is decided as one
#   block on its physical receiver space (`receiver_povm`;
#   def:well-formed-spec (iv); req:physical-family-decision). This module
#   declares no numerical tolerance, and no condition below is read at one.
# ---------------------------------------------------------------------------
inputs:

  - name: transmitter_artifact
    symbol: "Spec_src"
    type: record (the transmitter's emitted artefact)
    presence: always
    domain: >-
      The source part of the specification, presented as the artefact the
      transmitter emits, in its declared mode. The fields this module reads
      are the transmitter's own output keys and are read under those names:
      `signal_alphabet` (X with its declared order), `alice_dim` (d_A >= 1,
      with the declared computational basis of A), `alice_marginal` (tau_A in
      S_=(A), or the machine value null spelling nomarg), `alice_povm`
      ({M_x}_{x in X} on A), `virtual_transmitted_system` (A^v),
      `virtual_ensemble` ({p_x, rho^v_x}), `source_segment` (Ch_src, empty
      for every matrix-declared specification), `source_replacement_license`
      (the certificate record (tau_A, Psi, {p_x, rho^v_x}) with its
      attestation (SR3); present in trusted mode at d_A >= 2 only) and
      `assumption_ledger`. The mode is read off `alice_marginal` and off
      nothing else: filled is trusted, nomarg is untrusted.
    locator: "def:spec (a); def:compile (tau_A from the artefact's marginal slot, the filled slot included, transmitter/rem:da1); def:eligible (G2) (the licence record); thm:gates (ii) (no specification meets the certificate-absent rows); req:gate-outcomes (the mode read off the marginal slot)"
    what_this_module_decides_on_it: >-
      The marginal at check V2 and Alice's POVM at check V3, on the emitted
      data, whether or not the transmitter decided them first: a consumer
      decides and never infers (the `decide_never_infer` convention). The
      licence record's five conditions are re-decided at gate (G2)
      (def:eligible (G2)), exactly, on the emitted data; these are the
      conditions of a pure-form certificate, and what (G2) decides of the
      other forms is def:eligible's ("(G2) by form of the certificate").
      Clause (SR3) is an attestation and is tested for presence only
      (thm:gates (i); req:attestation-presence).
    what_this_module_never_does_to_it: >-
      It fills no slot, demands no certificate of its own, constructs no
      marginal and changes no source mode (thm:gates (ii); req:pass-through).
      At d_A = 1 the value [1] in the slot is the transmitter's fill,
      recorded as filled in the artefact, and this module passes it through
      (def:compile; transmitter/rem:da1).
    fixed_here: >-
      The key name `transmitter_artifact` is this file's. No claim names a
      machine key for the artefact as a whole -- def:spec (a) names the
      artefact in prose only -- and the transmitter's interface names its
      output keys but not the record they sit in. The field names above
      are the transmitter's own and are not this file's.

  - name: receiver_povm
    symbol: "{F^ph_w}_{w in V^ph}"
    type: "one matrix per w on the physical receiver space, or a choice-weighted presentation"
    presence: >-
      always; in Band A it IS the family the link delivers, the link's
      `target_povm` being decided equal to it entry for entry
      (req:band-a-identity-link), and so the emitted family unless a
      `choice_weighting` is declared, which then weights it; it is declared
      directly (thm:band-a)
    domain: >-
      One matrix per w on the physical receiver space of the declared
      dimension, which carries no sector map this module holds. DECIDED
      EXACTLY ADMISSIBLE ON EVERY ROUTE, as one block: (S), (H), (P) and (C)
      of def:exact in the declared order of V^ph, (T) empty, as for Alice's
      data, and refused with `physical_family_not_admissible`
      (def:well-formed-spec (iv); req:physical-family-decision). At a
      non-trivial receiver segment this family lives on the physical receiver
      space and is no Q-operator, so check V1 does not compare it
      (def:validator, V1); that it is the measurement performed is A-SPEC
      (i), and (C4) reads it inside the pullback identity. In Band A the one
      link supplies Lambda_1 = id as data and its outcome correspondence is
      the identity on V = V^ph, or the specification is refused with
      `band_a_link_not_identity`; (C4) at the identity then decides
      F_v = F^ph_v entry for entry, so the family is the delivered {F_v},
      emitted as it is unless a `choice_weighting` is declared, and check V3
      decides it, or its weighting, again (req:band-a-identity-link;
      def:banda (b)).
      There it must also be, as presented, projective (every element of
      every conditional family, where it is presented choice-weighted; the
      weighted family is not what is decided) on a receiver system of
      dimension two, at one measured factor, or the specification is refused
      with `band_a_outside_ideal_receiver` (req:band-a-ideal-receiver).
    the_exception_is_the_family_as_presented: >-
      Where this family is presented as a choice-weighted one (def:spec (b)),
      its conditional families are decided like any other party's, per block
      and per choice value, with `conditional_family_not_admissible` -- they
      arrive in the `public_choices` record, which is an input of this module
      -- and every product formed from them is decided representable. At a
      non-trivial receiver segment the weighted family is this physical
      family and is not the emitted one, so nothing downstream re-decides it;
      what is decided of it on its own is condition (S) on its own
      declared-order sum (req:physical-family-decision). (T), (H) and (P) of
      it follow from the decision on its conditional families and its (C)
      from that decided (S) together with them -- rem:condfamily's converse,
      which is stated of the weighted family for this reason. Locator:
      def:well-formed-spec (iv); def:weighted; rem:condfamily;
      req:conditional-family-decision; req:physical-family-decision.
    locator: "def:spec (b); def:well-formed-spec (iv); req:physical-family-decision; def:validator, V1 (why it is not in the compared list); thm:chain-consumption (iii); thm:band-a; req:band-a-identity-link"
    supplied_by: "reductions (the chain's first source descriptor), or declared directly in Band A"

  - name: public_choices
    symbol: "(T_pub, q, {N_{u|t}})"
    type: record
    presence: "optional; one such record per party, either possibly absent"
    domain: >-
      Finite non-empty T_pub; prepared finite binary64 weights q_t > 0,
      an off-lattice weight being malformed input before accumulation or
      multiplication, as in the setting-dependent form. Ordinary user numbers
      are prepared and their displacement recorded by declaring entry points
      outside this exact core; this adds no gate-report row or refusal string.
      Positivity is a domain condition on a declared real scalar decided by
      its sign, with sum_t q_t = 1 decided exactly and that sum, accumulated
      in the order this record lists T_pub in, rounding nowhere, a list
      failing either being refused with `choice_weights_not_normalized`
      (req:weight-list); and for each
      t a POVM {N_{u|t}}_{u in U_t} on the declaring party's system, exactly
      admissible (def:exact), per block where that system carries sectors.
      This is the setting-independent form of def:weighted, eq:weighted.
    each_conditional_family_is_decided_here: >-
      Decided, not assumed, and decided of each t separately, on the declared
      numbers, before any product is formed and therefore before the chain's
      conditions are decided (the `fail_closed` table's first row): (H), (P)
      and (C) per block; (S) on the completeness sum sum_{u in U_t} N_{u|t},
      accumulated in the restriction, to the elements t contributes, of the
      order on the alphabet that indexes the weighted family (`order_note`
      below) and rounding nowhere; and (T) as the four-component agreement of
      the maps the conditional families themselves carry -- one map per
      presentation, against which the weighted family is a block list --
      empty on a system carrying no sector decomposition, which is Alice's A.
      A failure is `conditional_family_not_admissible`, naming the party and
      the first failing (t, predicate, block) with its index; the decision
      stops there. The reason is none of the emitted family's: of that family
      V3 decides (H), (P), (C), (S) and V1 compares the map (T) with
      `sector_map_mismatch`. Locator: def:weighted ("The reading of each
      declared condition", "In which order (S) is read on a conditional
      family"); def:compile; rem:condfamily; req:conditional-family-decision.
    locator: "def:weighted, Eq. eq:weighted (the form, every domain condition and the decision on each conditional family); def:compile (the weight sum's order is declared here because idxm does not index T_pub; and the binding rule that settles the order the conditional (S) is read in); ass:coin (what the weights mean); def:well-formed-spec (v)"
    order_note: >-
      T_pub is the one alphabet idxm does not index, so its order is declared
      with this record and the completeness sum is decided here and
      re-accumulated by no consumer (the `summation_order` convention;
      req:weight-list). The order the conditional (S) is read in is not this
      record's to fix, and this record does not fix one: the family the
      weighting produces is indexed by one alphabet -- X on Alice's side,
      which arrives ordered with the source part (def:spec (a)); the physical
      receiver alphabet on a measuring party's, whose declared order (C4)'s
      fibre sum uses;
      and in Band A that same alphabet, which is the emitted V -- and where a
      declared order arrives with it the compilation map takes that order
      (`which_order_when_a_family_arrives_ordered`; def:compile's binding
      rule). Condition (S) on the conditional family of a choice value is
      read in the restriction of that order to the elements the value
      contributes, which is a total order on U_t however this record listed
      it, so no compatibility of the listing with it is required and none is
      decided, and the two (S) conditions are independent -- only the order
      restricts. Where no order arrives with that alphabet the compiler's
      free choice is this record's own listing, t in its order of T_pub and,
      within each t, u in its order of U_t, and it is emitted as idxm's
      component there.

  - name: choice_weighting
    symbol: "(F, t: V -> T, P(f | t))"
    type: record
    presence: >-
      OPTIONAL, and per measured factor: at most one per factor, of either
      party (def:spec (b), (b')); its choice is drawn by a party whose readout
      records that factor's setting component (ass:coin (ii)). Absent is the
      ordinary case: with no such
      record the emitted family is the chain's {F_v} unchanged (rem:relabel,
      the paragraph "With no setting-dependent choice declared").
    domain: >-
      A finite non-empty choice alphabet F with a declared order; a finite
      non-empty setting alphabet T and a declared total setting map
      t: V -> T, the setting component of the outcome -- where the chain was
      emitted by reductions this is the class map of that module's joint
      alphabet (reductions/def:joint-family (a)) and is read from the
      reductions artefact, and where the family is declared directly it is
      declared with the family, the singleton T = {*} being the case of no
      setting; and a stochastic matrix P(f | t) on T x F of binary64 entries,
      P(f | t) >= 0 decided by sign and sum_{f in F} P(f | t) = 1 for every t
      decided exactly in the declared order of F, rounding nowhere. Zero
      entries are admitted and the support V_P of Eq. eq:support is what they
      are for: a pair (v, f) with P(f | t(v)) = 0 is not an outcome, is not
      emitted and indexes nothing, so every emitted element carries a strictly
      positive weight, exactly as q_t > 0 requires of the first form.
    locator: "def:weighted (the setting-dependent form, Eqs. eq:weighted-t and eq:support, and every domain condition); def:spec (b); def:compile (applied after the chain); thm:choice-encoding (v)-(viii); rem:relabel; ass:coin (ii)"
    read_through_the_setting_only: >-
      P is declared on T x F and reaches an outcome through t(v) alone. A
      weighting presented indexed by V, by the device outcome y, or by any
      component of v other than its setting is refused by type with
      `choice_weight_depends_on_outcome` -- a value f whose weight varied with
      the device outcome would be an inference from that outcome and not a
      choice. Locator: def:weighted; ass:coin; rem:relabel ("Why the
      weighting is read through the setting only");
      req:setting-only-weighting.
    where_it_is_applied: >-
      After the reduction chain has been consumed and its interface conditions
      decided, and before the validator and the gates read the emitted
      declaration: the emitted family is N_(v,f) = P(f | t(v)) F_v over V_P,
      the emitted outcome alphabet is V_P in its product order, and the public
      part is declared on it. Locator: def:compile; rem:relabel ("What is
      applied, and where").
    the_setting_map_is_declared_data: >-
      The compiler reads t; it does not decide that t is the artefact's class
      map. In def:weighted and in def:compile the compiler reads t: where the
      chain was emitted by reductions, t is that artefact's class map and is taken from
      it; where the family is declared directly, t is declared with it. What
      this module decides of t is that it is a total map V -> T, which is V1's
      totality clause on a declared map (def:validator, V1).
    fixed_here: >-
      The key name `choice_weighting` and its three field names are this
      file's. No claim names a machine key for this record. Everything else on
      the row -- the domain, the order, the support, the two refusals, the
      position -- is def:weighted's and def:compile's.

  - name: reduction_chain
    symbol: "Chain = (Ch_src, Ch_rec)"
    type: pair of ordered lists
    presence: always
    domain: >-
      Two typed segments, always both present: an Alice-side source-map
      segment on the transmitted system, L_s >= 0, which is a source segment
      in the sense of transmitter/def:source-segment; and a receiver-side
      squashing segment, L >= 1. What this module reads of a link, in its own
      words: a type tag, source and target system descriptors, a status tag,
      its channel as data where the link type has one, the constraint entries
      it transports, and a licence slot. A receiver-stage link in reductions'
      sense carries more -- its reachable-set statement and its carried
      operator pair -- and this module reads none of it. Status is in
      {exact, certified_outer, exploratory_numeric}. Composition order is the
      record's shape, not a tag (X1). The Band-A chain -- L_s = 0 and L = 1
      with Lambda_1 = id supplied as data, status exact, the identity outcome
      correspondence and the declared family as its target POVM -- is
      admissible (def:banda; thm:band-a), and a record of that shape whose
      link names its channel without supplying it, or whose outcome
      correspondence is not the identity, is refused
      (req:band-a-identity-link).
    locator: "def:spec (c); def:chaincond (C1)-(C5), (S1)-(S4) by reference to transmitter/def:source-segment, (X1); thm:chain-consumption; def:banda; thm:band-a"
    the_conditions_this_module_decides_on_it: >-
      def:chaincond, and they are the compiler's own: (C1) descriptor match by
      the four-component sector-map comparison, (C2) the outcome
      correspondence gamma as a tabulated total surjection from the physical
      alphabet onto the emitted one, (C3) the target POVM's exact
      admissibility per block, (C4) the pullback identity eq:pullback where
      every link supplies its channel as data, (C5) the slots; and, on the
      source segment, (S1)-(S4) of transmitter/def:source-segment decided here
      on the presented data. They are not reductions' composability (C1),
      tuple chaining (C2) and stage order (C3), whose numbering they share
      (rem:chaincond-reductions).
    what_is_not_decidable: >-
      Where some link supplies only a theorem constructor and no channel,
      eq:pullback is not decidable from the emitted data and the record must
      say NOT CHECKED and name A-LINK -- never `passed` (def:chaincond (C4);
      A-LINK).

  - name: target_sectors
    symbol: "Smap = (S, (d_s)_s, block kind)"
    type: sector map
    presence: always
    domain: >-
      |S| >= 1, d_s >= 1, sum_s d_s = d_Q, with a total order on S; supplied by
      the last link's target descriptor. This is the map every emitted
      Q-operator is a block list against, and check V1 compares it against the
      map each declared Q-operator family carries -- {F_v} and each hat O_k,
      and nothing else. A disagreement in block kind, in an identifier, in the
      order or in a dimension is refused with `sector_map_mismatch`, naming the
      first position at which the lists differ. The equality of this map with
      the last link's target descriptor is (C1)'s and is decided there and
      nowhere else.
    locator: "def:declaration (the sector map); def:validator, V1; def:chaincond (C1); def:target D(i)"

  - name: target_povm
    symbol: "{F_v}_{v in V}"
    type: "block lists + the sector map"
    presence: always
    domain: >-
      The receiver segment's target POVM, keyed: the last link of Ch_rec
      delivers it under this key, beside `reduction_chain` and
      `target_sectors`. One block list (F_v^(s))_{s in S} per v against
      `target_sectors`' map, over the alphabet V in the order the supplier
      declared it, which the compilation map takes as idxm's component there
      (def:compile). This module decides, exactly and on the numbers it will
      emit, that the family is exactly admissible for that map (def:exact):
      (T) at check V1, and (H), (P), (C) per block with (S) on each block's
      completeness sum, accumulated in that same order, at check V3. It is
      emitted unchanged as `bob_povm` -- unless a `choice_weighting` is
      declared, in which case the emitted family is its weighting
      N_(v,f) = P(f | t(v)) F_v over V_P and V3 decides that family
      (thm:chain-consumption (ii), thm:choice-encoding (v)); lem:weighted
      (i)-(ii) is what says the weighting cannot break what (C3) established.
      A family failing any of the five is refused, naming the predicate, and
      nothing is repaired. In Band A this family is the presented
      `receiver_povm` entry for entry, decided by (C4) at the identity
      channel and the identity outcome correspondence
      (req:band-a-identity-link); a link channel that is the identity says
      nothing of this slot on its own.
    locator: "def:spec (c); def:chaincond (C3); def:compile; def:exact; def:validator, V3; thm:chain-consumption (ii); def:banda (b); req:band-a-identity-link"

  - name: public_structure
    symbol: "(Party, a_A, a_B, sigma, r^0_h, h, phi, Chat)"
    type: record
    presence: always
    domain: >-
      Readouts and announcement maps total; the sifting predicate sigma total
      on Kann; phi total on Kann; the key rule r^0_h total on O_h x Kann and
      into Zval; h in {A, B}. The derived r_h of Eq. eq:rhold, valued in
      Z = Zval u {perp}, is an output and never an input (thm:sifting-and-key).
      Where a `choice_weighting` is declared the public part is declared on
      the emitted alphabets, which at the weighted factor is V_P (def:compile).
    locator: "def:spec (d); rem:sidecond (the key rule's codomain); thm:sifting-and-key; def:compile (declared on the emitted alphabets)"
    sigma_is_not_a_declaration_slot: >-
      The sifting predicate sigma is a component of the specification and is
      no slot of eq:declaration; the key-live set Chkey of Eq. eq:chkey is
      derived from it, and neither sigma nor Chkey is an emitted key
      (def:declaration; req:declaration-keys).

  - name: constraint_entries
    symbol: "{(hat O_k, bowtie_k, rhs_k)}"
    type: "list; each hat O_k a block list + sector map"
    presence: "always; m >= 0, EMPTY IS THE DEFAULT ROUTE"
    domain: >-
      m >= 0; hat O_k a block list against Smap, Hermitian block by block and
      decided exactly; typing per D(vi). Each entry arrives with a right-hand
      side of one of two types -- a real c_k or a Hermitian Theta_k on A, in
      trusted mode; a real scalar in untrusted mode -- and the
      `homogeneous`/`general` tag is that type, read off the datum here and
      emitted with the entry. No supplier is required to declare a tag field
      and an entry carrying none is not refused; an explicit field disagreeing
      with the type is refused at V6. This module passes the datum through
      unchanged and constructs no right-hand side of its own -- it forms no
      c_k tau_A and reads no c_k off any matrix (req:pass-through). Entries
      may also arrive transported along the chain, and an entry from either
      source is compared at V1 on the same footing.
    locator: "def:spec (e); def:homog; def:declaration (the tag is part of the datum); def:validator, V6; def:compile (the concatenation and its order)"
    the_pinned_supplier: >-
      reductions declares every entry's right-hand side as a real constant
      and, on a one-factor emission, emits the form beside it as the tag value
      `homogeneous` in trusted-source mode (reductions/def:licensed,
      reductions/cor:entries, named in def:homog's lead-in and not used);
      where the measured system is a declared product of party-scoped
      factors, an entry may instead arrive tagged `party_local`, with a scope
      (reductions/req:party-local-tag).

  - name: attack_set_license
    symbol: null
    type: record
    presence: "optional; REQUIRED by gate (G3)(b) whenever m >= 1 and a key-length-eligible declaration is wanted"
    domain: >-
      A pass-through attestation from the supplier of the chain. Never
      verified here: the compiler tests presence, never truth (thm:gates (i),
      (iii); req:attestation-presence). It is never supplied by this module
      and never synthesised. For a chain emitted by reductions it is that
      module's thm:licence (rem:obligations-discharged).
    locator: "A-ATK; def:eligible (G3)(b); thm:gates (i), (iii)"

  - name: feasibility_witness
    symbol: "omega*"
    type: "block list + sector map"
    presence: "optional; required by branch (c) of check V7 when m >= 1 and the default candidate fails"
    domain: >-
      One array omega*^(s) on A Q_s per s; nothing larger than one A Q_s block
      is assembled. Supplied as a block list against Smap -- the map it
      carries compared with Smap in block kind, in identifiers, in their order
      and in their dimensions, exactly as V1 compares the map of a declared
      Q-operator family. That comparison happens at V7 and nowhere else,
      omega* being a block list on A Q, no slot of eq:declaration, and
      quantified over by no target condition. Consumed and verified, never
      emitted (req:feasibility-witness).
    locator: "def:validator, V7 branch (c); thm:feasibility (ii); def:spec (e)"

  - name: chain_provenance
    symbol: null
    type: "record, in memory only, beside the specification"
    presence: >-
      optional; passed only by the part of the engine that ran the reductions
      module and docked its artefacts into the chain, and absent on every
      other route
    domain: >-
      The run's word that each measured factor's receiver segment of the
      presented chain is the instance link of a reductions artefact emitted in
      the same run, docked by that run with the artefact's declared model, or
      exactly its compression onto the presented physical receiver space, as
      that factor's physical receiver family; it names each such artefact
      (module version and link id), per factor.
      It is NO PART OF THE SPECIFICATION and is never read from one: the link
      types and status tags of a presented chain are data a specification
      written by hand can carry as well (def:spec (c)). The compiler reads it
      for one purpose, the presence rule of A-LINK, and decides on the
      presented chain the parts of req:link-row-provenance (ii) that are data
      -- for every measured factor one link in its segment, status exact, no
      channel supplied as data and the outcome correspondence the identity on
      its target alphabet, and an empty source segment -- emitting the row
      where any of them fails or the record does not name every factor. At
      several measured factors the joint discharge is
      reductions/thm:emitted-product (ii), (iii), the apparatus measuring the
      product of the factors' families by A-MEAS (reductions/ass:meas) (iv)
      (rem:obligations-discharged).
      The run passes it only for an artefact of an instance for which
      rem:obligations-discharged names the claim making the docked family
      the compression of the declared model: the flat instance
      (reductions/wpfss/prop:flat-instance). An artefact of any other
      instance keeps the row. It is no proof and no signature: a caller that
      constructs one asserts what the run asserts.
    locator: "req:link-row-provenance; rem:obligations-discharged; ass:link"
    fixed_here: >-
      The key name and that the record travels beside the specification
      rather than in it are this file's; req:link-row-provenance binds the
      key.

  # -------------------------------------------------------------------------
  # The general format's input rows, and the source segment's. Each row but
  # `reduction_chain.source_segment` is present only in the general format,
  # and its absence is the basic format, which every row above describes; the
  # source segment is always present, empty for every matrix-declared
  # specification. The `general_format` convention names the general format's
  # keys in one list; this block types them, says what is decided on each and
  # what is never formed from it. Locators: def:spec (a') to (e');
  # def:compile (the general format); def:validator (the general format).
  # -------------------------------------------------------------------------

  - name: alice_sector_factor
    symbol: "(T, (d_A_t)_t) with a party label"
    type: "sector map of the factor tagged A, or absent"
    presence: >-
      general format only; absent is |T| = 1 with A_t0 = A, which is the
      basic format
    domain: >-
      An ordered index set T with a dimension per sector and a party label,
      arriving inside the transmitter artefact as the map Alice's blocks are
      written against; the subspaces are spanned by vectors of the declared
      basis of A and sum_t d_A_t = d_A. At most one factor is tagged A and it
      is the first of the emitted factor list (def:declaration (DX1)).
    what_this_module_decides_on_it: >-
      Check V1 in its general-format reading: the dimension identity, the
      one block kind shared by every factor, and that the restriction of the
      emitted `label_index_map` to T is the order this map fixes. The maps
      carried by tau_A, by Alice's measurement blocks and by a `general`
      right-hand side are compared against it, four components each, with
      `sector_map_mismatch`.
    what_this_module_never_does_to_it: >-
      It declares no factor of its own, forms no rank of any tau_A^(t) and
      derives the joint sectors (t, s) rather than reading them as a datum.
    locator: "def:declaration (DX1); def:spec (a'); def:validator (V1, the general format); def:target (D(i), the general format)"

  - name: alice_form
    symbol: "`povm` or `ensemble`"
    type: enum
    presence: "general format only; absent is `povm`, which is the basic format"
    domain: >-
      Which of the two slots of def:declaration (DX4) the artefact filled,
      read off the artefact and never a second datum, exactly as the source
      mode is read off `alice_marginal`. `ensemble` exists in trusted mode
      only.
    what_this_module_decides_on_it: >-
      That the form the artefact declares is the form the mode admits: an
      `ensemble` form beside a marginal slot holding nomarg is refused with
      `ensemble_form_in_untrusted_mode` at check V3, which is D(iii)'s
      general-format clause.
    what_this_module_never_does_to_it: >-
      It converts neither form into the other. It does not form the denoted
      POVM eq:ensemblepovm from an ensemble slot and does not form
      tau_A^(1/2) M_x tau_A^(1/2) from a POVM slot (req:pass-through).
    locator: "def:declaration (DX4); def:spec (a'); def:compile (the general format); def:validator (V3, the general format)"

  - name: alice_ensemble
    symbol: "{N_x}_{x in X}"
    type: "one block list per x along T"
    presence: "general format, ensemble form only; in place of `alice_povm`"
    domain: >-
      Every block N_x^(t) Hermitian and positive semidefinite, with
      sum_x N_x^(t) = tau_A^(t) for every Alice sector t, the sum accumulated
      in the emitted index order of X, and tau_A^(t) non-zero for every t. The
      operators the declaration denotes, eq:ensemblepovm, are defined, in
      general irrational, and are formed by no one (req:derived-objects).
    what_this_module_decides_on_it: >-
      Check V3 in its general-format reading, per Alice sector: (H), (P), the
      identity with the declared block of tau_A entry by entry
      (`alice_ensemble_marginal_mismatch`) and that its declared-order sum
      rounds nowhere (`alice_ensemble_sum_rounds`); and at V2 that
      tau_A^(t) is non-zero (`alice_sector_marginal_zero`). Where a
      choice-weighted presentation of it is declared, each conditional
      ensemble is decided too, with `conditional_family_not_admissible`
      (def:weighted, the general format).
    what_this_module_never_does_to_it: >-
      It decides nothing on eq:ensemblepovm, forms no inverse square root and
      reads no rank; that the denoted family is a POVM on A is
      thm:sifting-and-key (v).
    locator: "def:declaration (DX4), eq:ensembleform; def:exact (the general format); def:validator (V2, V3, the general format); thm:sifting-and-key (v)"

  - name: receiver_parts
    symbol: "((party_f, physical system_f, {F^ph,f_w}, optional P_f))_{f in F}"
    type: "ordered list, one entry per measured factor"
    presence: >-
      general format only; a one-entry list IS the pair `receiver_povm` plus
      `choice_weighting` of the rows above, which is the basic format
    domain: >-
      One entry per measured factor, in the order of F, each with a party
      label drawn from the same two-party set {A, B} as the basic format (no
      third party is introduced), a finite-dimensional physical receiver
      system, a POVM on it -- possibly presented as a choice-weighted family
      -- and optionally that party's own setting-dependent public choice with
      its setting map on that factor's alphabet. No entry carries an operator
      on another factor's system and no product of physical families is
      presented.
    what_this_module_decides_on_it: >-
      Per factor exactly what it decides of the one-factor row: the physical
      family's exact admissibility as one block on that factor's physical
      receiver system (req:physical-family-decision), each declared
      conditional family where a presentation is made, and the stochastic
      conditions on each P_f. The order of the list is the order of
      the emitted factor list and of the derived product alphabet.
    what_this_module_never_does_to_it: >-
      It forms no product physical family and no product channel; each
      weighting is applied to its own factor's family after that factor's own
      segment.
    locator: "def:spec (b'); def:compile (the general format); def:weighted (the general format)"

  - name: reduction_chain.receiver_segments
    symbol: "(R^f_rec)_{f in F}"
    type: "one ordered list of receiver-stage links per measured factor"
    presence: >-
      general format only; one segment IS the `reduction_chain` row's Ch_rec,
      which is the basic format
    domain: >-
      Segment f's links act on factor f's physical receiver system and its last
      link's target descriptor is (Q_f, S^f, (d_f,s_f)) with target POVM
      {F^f_v_f}. The segments are separate lists because their links act on
      different systems; no link of one is composable with a link of another.
      What this module reads of a link is what the `reduction_chain` row lists,
      per segment. Where the factors' data are the ordered list of artefacts of
      reductions/thm:emitted-product, segment f is that factor's own.
    what_this_module_decides_on_it: >-
      (C1) to (C5) of def:chaincond of each segment separately, with (C1)'s
      last clause against that factor's sector map and not the derived product
      map, and (C4) as the per-factor pullback identity eq:pullback-factor.
      A failure is `chain_interface_condition_failed` naming the condition and
      the factor.
    what_this_module_never_does_to_it: >-
      It forms no product composite channel and decides no product pullback
      identity: eq:pullback-product is a consequence of the per-factor ones and
      is formed by no one (thm:chain-consumption (iii')).
    locator: "def:spec (c'); def:chaincond (the general format); thm:chain-consumption (i'), (ii'), (iii')"

  - name: reduction_chain.source_segment
    symbol: "Ch_src with its obligation records"
    type: "ordered list of source links, empty allowed"
    presence: >-
      always present, and EMPTY for every matrix-declared specification; a
      NON-EMPTY segment may be presented, and is then decided as `domain` and
      `what_this_module_decides_on_it` say
    domain: >-
      A source segment in the sense of transmitter/def:source-segment. A
      constructor link additionally carries its obligation record -- the kind,
      the claim id and the assumption short ids -- and the artefact carrying
      the segment carries the emitted closed soundness registry, one triple per
      admitted kind, eq:registry of that definition.
    what_this_module_decides_on_it: >-
      (S1) to (S4) as that definition states them, with the split inside (S3):
      the per-link identity is decided here for a link supplying its channel as
      data and is not decided here for a constructor link, whose identity is
      the conclusion of the claim its record names (A-LINK,
      thm:chain-consumption (iv'), (v')). And (A1) to (A3) of that definition,
      which are decided here on data: the triple compared entry by entry
      against the registry with both components of the assumption list, ledger
      membership of each, and the provenance rule that a non-empty segment is
      accepted only inside an artefact of the admitting module. Failures of
      (S1) to (S4) are `chain_interface_condition_failed` naming the
      condition, and a failure of (A1) to (A3) is refused by the
      transmitter's string, carried across the boundary
      (`reasons_that_belong_to_another_module`; req:chain-refusals).
    what_this_module_never_does_to_it: >-
      It does not decide that the named claim's conclusion applies to these
      descriptors -- family membership is the emitting module's assertion and
      no consumer re-proves a theorem -- and it does not compose the source
      segment with a receiver segment, which is reductions' theorem and is
      named in thm:chain-consumption (v') and never used.
    the_licensed_only_rule: >-
      Beside a non-empty source segment every emitted entry must carry a real
      scalar: `homogeneous`, `party_local`, or an untrusted-mode scalar. An
      entry declared `general` is refused with
      `general_entry_beside_source_segment`. The rule is the consuming side of
      reductions/def:chain's admission paragraph, whose reason is that module's
      ordering lemma; this module decides the type of the entry and states no
      reason of its own (rem:source-segment-rules).
    locator: "def:spec (c'); def:chaincond (the general format); transmitter/def:source-segment (S1)-(S4), (A1)-(A3); thm:chain-consumption (i'), (iv'), (v')"

  - name: public_structure.transcript
    symbol: "((pi_m, C_m, a_m))_{m = 1..L}"
    type: "ordered message list"
    presence: >-
      general format only; L = 2 with pi = (A, B) and a_2 independent of
      kappa_1 IS the pair `announce_alice`, `announce_bob`, which is the basic
      format
    domain: >-
      Message m carries a sender pi_m in {A, B}, a finite alphabet C_m and a
      total table a_m on O_pi_m x C_1 x ... x C_{m-1}. The joint announcement
      alphabet K = prod_m C_m and the joint function a are derived by
      eq:transcript and are declared by no one; sigma, r^0_hold, phi and the
      acceptance alphabet are declared on that derived K.
    what_this_module_decides_on_it: >-
      V1's totality clause on every table -- which is also the signature
      clause: a table whose stated domain names a later message's alphabet is
      not of the declared type and is refused there -- and V8's announcement
      clause; V4, V5 and V8's key clauses are then decided on the values of the
      derived a (thm:sifting-and-key (iv), (vi); thm:validator-soundness, the
      general format).
    what_this_module_never_does_to_it: >-
      It declares no joint announcement table and no acceptance class set of
      its own; and no measurement of a round reads a message of that round, the
      measurements being the fixed families of (DX3) and (DX4).
    locator: "def:declaration (DX5), eq:transcript; def:spec (d'); thm:sifting-and-key (iv), (vi); def:target (D(viii), the general format)"

  - name: constraint_entries.scope_and_tag
    symbol: "(O_k, rel_k, rhs_k; f_k)"
    type: "per entry: a factor label, and the tag value of its right-hand side"
    presence: >-
      general format only; one measured factor and no `party_local` tag is
      the basic format, where the scope is that factor and the two tags are
      the two of def:homog
    domain: >-
      The scope f_k names one measured factor of the emitted sector map, and
      O_k is a block list against that factor's map, Hermitian block by block.
      The tag is `homogeneous` (a real c_k), `general` (a Hermitian Theta_k,
      itself a block list along T) or `party_local` (a real c_k, in either
      source mode). An untagged entry is never read party-locally. The
      relation symbol is read by form and not by mode alone: an untagged
      entry carries {preceq, =, succeq} in trusted mode and {le, =, ge} in
      untrusted mode, as in the basic format; an entry tagged `party_local`
      carries {preceq, =, succeq} in either mode, its reading being an
      operator relation on A and the unscoped measured factors, with the
      scalar symbols admitted as well where every row of that entry is 1x1
      (one measured factor and d_A = 1). ex:two-party-shape declares such an
      entry: untrusted-source mode, a `party_local` entry at preceq.
    what_this_module_decides_on_it: >-
      Check V6 in its general-format reading: the relation symbol, the type of
      the datum, the arriving tag field against that type, and that the scope
      names a measured factor (`constraint_scope_not_a_factor`); and V1
      compares the map O_k carries against the map of its scope. Gate (G3)(a)
      then reads the tag and nothing else: the licensed class has three forms
      and compares no numbers (thm:gates (i')).
    what_this_module_never_does_to_it: >-
      It never forms the lifted operator 1 (x) O_k (x) 1 as a datum, at any
      step, V7's legs included: a constraint value is computed by contracting a
      joint block against O_k's block on its own tensor factor
      (thm:feasibility (ii), the general format; req:derived-objects).
    locator: "def:declaration (DX6); def:homog (the party-local form); def:spec (e'); def:validator (V1, V6, the general format); def:eligible (G3)(a)"

  - name: feasibility_witness.joint
    symbol: "omega*"
    type: "block list over the joint sectors + its map"
    presence: "general format only; |T| = 1 is the `feasibility_witness` row above"
    domain: >-
      One array omega*^(t,s) on A_t Q_s per joint sector; nothing larger than
      one joint block is assembled, which is the general-format form of the
      `operator_form` convention's scope.
    what_this_module_decides_on_it: >-
      Branch (c) of V7, and there alone: the map compared in four components,
      then the per-joint-block verification of thm:feasibility (ii) in its
      general-format reading.
    locator: "def:validator (V7, the general format); thm:feasibility (ii), the general format; def:spec (e')"

# ---------------------------------------------------------------------------
# retired_input_rows
#   Input keys a supplier might expect this module to read and that it does
#   not read, each with the reason.
# ---------------------------------------------------------------------------
retired_input_rows:

  - name: source_mode_request
    why_it_is_not_an_input: >-
      The source mode is not a request here. It is read off the transmitter
      artefact's marginal slot and off nothing else (def:compile; def:spec
      (a)), and the transmitter refuses a trusted-mode request at d_A >= 2
      that carries no certificate before any artefact exists
      (`trusted_mode_without_certificate`, a row of the `refusal_reasons` of
      spec/modules/transmitter/interface.yaml). So there is no request for
      this module to serve and no fallback for it to take: rows 2 and 4 of
      the gate outcome table are unreachable (thm:gates (ii); req:gate-outcomes), thm:gates (ii)
      names two permitted outcomes, and prop:conservative is a statement about
      the feasible sets and not a rule of emission (rem:notfallback).
    locator: "thm:gates (ii); def:gate-outcome-table; req:gate-outcomes; def:compile; prop:conservative; rem:notfallback; transmitter/def:source-spec"

# ---------------------------------------------------------------------------
# outputs
#   The twenty-three machine keys of the emitted declaration artefact, under
#   exactly the names the consuming engine reads (def:declaration; the
#   consumer-agreement record below).
#
#   The twenty-three are not the slots of eq:declaration, which are fewer:
#   `label_index_map`, `reduction_chain_record`, `gate_report` and
#   `key_length_eligible` are among the twenty-three keys and are no slots of
#   that tuple -- they are what def:compile and thm:gates emit beside the
#   declaration.
#
#   Four further rows are this file's and are marked `fixed_here`:
#   `choice_weighting_record`, `assumption_ledger` (the shape every module of
#   this repository emits), `assumption_bindings` (the declared values each
#   ledger row binds) and `mathematical_spec_version`. The general format's
#   rows follow in a block of their own.
#
#   Two of the consuming engine's inputs are not outputs of this module and
#   are listed under `not_outputs`: `acceptance_set` is the statistics
#   module's and `rounds` is a run parameter. There is no tolerance key, in
#   either direction: this module declares none, reads none and emits none.
# ---------------------------------------------------------------------------
outputs:

  - name: alice_dim
    symbol: d_A
    type: int
    presence: always
    domain: "d_A >= 1."
    locator: "def:declaration; def:spec (a)"

  - name: alice_marginal
    symbol: "tau_A, or null"
    type: "matrix on A, or null"
    presence: always
    domain: >-
      Hermitian, tau_A >= 0 and tr tau_A = 1, all three decided exactly and
      the trace accumulated over the row index without rounding (trusted mode,
      at check V2); null = nomarg (untrusted mode). A singular tau_A is
      admissible; tau_A = 0 is not, its trace being 0. Its presence is the
      emitted mode.
    locator: "def:declaration (the marginal slot); def:target D(ii); def:validator, V2; def:compile (passed through unchanged)"
    passed_through_note: >-
      The value is the transmitter artefact's, passed through unchanged,
      including the [1] the transmitter filled the slot with at d_A = 1 and
      recorded as filled. This module fills no slot (def:compile;
      req:pass-through). The predicates are nevertheless re-decided at V2 on
      the emitted matrix, which is `decide_never_infer`.

  - name: source_replacement_license
    symbol: null
    type: record
    presence: "emitted exactly when trusted mode is emitted at d_A >= 2"
    domain: >-
      The transmitter's licence record, carrying (SR1)-(SR3) of
      transmitter/def:srcert, passed on to the consuming engine after gate
      (G2) has re-decided its five decidable conditions on the emitted data.
      Vacuous at d_A = 1, and then neither emitted nor demanded
      (transmitter/rem:da1).
    in_the_general_format: >-
      The sentence above is the pure-form reading, which is the only form a
      declaration in the basic format can be accompanied by. Where the record
      is an ensemble presentation, gate (G2) decides (E1) to (E3) of
      transmitter/def:srcert and the entry-for-entry identity of the
      declaration's Alice slots with the transposed declared blocks instead of
      the five; and at two or more Alice sectors the five do not hold of the
      operator that presentation defines -- Psi is a direct sum of blocks each
      a positive multiple of a rank-one projector, so Psi^2 != Psi -- and
      global purity is not demanded there. A certificate declared in block
      form is refused. Locator: def:eligible ("(G2) by form of the
      certificate"); thm:gates (i'); rem:gate-by-certificate-form. A reader of
      this row must not infer a globally pure certificate from it.
    locator: "def:eligible (G2) (this module consumes it there and re-decides its five conditions); thm:gates (i), (iii) (what the gate decides of it, and what passing records); transmitter/ass:src (the attestation the transmitter carries into its artefact); transmitter/def:srcert. That the record is passed on, and when, is req:source-licence-passed-on"

  - name: party_partition
    symbol: Party
    type: record
    presence: always
    domain: >-
      The readouts rd_A, rd_B with their alphabets, the party labels, and for
      each s the declared tensor factorisation of H(Q_s) with a party label
      per factor.
    locator: "def:declaration; def:spec (d); def:target D(iv)"

  - name: sector_index_set
    symbol: S
    type: ordered label list
    presence: always
    domain: "|S| >= 1, with a total order; the order idxm's component on S must equal (D(i), last clause; decided by V1)."
    locator: "def:declaration (the sector map); req:declaration-keys; def:target D(i); def:validator, V1"

  - name: sector_dims
    symbol: "(d_s)_s"
    type: int list
    presence: always
    domain: "d_s >= 1 and sum_s d_s = d_Q, decided by V1."
    locator: "def:declaration; def:validator, V1"

  - name: sector_block_kind
    symbol: null
    type: label
    presence: always
    domain: >-
      The block kind that names what the sector identifiers mean. A key of
      this module, which the consuming engine reads under this name (its
      `sector_block_kind` input row); it is emitted so that the
      three-component comparison that engine's text requires has a datum to
      run on (req:declaration-keys).
    locator: "def:declaration (the sector map); req:declaration-keys; row (1) of the consumer-agreement record"

  - name: alice_povm
    symbol: "{M_x}_{x in X}"
    type: matrix list
    presence: always
    domain: >-
      One matrix on A per x -- A carries no sector decomposition -- with M_x
      Hermitian and M_x >= 0 for each x and sum_x M_x = 1_A, all decided
      exactly, and the completeness sum in the emitted index order verified to
      round nowhere (def:exact (S); check V3, reason
      `alice_povm_summation_rounds`).
    locator: "def:declaration; def:target D(iii); def:validator, V3; def:exact"

  - name: bob_povm
    symbol: "{F_v}_{v in V}, or {N_(v,f)}_{(v,f) in V_P}"
    type: "block lists + the sector map"
    presence: always
    domain: >-
      One list (F_v^(s))_{s in S} per outcome, against Smap; the family exactly
      admissible for Smap in the sense of def:exact -- (H), (P) and (C) per
      block and at zero, and (S), the declared-order completeness sum rounding
      nowhere, per block. The identity F_v = (+)_s F_v^(s) is what the list
      means, not a condition on it, and nothing larger than a single sector
      block is emitted (req:operator-form). Where a `choice_weighting` is
      declared the emitted family is N_(v,f) = P(f | t(v)) F_v over the
      support V_P in its product order, and it is that family the five
      conditions are decided of (thm:choice-encoding (v); def:compile).
    locator: "def:declaration; def:target D(iii); def:exact; def:validator, V3; def:weighted Eq. eq:weighted-t; thm:choice-encoding (v); def:compile"

  - name: reference_companion
    symbol: "D^ref"
    type: "a compiled declaration, its measured family an entrywise enclosure, marked evaluation-only"
    presence: "exactly where the last link of the receiver segment of one or more measured factors was emitted with a reference companion (reductions/req:reference-companion); one companion for all of them"
    domain: >-
      The compilation map applied to the same specification with, for every
      such factor, that link's target family replaced by its companion's and
      its entries by the companion's relaxed entries, every other factor's
      family and entries kept; weighting products formed exactly on the
      enclosure (centre times the weight, radius times its modulus), and a
      factor enclosure the companion carries on a block passed with its box
      unaltered and its core multiplied exactly by the weight (lem:weighted-factor),
      or unaltered where no weighting applies; none of
      the predicates of def:exact, def:validator or def:chaincond decided on
      it; no bundle to be solved emitted from it; the companion's record
      carried unchanged, with a reference to the declaration it accompanies.
    locator: "req:reference-companion-compiled; def:compile; def:weighted; lem:weighted; lem:weighted-factor; meat-core/prop:reference-companion"

  - name: announce_alice
    symbol: a_A
    type: function table
    presence: always
    domain: "total on O_A."
    locator: "def:declaration Eq. eq:jointann; def:target D(iv)"

  - name: announce_bob
    symbol: a_B
    type: function table
    presence: always
    domain: >-
      total on O_B. Declared on the emitted readout alphabet, which on Bob's
      side is the one induced by V_P where a weighting is applied
      (def:compile); a finer alphabet is a larger table and no new condition
      (rem:alphabet).
    locator: "def:declaration; def:target D(iv); def:compile; rem:alphabet"

  - name: accept_statistic
    symbol: "phi: Kann -> Chat"
    type: function table
    presence: always
    domain: "total."
    locator: "def:phi; def:declaration; def:target D(iv); rem:phitotal"

  - name: key_map
    symbol: "r: X x V -> Z"
    type: function table
    presence: always
    domain: >-
      Z = Zval u {perp}; announcement-determined sifting. Built by the
      compilation map from the sifting predicate and the holder's key rule, Eq.
      eq:rdef, and never accepted as a hand-written table (thm:sifting-and-key;
      rem:rbuilt).
    locator: "def:compile Eq. eq:rdef; thm:sifting-and-key; def:target D(v), D(viii); def:validator, V4, V5, V8"

  - name: key_holder
    symbol: h
    type: enum
    presence: always
    domain: "h in {A, B}; r factors through rd_h and a (party computability, D(viii), decided at V8)."
    locator: "def:declaration; def:target D(viii); def:validator, V8; thm:sifting-and-key"

  - name: constraint_list
    symbol: CList
    type: "list; each hat O_k a block list against the sector map"
    presence: "always; EMPTY IS THE DEFAULT ROUTE"
    domain: >-
      Typed per D(vi); each hat O_k emitted as (hat O_k^(s))_{s in S} against
      Smap, Hermitian block by block and decided exactly. The concatenation of
      the specification's own entries with those transported by the links of
      Ch_src and then of Ch_rec, each segment in its own order, and each entry
      with the datum its right-hand-side slot holds, passed through unchanged
      (req:pass-through).
    locator: "def:declaration; def:compile; def:target D(vi); def:homog; def:validator, V3, V6"

  - name: constraint_rhs_tag
    symbol: null
    type: "enum per entry"
    presence: "one per entry of CList"
    domain: >-
      `homogeneous`, carrying a real c_k, or `general`, carrying a Hermitian
      Theta_k on A, in trusted mode; a real c_k in untrusted mode. The tag is
      the type of the right-hand side and is read off it here, not declared by
      any supplier and not taken on a supplier's word. The consumer
      constructs Theta_k := c_k tau_A for a `homogeneous` entry; this module
      does not.
    locator: "def:homog; def:declaration; def:validator, V6; row (5) of the consumer-agreement record"
    key_name_note: >-
      A key of this module, as `sector_block_kind` and `label_index_map` are,
      which the consuming engine reads under this name beside
      `constraint_list`; it is emitted so that the type check row (5)
      describes has a datum on the wire (req:declaration-keys).

  - name: attack_set_license
    symbol: null
    type: record
    presence: "present only if supplied"
    domain: "Pass-through. Never verified, never supplied, never synthesised (thm:gates (i), (iii); A-ATK; req:attestation-presence)."
    locator: "A-ATK; def:eligible (G3)(b); thm:gates (iii)"

  - name: acceptance_alphabet
    symbol: Chat
    type: finite set
    presence: always
    domain: >-
      Emitted for the statistics module, which constructs the acceptance set on
      it. This module emits no acceptance set.
    locator: "def:phi; def:declaration; the `not_outputs` block below"

  - name: label_index_map
    symbol: idxm
    type: bijection table
    presence: always
    domain: >-
      Total and injective on each declared alphabet and on S; fixes the
      operator index order and with it the declared summation order of
      def:exact (thm:typing). Its restriction to S is required to be the
      sector map's own total order -- one order on the sectors, not two --
      which is the last clause of D(i), holds by construction (def:compile)
      and is decided by V1 on the emitted data. It does not index the basis
      of a matrix on A or on Q_s: a trace is accumulated in the row order of
      the emitted array, which the array itself determines. It does not index
      T_pub, whose order is declared with the `public_choices` record.
      Semantic labels are metadata; indices are binding.
    locator: "def:compile; def:target D(i); thm:typing; def:validator, V1; def:exact"
    the_emitted_bob_alphabet: >-
      Where a `choice_weighting` is declared, idxm's component on the weighted
      factor's alphabet is the support V_P in its product order -- v in the supplier's
      declared order and, within each v, f in the declared order of the choice
      alphabet, the pairs off the support omitted. That is the order (S) is
      decided in on the emitted family and the order idxm emits. Where a
      `public_choices` record is resolved instead, this component is not fixed
      by that record: it is the order arriving with the alphabet that indexes
      the family the weighting produces -- the last link's target order in
      Band A, which is the only case in which that alphabet is Bob's emitted
      one -- and the record's listing only where no order arrives
      (`which_order_when_a_family_arrives_ordered`). On the two together: in
      the overlap of the two forms, P(f | t) = q_f, the alphabet the first
      form produces is listed choice-major and the support of the second
      outcome-major, so the same family declared through the two records has
      its (S) decided in transposed orders; (S) is order-dependent by
      construction (def:exact), and def:weighted discloses this rather than
      resolving it. Locator: def:compile ("The binding rule"); def:weighted,
      Eq. eq:support and the overlap sentence; rem:condfamily.
    key_name_note: >-
      A key of this module, which the consuming engine reads under this name
      (its `label_index_map` input row); it is emitted so that the one order
      the two contracts must agree on has a datum on the wire (row (7) of the
      consumer-agreement record; req:declaration-keys).

  - name: reduction_chain_record
    symbol: Chain
    type: pair of ordered lists
    presence: always
    domain: >-
      The consumed chain in both segments, carried through with its statuses,
      transported constraint entries and licence slots, even when the source
      segment is empty and the receiver segment is one identity link with both
      slots empty (req:chain-record-slots). Unchanged by the weighting: a
      relabelling composes no channel, has no kind, no register and no position
      in a chain, so nothing of this record moves when a
      `choice_weighting` is applied (rem:relabel, "Why it is not a link").
    locator: "def:spec (c); def:chaincond; thm:chain-consumption; rem:relabel; req:chain-record-slots"

  - name: choice_weighting_record
    symbol: "(F, t, P, the orders)"
    type: record
    presence: "emitted exactly when a `choice_weighting` was declared at some measured factor"
    domain: >-
      One entry per measured factor at which a weighting was applied, each
      naming that factor, recorded beside the chain record
      as this module's own construction (req:choice-weighting-record); per
      entry the declared stochastic matrix P, the setting alphabet T
      and the choice alphabet F with its declared order, the setting map t, and
      the product order of the emitted support V_P. Emitted for the same reason
      the choice-weighted family of the setting-independent form is visible in
      the emitted alphabet: the weighting is a construction of this module and
      not a datum it was handed, and a consumer must be able to see what was
      applied and to what.
    locator: "def:weighted (the setting-dependent form and the product order); def:compile; req:choice-weighting-record; rem:relabel"
    fixed_here: >-
      The key name and the field list are this file's. req:choice-weighting-record
      binds the key and states that the weightings are recorded beside the chain
      record, one entry per weighted factor naming the factor; no claim states
      the other fields.

  - name: key_length_eligible
    symbol: null
    type: bool
    presence: always
    domain: >-
      `true` only when every gate of def:eligible passes (req:eligibility-flag).
      What the flag means, in full: the consuming engine's own licensing
      conditions hold of this declaration -- every trusted-mode entry declared
      `homogeneous`, the attack-set licence present where m >= 1, the
      source-replacement licence present where a marginal is declared at
      d_A >= 2 -- and the declaration is exactly admissible in the sense of
      def:exact, so that engine's admission rule accepts it. Nothing weaker. A
      declaration with `false` may be used for numerical exploration and must
      not reach a key-length output.
    locator: "def:eligible; thm:gates (ii), (iii); A-RHOM"
    where_round_homogeneity_is_spent: >-
      This flag is where this module spends A-RHOM. Gate (G2) decides the
      certificate once and transmitter/thm:certificate-sufficiency (iii) is a
      single-round statement, so the flag -- one declaration may back a
      key-length claim for the run -- says of the run only what one
      declaration can say of every round (def:eligible (G2); thm:gates (iii);
      A-RHOM).

  - name: gate_report
    symbol: null
    type: record
    presence: always
    domain: >-
      Per gate: passed / failed / passed vacuously, with the degeneration
      record of rem:degenerate where it applies (req:vacuous-gate-report).
      And, per exact predicate of def:exact that the compiler decided and per
      further decision of the kind the enumeration below delimits, the
      outcome, keyed by (source, element, block) -- the source being the
      check, the gate, the interface condition or the compilation map that
      decided it, the last being where a decision taken in filling
      eq:declaration rather than in checking it is recorded. A failed
      predicate is recorded with the block, outcome, signal or entry index at
      which it first failed, and (S) additionally with the index of the first
      inexact addition. There are no measured defects to report and none is
      reported: every entry of this record is an outcome, not a number.

      Which decisions are keyed is the enumeration's to say, and where this
      clause and its scope note disagree the scope note binds. The sentence
      above reaches every exact predicate of def:exact the compiler decided,
      and recorded_predicates.scope_note says the enumeration "LISTS EVERY
      DECISION THE RECORD KEYS PER ELEMENT AND IS COMPLETE FOR THOSE" and
      then omits some of them -- (C3)'s per-block legs on the family the last
      link delivered being the case in point, decided in chain.py's _check_c3
      and named in neither list -- so the transcript keys the enumeration.
      This limits what the row asks the record to key and changes nothing the
      module decides: a condition the enumeration does not key is still
      decided, and still reported through the outcome of the gate that carries
      it and, on a failure, through `refusal`.
    locator: "def:eligible; thm:gates (ii); rem:degenerate; def:exact; def:validator; def:chaincond"
    implementation_status: >-
      What the code emits, both halves of this row. (a) The verdict per gate
      with the degeneration record where rem:degenerate applies: the `gates`
      list of src/certiqs_key/protocol_compiler/gates.py. (b) The
      per-predicate outcome keyed by (source, element, block), beside it under
      the key `predicates`: one entry per decision, in the order the stages
      took them, carrying the outcome, the index at which a failed predicate
      first failed and, for (S), the index of the first inexact addition. The
      record is src/certiqs_key/protocol_compiler/transcript.py and each
      decider fills it where it decides -- validation for V1, V2, V3, V6 and
      check V7's condition (T); feasibility for the four legs of
      thm:feasibility (ii), per block for (H) and (P) and per constraint entry
      for the Loewner-or-scalar leg; chain for (C1), (C4), (S1), (S2) and
      (S3); weights for the compilation map's own decisions, the conditional
      families of a declared `public_choices` presentation included; and
      compile for gate (G2)'s certificate-form predicates, off the
      verification it re-decides. The pure form and the ensemble-presentation
      form have different inventories, stated under
      recorded_predicates.form_reporting below. In the general format with
      more than one measured factor, every key of a decision on one factor's
      own data -- the weight list and representability of its presentation
      or weighting, the conditions of its receiver segment, V1's comparison
      and V3's predicates on its family -- carries the factor label and a
      colon before the element (transcript.scoped_to_factor), so that two
      factors of one party never share a key; at one measured factor the
      keys are the accepted format's (tests/unit/test_protocol_general_compile.py).
      Completeness against the
      `recorded_predicates` enumeration below is held by
      tests/unit/test_protocol_compiler_transcript.py, which reads the eight
      items out of this row; the two halves are held against each other by
      tests/oracles/test_protocol_compiler_registry_interface.py.

      The conditional families' admissibility is decided and keyed.
      weights.decide_conditional_families takes the decision,
      compile.decide_every_conditional_family calls it on every declared
      presentation of either party, each measured factor's in the general
      format, before the chain stage (`fail_closed` row 1),
      reasons spells conditional_family_not_admissible, and the transcript
      carries one (T) entry per presentation and (H), (P), (C), (S) per choice
      value, keyed per (source, party, choice value, block), the party prefixed
      by the factor label where several factors are presented -- the block being
      null, a `public_choices` record declaring one undecomposed array per
      outcome and no sector map. ex:condfamily is a test that refuses
      (tests/unit/test_protocol_conditional_families.py).

      The physical receiver family as presented is decided and keyed
      (req:physical-family-decision, since the engine-internal premises
      batch). compile.decide_physical_family takes the decision on each
      measured factor's family, after its conditional families and the
      representability of the products formed from them and before the chain
      stage; reasons spells physical_family_not_admissible; the transcript
      carries, under the compilation map and keyed by the element
      `<factor>:{F^ph_w}` with a null block, (H), (P), (C) and (S) of a family
      presented directly and (S) alone of one presented choice-weighted
      (tests/unit/test_protocol_physical_family_decision.py).

      The ideal receiver and the identity link on the Band-A route and the
      source identity at d_A = 1 are decided and not keyed
      (req:band-a-ideal-receiver; req:band-a-identity-link;
      req:da1-source-identity). declared_premises.decide_band_a_ideal_receiver,
      declared_premises.decide_band_a_identity_link and
      declared_premises.decide_da1_source_identity take them; compile calls
      the first two, in that order, after the physical family and before the
      chain stage, and the third once Alice's family is resolved and before
      anything is emitted. A failure is reported through `refusal`, its
      detail naming the failing clause, or the letter and the first differing
      entry; the enumeration below names none of the three decisions, so a
      pass leaves no entry (tests/unit/test_protocol_declared_premises.py).

      Two limits on what the enumeration names: transmitter-owned ensemble
      conditions remain with the transmitter, and this record neither infers
      nor repeats their verdict; and an equality constraint row is one exact
      equality decision, which thm:feasibility proves equivalent to the two
      operator inequalities and thm:validator-soundness counts as one.

      (C3)'s per-block legs are decided and not keyed: the enumeration does not
      name them and the scope note binds (the `domain` above), so they are
      reported through the outcome of the gate that carries them.

      None of this changes a verdict, a refusal or a numerical declaration.
    recorded_predicates:
      scope_note: >-
        THE ENUMERATION LISTS EVERY DECISION THE RECORD KEYS PER ELEMENT AND IS
        COMPLETE FOR THOSE. It is the full applicable inventory, not a claim
        that a failed execution reaches every predicate. Records contain only
        executed decisions; absent prerequisites and early returns contribute
        no invented outcomes. The conditions it does NOT list are the
        combinatorial and presence tests that carry no per-element key -- V1's
        finiteness, non-emptiness, totality and d_Q = sum_s d_s clauses; checks
        V4, V5 and V8; the domain condition q_t > 0 on a declared weight,
        refused by its SIGN rather than measured, and likewise
        P(f | t) >= 0 (def:weighted); (C2)'s totality and surjectivity count;
        and the presence tests -- V7's emptiness test on CList at its first
        branch, the slots of (C5) and (S4), the licence record and its clause
        (SR3) at gate (G2), and the licence at (G3)(b). Those are recorded
        through the outcome of the gate that carries them -- (G1) for V1-V8,
        (G2) and (G3) for their own -- and, where one fails, through `refusal`.
        TWO CONDITIONS ARE DECIDED NOWHERE and so stand in neither list: (C3)'s
        typing half, which the emitted form holds, and (X1), which is the shape
        of the record and not a condition on data (thm:chain-consumption (i)).
      transmitter_owned_conditions: >-
        The virtual ensemble conditions p_x >= 0, sum_x p_x = 1 with no
        rounding, and rho^v_x in S_=(A^v) are decided by the transmitter
        before its artefact exists (transmitter/def:srcert). The compiler
        neither re-decides nor infers those verdicts; they have no keyed
        compilation_map entry. G2 decides the certificate's own conditions.
        On an ensemble presentation its re-decision of E1-E3 is a compiler
        decision on that presentation, not an inferred transmitter verdict.
      form_reporting:
        legacy_v1: >-
          V1's four map components are keyed per declared Bob family element
          and constraint operator; idxm's declared sector-order agreement has
          its own key. Alice's undecomposed arrays carry no sector map here.
        general_v1: >-
          Key the same four-component comparisons per measured-factor family
          element and scoped constraint operator against the corresponding
          factor map. Also key comparisons of the present marginal, every
          Alice measurement-slot operator (M_x in POVM form, N_x in ensemble
          form) and each general right-hand side against the Alice factor's
          map. There is no marginal comparison at nomarg and no Alice map
          comparison where no A factor is declared. Declared index restrictions
          are order comparisons; the joint/product orders derived from the
          factors are not additional supplied choices. Finiteness, transcript
          signature/totality, factor-list and dimension clauses have no element
          keys: G1 and its refusal carry their outcome. Chain descriptors and
          supplied-witness maps retain their C1 and V7 ownership.
        pure_g2: >-
          A pure certificate has keyed Hermiticity, idempotence, trace identity
          and trace summation predicates for Psi, SR1 for tau_A, and SR2 per
          signal label. The trace identity and its no-rounding condition are
          distinct entries. Missing-certificate and SR3-presence tests have no
          element keys and are reported by G2's gate outcome/refusal.
        presentation_g2: >-
          An ensemble presentation has one aggregate keyed G2 predicate
          '(E1) to (E3)', element 'ensemble presentation', block null, and
          keyed G2 transpose identities N_x^(t) = (sigma_x^(v,t))^T per
          signal label and Alice sector. E1-E3's internal checks are not
          individually keyed. Declaration-form admissibility and attestation
          presence are reported through gate outcomes/refusals. Agreement of
          sector maps is already covered by V1; V3 checks the declaration's
          sum_x N_x^(t) = tau_A^(t). Together with the keyed transpose identities
          these establish the presentation/declaration marginal agreement;
          there is no separately executed G2 marginal predicate to report.
          The canonical Psi and its SR1/SR2 or rank properties are derived,
          not declared or executed predicates. A general block certificate
          is refused by the form rule and is given no list of successful
          pure-certificate predicates. The gate outcome records a
          non-applicable G2 branch without synthesising missing predicates.
      the_enumeration:
        - "the (H), (P), (C) and (S) decisions of checks V2 and V3 on tau_A when present, on {M_x} in POVM form or {N_x} in ensemble form, on each emitted Bob block family and on each hat O_k^(s); in the general format these run per Alice sector or measured factor and sector as def:validator states, including V2's nonzero marginal block decision in ensemble form and V3's ensemble marginal identity in place of POVM completeness; nomarg has no V2 arithmetic or summation predicates"
        - "the decisions check V7 takes on the candidate it verified -- Hermiticity and positive semidefiniteness per block and the trace, NO COMPLETENESS SUM BEING DECIDED ON A CANDIDATE -- together with the marginal equality omega_A = tau_A in trusted mode and one comparison per constraint row: one Loewner or scalar inequality decision, or one exact entrywise equality decision for =, equivalent to the two operator inequalities (thm:feasibility (ii)); general-format rows are indexed by Alice sector or by Alice sector and complementary measured sectors for a party_local entry"
        - "the type decisions of V6, including each entry's right-hand-side tag and the type it was read off, together with the one decision of that check that is on DATA rather than on a type -- the exact Hermiticity Theta_k = Theta_k^dagger of a `general` entry's matrix right-hand side, required by D(vi) and counted in Eq. eq:predcount"
        - "V1's sector-map comparison, reported per declared operator and per component (block kind, identifiers, order, dimensions): in the basic format Bob-family elements and constraint operators; in the general format per-factor families, scoped constraint operators, and Alice's present marginal, measurement-slot operators and general right-hand sides; declared index-order comparisons and aggregate-only conditions follow form_reporting.legacy_v1 and general_v1"
        - "the sector-map comparison check V7 makes where it passes on branch (c), on the map a supplied witness omega* carries -- condition (T) of def:exact, decided in the same four components and recorded under V7 as its source, that being the one place a witness's map is compared"
        - "the exact identities (SR1), (SR2) and the conditions on declared Psi for a pure certificate; for an ensemble presentation, the aggregate E1-E3 predicate and per-(x,t) transpose identities instead, with keyed versus aggregate reporting and prior V1/V3 agreement decisions as form_reporting specifies; derived canonical Psi properties are not reported as executed predicates"
        - "the exact identities (C4) and the source identity (S3), together with the descriptor decisions of (C1) and (S1) -- (C1)'s inter-link matches, its match of Lambda_1's source descriptor against the physical receiver space, and its last clause, the four-component comparison of Lambda_L's target descriptor against (Q, Smap); and (S1)'s inter-link matches -- and (S2)'s comparison of the two index sets each source link carries and of the |X| declared weights p_x it leaves untouched, all decided on the reduction chain (def:chaincond)"
        - "AND THE DECISIONS THE COMPILATION MAP TAKES IN FILLING eq:declaration, recorded under that source: on a choice-weighted presentation, sum_t q_t = 1 decided exactly with the sum accumulated in the order the `public_choices` record lists T_pub in and required to round nowhere, a list failing either refused with `choice_weights_not_normalized` (req:weight-list), and the exact admissibility of each conditional family {N_{u|t}}_u, which is DECIDED and not assumed -- (H), (P), (C) and (S) per block and per choice value, (S) in the restriction to that choice value's elements of the order on the alphabet that indexes the weighted family, and (T) as the four-component agreement of the maps those families carry -- KEYED PER (SOURCE, PARTY, CHOICE VALUE t, BLOCK), one entry per decision beside the weighted family's own, carrying the outcome, the index at which a failed predicate failed and, for (S), the index of the first inexact addition, and refused with `conditional_family_not_admissible` (def:weighted; def:compile; rem:condfamily; def:well-formed-spec (iv)); on a declared `choice_weighting`, each row sum sum_f P(f | t) = 1 decided exactly in the declared order of F and required to round nowhere, and the support decided by the sign of each entry (def:weighted, Eq. eq:support); the decision that every entry of every emitted N_(u,t), respectively of every emitted N_(v,f), is a binary64 number, whose failure is `emitted_value_not_representable`"

  - name: refusal
    symbol: null
    type: "record or absent"
    presence: "present exactly when the compiler refuses"
    domain: >-
      Carries a machine-readable reason naming the failed check, gate or
      interface condition and the block, outcome, entry or signal index at
      which it failed. A refusal emits no declaration. The reason vocabulary
      is `refusal_reasons` below.
    locator: "thm:gates (ii); def:validator; def:chaincond; the fail_closed convention"

  - name: assumption_ledger
    symbol: "A-..."
    type: "list of machine keys"
    presence: always
    domain: >-
      The machine keys of the assumptions the emitted declaration rests on:
      this module's own rows under their presence rules and the transmitter's
      keys read off the transmitter artefact's own ledger. It carries no row
      of reductions/ass:recv (A-RECV) on any route
      (`assumption_ledger.a_recv_not_emitted_note`). No
      reductions artefact is an input of this module (def:spec (c) hands it a
      chain record; the inputs table keys it as `reduction_chain` and the
      transported rows), so the reductions module's ledger is not read here:
      what a run inherits from that module reaches its assumption manifest as
      the ledger rows of each reductions artefact it consumed
      (rem:obligations-discharged; `assumption_ledger.not_carried_here`
      below). The rows, their keys and their presence rules are
      `assumption_ledger` below.
    locator: "this file's header (the binding of machine keys); the assumption files (ass:*)"
    fixed_here: >-
      The emitted key is this file's. The transmitter and reductions artefacts
      both emit a ledger, a consumer matches keys against the supplier's
      ledger, and a run manifest is assembled from them (spec/architecture.md
      4.4), so this module emits one too. The ledger's shape and its presence
      rules are this file's. No claim states that the keys bind this file:
      this file's header does.

  - name: assumption_bindings
    symbol: null
    type: "mapping: machine key -> (name -> value)"
    presence: "always; one entry per ledger row, in its order; empty on a refusal"
    domain: >-
      Beside each row of `assumption_ledger`, the declared values the row's
      assumption's clauses are about, each named by the declared input it
      comes from: `assumption_ledger.binds` lists the names per row with the
      clause each comes from. A value is a string, an integer, a boolean, a
      list, or an object of further names, an exact rational written "p/q".
      An operator is bound by its shape (the alphabet that indexes it and its
      dimension) and never inlined: its entries are the other output keys. A
      row whose clauses name no declared value of this module carries an
      empty object, and the transmitter's rows carry the transmitter
      artefact's own `assumption_bindings`, copied as its ledger is.
    locator: "ass:spec; ass:alice-meas; ass:rhom; ass:coin; ass:link; ass:atk; ass:ideal; transmitter/ass:ens; transmitter/ass:src; transmitter/decoy/ass:wcp"
    fixed_here: >-
      The key, its shape and its names are this file's; values are bound
      per assumption. The assumption files state what each assumption is about; no claim states
      that the values are emitted.

  - name: mathematical_spec_version
    symbol: null
    type: string
    presence: always
    domain: >-
      `protocol-compiler@<version>` of the accepted contract; an artefact may
      not claim a draft version. The string the code emits is the pin recorded
      in `artifact_bindings`.
    locator: "module.yaml version; PRINCIPLES.md section 6; the conventions' artifact_bindings bullet"

  # -------------------------------------------------------------------------
  # The general format's output rows. Each key is emitted only in the general
  # format, and its absence is the basic format; the machine-key count in
  # this section's header is the basic format's and is not restated here.
  # -------------------------------------------------------------------------

  - name: sector_factorisation
    symbol: "the ordered factor list of (DX1)"
    type: "list of (system tag A or Q, party label, sector map)"
    presence: "general format only; absent is one measured factor and no A factor"
    domain: >-
      The factor list is emitted and the product map is not: at most one factor
      tagged A and then first, at least one tagged Q, one block kind across the
      factors, each factor carrying its own ordered block identifiers and
      dimensions. The product sector map, the product outcome alphabet, the
      joint sectors and their orders are derived from this list by
      def:declaration (DX1) and (DX3) and are emitted by no one. This key lives
      inside `declaration` (spec/architecture.md 4.1).
    what_a_consumer_decides_on_it: >-
      Its own reading of meat-core/def:admissible-declaration, per factor
      and per Alice sector; the engine
      forms Kronecker blocks in floating point inside its objective and no
      product datum exists to compare.
    locator: "def:declaration (DX1); def:compile (the general format); def:validator (V1, the general format)"
    fixed_here: "The key name is this file's and the shared format's (foundations/blocks.py); the object is (DX1)'s."

  - name: alice_form
    symbol: "`povm` or `ensemble`"
    type: enum
    presence: "general format only; absent is `povm`"
    domain: >-
      Which slot the emitted declaration filled, passed through from the
      artefact. `ensemble` is emitted in trusted mode only, and then
      `alice_ensemble` is emitted in place of `alice_povm`.
    locator: "def:declaration (DX4); def:compile (the general format)"

  - name: alice_ensemble
    symbol: "{N_x}_{x in X}"
    type: "one block list per x along T"
    presence: "general format, ensemble form only; in place of `alice_povm`"
    domain: >-
      The declared blocks, passed through unchanged, with sum_x N_x^(t) =
      tau_A^(t) decided exactly per Alice sector. The denoted POVM is not a key
      and is not emitted: eq:ensemblepovm is defined, in general irrational and
      formed by no one, and that it is a POVM is thm:sifting-and-key (v).
    locator: "def:declaration (DX4), eq:ensembleform; def:exact (the general format)"

  - name: alice_marginal.blocks
    symbol: "(tau_A^(t))_t"
    type: "block list along T"
    presence: "general format with an A factor; |T| = 1 is the `alice_marginal` row"
    domain: >-
      One block per Alice sector, each Hermitian and positive semidefinite,
      with sum_t tr tau_A^(t) = 1 summed without rounding and, in ensemble
      form, every block non-zero. A singular block is admissible and no rank is
      emitted (meat-core/lem:choi-factor (iv)).
    locator: "def:target (D(ii), the general format); def:validator (V2, the general format)"

  - name: bob_povm.per_factor
    symbol: "({F^f_v_f})_{f in F}"
    type: "one family of block lists per measured factor, each with its alphabet"
    presence: "general format only; one factor is the `bob_povm` row"
    domain: >-
      One family per measured factor against that factor's own sector map,
      each over that factor's ordered alphabet, plus the product rule
      eq:productfamily. No entry of a product is emitted, declared or rounded;
      every exact predicate was decided per factor, in that factor's declared
      order (req:derived-objects).
    what_a_consumer_decides_on_it: >-
      Per factor. That the product family is a POVM on Q, block diagonal for
      the product map, follows for the exact numbers the factors carry
      (def:declaration (DX3)) and is decided by no one.
    locator: "def:declaration (DX3); def:compile (the general format); thm:chain-consumption (ii')"

  - name: transcript
    symbol: "((pi_m, C_m, a_m))_{m = 1..L}"
    type: "ordered message list"
    presence: >-
      general format only; L = 2 is the pair `announce_alice`, `announce_bob`,
      which stays the emitted form of that case
    domain: >-
      Emitted verbatim from the public part, on the emitted alphabets. The
      joint announcement function and its alphabet are not keys: they are
      derived by eq:transcript, as the sifting predicate and the key-live set
      are derived and are not keys in the basic format.
    locator: "def:declaration (DX5); def:compile (the general format); thm:sifting-and-key (iv), (vi)"

  - name: constraint_scope
    symbol: f_k
    type: "one factor label per entry"
    presence: "general format only; one measured factor is the scope of every entry"
    domain: >-
      The label of the measured factor the entry's operator is written against,
      passed through unchanged. The lifted operator is not a key and is formed
      by no one, here or downstream (req:derived-objects).
    locator: "def:declaration (DX6); def:spec (e'); def:compile (the general format)"

  - name: constraint_rhs_tag.party_local
    symbol: "the third tag value"
    type: "enum value beside `homogeneous` and `general`"
    presence: "general format only"
    domain: >-
      Emitted with an entry that arrived carrying that tag beside a real
      scalar, in either source mode. The type of the datum does not separate it
      from `homogeneous`, so the tag is the arriving field and V6 compares the
      two; nothing is inferred (req:tag-reading).
    what_it_changes_downstream: >-
      The consuming engine reads the entry as the party-local line of
      eq:feas-general, which shrinks the feasible set relative to the untagged
      reading and is sound only under the supplier's certificate on the scoped
      factor's channel -- what the `attack_set_license` record attests
      (def:homog; thm:gates (iii')).
    locator: "def:homog (the party-local form); def:eligible (G3)(a); thm:gates (i'), (iii')"

# ---------------------------------------------------------------------------
# not_outputs
#   What this module never emits. Recorded because a reader could take the
#   silence for permission.
# ---------------------------------------------------------------------------
not_outputs:

  - item: acceptance_set
    detail: >-
      The acceptance set is constructed from an honest distribution by the
      statistics module. This module emits the acceptance alphabet Chat and
      the acceptance-statistic map phi, and not the set.
    locator: "def:phi; design.md, 'What the module does not do'"

  - item: rounds
    detail: "A run parameter, not a declaration slot."
    locator: "def:declaration (the slot list of eq:declaration)"

  - item: "a tolerance, in either direction"
    detail: >-
      No `declared_tolerance` row, no window on any predicate, no defect
      functional, and no statement of this contract is made "at" a number.
      A declaration failing any predicate is refused with a reason naming it;
      it is never admitted within a margin (req:no-window).
    locator: "def:exact; the `exact_decisions` convention; parameters below"

  - item: "the sifting predicate sigma and the key-live set Chkey"
    detail: >-
      sigma is a component of the specification's public part and is no slot
      of eq:declaration; Chkey of Eq. eq:chkey is a set derived from it.
      Neither is an emitted key (req:declaration-keys). The derived key map r
      is emitted and is built from them (Eq. eq:rdef).
    locator: "def:declaration; def:spec (d); thm:sifting-and-key; req:declaration-keys"

  - item: "the feasibility candidate, default or supplied"
    detail: >-
      The default candidate is formed in order to be tested and never emitted;
      a supplied witness is an input key, consumed and verified. There is no
      output slot for either (req:feasibility-witness).
    locator: "thm:feasibility (ii); def:validator, V7; the `decide_never_infer` convention"

  - item: "the (C4) composite"
    detail: >-
      The d_Q x d_Q array formed as the argument of the pullback decision is
      formed, decided and discarded: it is no slot of eq:declaration, no output
      row holds it, no check reads it and nothing re-runs (C4)
      (req:operator-form).
    locator: "def:chaincond (C4); def:declaration (operators on Q are block lists); req:operator-form; the `operator_form` convention"

  - item: "any key rate, entropy, bound, objective or key length"
    detail: >-
      Everything generated from the declaration -- the single-round protocol
      channel, the branch maps, the objective and the key length -- belongs to
      the consuming engine. This module states no entropy, no logarithm and no
      bound of any kind.
    locator: "the conventions' log_base bullet; design.md, 'What the module does not do'"

  - item: "an assurance tier or a tier label"
    detail: >-
      Nothing this module emits is itself tiered: a declaration is well-formed
      or it is refused. The tier of a result computed from a declaration is
      decided at run time by the consuming engine, which never reports a
      number under a tier stronger than its checks support and refuses a
      request naming an unknown tier (foundations/req:tiers). No tier ceiling
      is emitted, and the `certified` tier, which a run reaches only by its
      certified evaluation (meat-core/frank-wolfe/req:certified-evaluation),
      appears in no row.
    locator: "spec/architecture.md 2.8; foundations/def:tiers; PRINCIPLES.md section 10"

# ---------------------------------------------------------------------------
# parameters
#   This module has no free numerical parameter, and in particular it
#   declares no numerical tolerance. Every number it emits is a declared datum
#   of the specification, and every predicate it decides is decided exactly
#   on declared data (def:exact). The two rows below are recorded because the
#   emitted declaration is consumed under them and the emitted record must
#   carry what the consumer needs to enforce them.
# ---------------------------------------------------------------------------
parameters:

  free_numerical_parameters: none

  tolerances: >-
    None. Under the number model of spec/architecture.md 2.8 the one declared
    tolerance is the instance's ceiling on the pre-snap defect it may repair
    in what it declares, and it is not a window any module reasons with; a
    module that carried one would be deciding a security predicate more
    loosely than the data supports and than its consumer will.
    Locator: def:exact; the `exact_decisions` convention; req:no-window.

  rows:

    - name: alpha
      symbol: alpha
      domain: "(1, 2)"
      rationale: >-
        Not a parameter of this contract: no claim of this module depends on
        alpha. It is recorded because a key-length-eligible declaration is
        consumed only inside a key-length statement, and the intersection of
        the imports on that path is (1, 2); the structural use of a declaration
        extends to (1, infinity]. Every fact this module imports -- the
        source-replacement, source-map and squashing locators of the claim
        files' `refs` -- is a structural reduction carrying no alpha
        restriction, so the intersection is unchanged by compilation.
      locator: "no claim; the citations of A-LINK (tupkary2026decoy, Lemmas 9.1 and 9.3, Rem. 9.2) and transmitter/rem:import"
      fixed_here: >-
        No claim of this module states this row. It is recorded for the
        consumer's benefit; the claim files state nothing about alpha because
        nothing here depends on it.

    - name: purifier_dim
      symbol: "dim H(Etilde)"
      domain: ">= d_A d_Q"
      rationale: >-
        Not enforced here; the declaration emits d_A and (d_s)_s, which is
        exactly what the consumer needs to enforce it.
      locator: "no claim; def:declaration emits d_A and the sector dimensions"
      fixed_here: >-
        No claim of this module states this row either; same disposition as
        `alpha`.

# ---------------------------------------------------------------------------
# conventions
#   Each is a reading the claim files take; none adds a rule. The link status
#   value `certified_outer` is a link status of reductions' vocabulary
#   (spec/modules/reductions/design.md) and not a tier.
# ---------------------------------------------------------------------------
conventions:

  general_format: "the declaration's general format, with the basic format its degenerate case entry for entry"
  general_format_note: >-
    def:declaration (DX1) to (DX6) defines the general format. Every row of
    this file outside the general-format blocks describes its case of one
    Alice sector, one measured factor, POVM form, two messages neither of
    which reads the other and no party_local entry, which is the basic
    format; the general format reduces to that case key for key, and a
    declaration in the basic format carries no general-format key. The wire
    keys the general format needs are the rows of the two blocks headed
    "The general format's input rows" and "The general format's output rows":
    `sector_factorisation` inside `declaration` (the ordered factor list: per
    factor a system tag A or Q, a party label and that factor's own sector
    map; at most one A factor and it is first; one block kind); `alice_form`
    with the two values `povm` and `ensemble`; `alice_ensemble` (the block
    lists N_x per Alice sector, present exactly in ensemble form, in place of
    `alice_povm`); `alice_marginal`, `alice_povm` and a general right-hand
    side as block lists per Alice sector; the measured family as one family
    per measured factor with its own ordered alphabet (no product array is
    ever a datum; every exact predicate runs per factor); `transcript` (the
    ordered message list: sender, alphabet, table over the sender's readout
    and the earlier messages) in place of `announce_alice` and
    `announce_bob`, which remain the two-message case; per constraint entry a
    `scope` naming a measured factor, and the tag value `party_local` beside
    `homogeneous` and `general`. What is never a key: the POVM an ensemble
    form denotes, a product block, a lifted constraint operator, a rank of
    tau_A (req:derived-objects).
    The compilation map emits the general format (def:spec (a') to (e'),
    def:compile, def:weighted, def:validator, def:chaincond), and the
    V-to-D equivalence of thm:validator-soundness is proved for the general
    readings, with eq:predcount-general.
    Gate (G2) re-decides the five conditions of a pure-form certificate and
    refuses a certificate declared in block form, whatever its blocks. For
    an ensemble presentation it decides (E1) to (E3) and the entry-for-entry
    identity of the declaration's Alice slots with the transposed declared
    blocks; purity of the blocks together with (SR1) and (SR2) are theorems
    of the presentation (transmitter/lem:ensemble-presentation (i), (ii)). At
    one Alice sector no purity requirement is waived: the Psi the
    presentation defines is that one block, of unit trace, hence a rank-one
    projector, so the five conditions hold of it. At two or more Alice
    sectors global purity is not demanded: the defined Psi is a direct sum of
    blocks Psi_t with sum_t tr Psi_t = 1, so Psi^2 != Psi once two blocks are
    non-zero. What the gate rests on there, and why the refusal of a general
    block form rests on scope and not on purity, is
    rem:gate-by-certificate-form. A presentation is admitted only beside an
    ensemble-form declaration, which no basic-format declaration is, so none
    of this admits or refuses a basic-format declaration. Locator:
    def:eligible ("(G2) by form of the certificate"); thm:gates (i'), (ii');
    rem:gate-by-certificate-form.
    Gate (G3)(a) licenses the party_local tag, in either source mode, as a
    type decision on the tag (def:homog; def:eligible, "(G3)(a) with the
    party-local form"; rem:party-local-soundness).

  number_model: "binary64, declared data exactly admissible"
  number_model_note: >-
    The platform's numerical policy is stated once, in spec/architecture.md
    2.8, and this module follows it rather than restating it differently. The
    engine computes in binary64 and carries binary64 on the wire; a declared
    value is its binary64 datum, a dyadic rational, and there is no exact
    object behind it of which the float is an approximation; and declared
    operator data is exactly admissible at every module boundary -- exactly
    Hermitian, exactly positive semidefinite, exactly complete, with every
    completeness sum, in its declared order, rounding nowhere. The
    perturbation that rounding introduces is absorbed where data is declared
    -- by whoever declares it, once, in the open -- and never on data a module
    was handed. No module other than a supplier tracks a floating-point error
    budget, and no result rests on one save a supplier's declared slack on its
    own floating-point evaluation, carried as a named assumption
    (foundations/req:exact-island); this module is not a supplier and tracks
    none.
    One exception is named to avoid a false reading: a closed-form value
    written in a claim -- a 1/2, a 1/sqrt 2 -- denotes the mathematical
    quantity, and a declaration presents a binary64 datum; whether a given
    presentation of such a value is exactly admissible is decided, not
    assumed.
    Locator: def:exact; def:declaration; the BB84 instance's README
    (instances/bb84).

  exact_decisions: true
  exact_decisions_note: >-
    Every predicate this module decides on declared data -- Hermiticity,
    positivity, completeness, a matrix or scalar equality, a trace, and a
    Loewner or scalar ordering -- is decided exactly on the declared dyadic
    numbers, by def:exact, whose five conditions are the platform's shared ones
    (spec/architecture.md 2.9). And so is every predicate it decides on a
    quantity it computes, which is the clause several claims turn on: the
    arithmetic in which a decision is taken is exact wherever the decision is
    taken, and is never inherited from the exactness of the operands.
    Locator: def:exact; req:no-window.
  what_is_formed_in_exact_arithmetic: >-
    Named site by site so that an implementation cannot satisfy the convention
    at five sites and miss the sixth. (1) The trace sum_s tr omega^(s), the
    marginal sum_s tr_{Q_s} omega^(s) and the per-entry constraint legs of
    check V7, on the default candidate and on a supplied witness alike
    (thm:feasibility (ii)). (2) The identities Psi = Psi^dagger, Psi^2 = Psi,
    tr Psi = 1, (SR1) and (SR2) of gate (G2)
    (transmitter/thm:certificate-sufficiency (i), re-decided here). (3) The
    composites Lambda^dagger(F_v) of (C4) and Xi(rho^v_x) of the source
    identity (S3), with the fibre sum of Eq. eq:pullback (def:chaincond). (4)
    The products q_t N_{u|t} of Eq. eq:weighted. (5) The products
    P(f | t(v)) F_v of Eq. eq:weighted-t (def:weighted, the setting-dependent
    form). (6) Condition (S) itself, the one place a binary64 addition is the
    subject rather than the instrument -- it asks of a declared-order sum that
    the binary64 additions forming it be exact, and it too is decided
    exactly, by emulating those additions.
    Locator: def:exact; def:chaincond; def:weighted; thm:feasibility (ii).
  this_module_carries_no_tolerance: >-
    There is no `declared_tolerance` row, no window on any predicate, no defect
    functional, and no statement of this module is made "at" a number.
    Deciding exactly is the stricter of the readings spec/architecture.md 2.8
    licenses -- it admits a subset of what any window would -- so nothing that
    passes here could have failed the policy.

  summation_order: "the emitted index order"
  summation_order_note: >-
    A binary64 sum is a determinate number only once the accumulation order is
    fixed, so the order is part of the datum and this module names it. Every
    completeness sum is accumulated over the family's alphabet in the emitted
    idxm order; every sum over sector blocks in the idxm order of S; every
    trace over the row index of the emitted array in increasing order; the
    public-choice weight sum sum_{t in T_pub} q_t in the order the
    `public_choices` record lists T_pub in -- that alphabet being one idxm
    does not index, so its order is declared with the record and the sum is
    decided here and re-accumulated by no consumer; and, for the
    setting-dependent form, each row sum sum_{f in F} P(f | t) in the
    declared order of the choice alphabet F, and the emitted family's
    completeness sum over the support V_P in its product order (v in the
    supplier's declared order, f in F's, off-support pairs omitted). The
    order travels with the artefact as `label_index_map`, and the requirement
    that each such sum round nowhere is condition (S) of def:exact.
    Locator: def:exact (S); def:compile; def:weighted (both forms);
    req:weight-list; req:stochastic-weights; foundations/req:declared-order.
  which_order_when_a_family_arrives_ordered: >-
    The compilation map takes the supplier's declared order as idxm's
    component on that alphabet, so (S) is decided here in the order the family
    was declared and established in, and re-decided downstream in the same
    one: an ordering a supplier did not choose is never the ground of a
    refusal here. The rule covers a choice-weighted presentation explicitly:
    where one is resolved, the alphabet that indexes the family it produces
    is X on Alice's side, the physical receiver alphabet on a measuring
    party's and, in
    Band A, the emitted V; each of those arrives with a declared order --
    def:spec (a) declares X with its declared order, (C4)'s fibre sum is
    accumulated in the declared order of the physical alphabet, and the last
    link's target POVM arrives ordered -- and the map takes it. The
    conditional family's (S) is then read in the restriction of that order to
    the elements one choice value contributes, a total order whatever the
    `public_choices` record's own listing was, and that listing is the
    compiler's free choice only where no order arrives with the alphabet. So
    no supplier's order is overridden and no presentation is refused for an
    ordering.
    Locator: def:compile ("The binding rule"); def:weighted ("In which order
    (S) is read on a conditional family"); rem:condfamily; row (7) of the
    consumer-agreement record.
  a_sufficient_condition_recorded_but_not_assumed: >-
    If every entry of a family of |J| terms is an integer multiple of 2^-k of
    modulus at most 1, every addition is exact in every order as soon as
    |J| 2^k <= 2^53. This module assumes that of no family: it decides the
    additions it will actually perform. Locator: def:exact.

  operator_form: "sector blocks plus a sector map"
  operator_form_note: >-
    From construction to emission an operator on Q is a list of sector blocks
    together with the map that names them (def:declaration;
    req:operator-form). Sector-block diagonality holds by construction;
    nothing verifies that the off-sector entries are zero, because nothing can
    write them. A consumer's structural check is a sector-map comparison --
    block kind, identifiers, order, dimensions -- and nothing else (check V1);
    positivity and completeness are per block.
  operator_form_scope: >-
    The scope is stated in the sentence that makes the claim, and not left to
    a later one. The claim: on the emitted declaration, and in every decision
    the validator takes on it, no array larger than a single sector block --
    d_s x d_s, or d_A d_s x d_A d_s where Alice is carried -- is assembled.
    That is a bound on block size and deliberately not a prohibition on the
    numbers d_Q and d_A d_Q: where |S| = 1 the one block is the whole of Q, so
    d_{s_0} = d_Q, an object of that size is a block rather than an exception,
    and thm:band-a (i) says exactly this of the same degenerate case. That the
    scope is met is what thm:validator-soundness (iv) states of the validator
    in its own words, every decision there being taken on a matrix of size
    d_A, d_s or d_A d_s for a single s.
    Locator: def:declaration (operators on Q are block lists);
    thm:feasibility (ii); thm:validator-soundness (iv); def:chaincond (C4);
    req:operator-form.
  operator_form_two_paths_outside_the_scope:
    - path: "the chain condition (C4)"
      detail: >-
        Eq. eq:pullback applies Lambda^dagger to F_v, and a link supplies its
        channel as undecomposed data -- no condition of this module requires
        supplied channel data to carry a sector decomposition, (C1) fixing the
        target descriptor of Lambda_L and not the presentation of any link's
        channel -- so on a chain where (C4) is decidable at all, the
        d_Q x d_Q array (+)_s F_v^(s) is formed as the argument of that one
        decision, together with Lambda^dagger(F_v) and the fibre sum
        sum_w F^ph_w on the physical receiver space. It is formed, decided and
        discarded: no slot of eq:declaration, no output row, no check reads it
        and nothing re-runs (C4). Giving (C4) a per-block form would be a new
        condition on supplied channel data, which this module does not impose.
      locator: "def:chaincond (C4); def:declaration; req:operator-form"
      deferred_to: "design.md, 'Extension points' (a per-block (C4))"
    - path: "the source-replacement certificate at gate (G2)"
      detail: >-
        (G2) decides Psi = Psi^dagger, Psi^2 = Psi, tr Psi = 1, (SR1) and (SR2)
        on Psi in L(A A^v), and no condition of this module relates dim A^v to
        any d_s -- the transmitter's (S1) states that no condition of the
        source segment mentions Q, V or V^ph -- so those decisions are taken on
        an array of size d_A dim A^v, which may exceed every block. The
        certificate is a source-side object and is no slot of eq:declaration;
        this convention binds neither it nor the gate that decides it.
      locator: "def:eligible (G2); transmitter/thm:certificate-sufficiency (i); transmitter/def:source-segment (S1)"
      where_it_is_formed: >-
        The array is formed in the transmitter's code
        (certiqs_key.transmitter.certificate) and re-decided here.

  no_snapping: true
  no_snapping_note: >-
    This module never repairs what it was handed. Declared data is snapped by
    whoever declares it, once, with every snap recorded together with the
    pre-snap defect it corrected and the displacement it introduced: the
    instance snaps what it declares about its device, before any module sees
    it, and a producer snaps only what it emits. Neither touches data a module
    was handed (spec/architecture.md 2.8; foundations/req:who-snaps). Every
    consumer downstream, this module included, decides exactly and refuses: a
    declaration that fails a predicate is a modelling error, not noise. An
    emitted matrix entry that this module was handed is the entry it was
    handed.
  no_snapping_what_this_module_constructs: >-
    The two constructed objects are the choice-weighted families:
    N_(u,t) = q_t N_{u|t} of Eq. eq:weighted and, in the setting-dependent
    form, N_(v,f) = P(f | t(v)) F_v of Eq. eq:weighted-t. Both are formed
    exactly on the declared dyadic blocks, and the result is emitted only if
    every entry of it is a binary64 number and the family it forms satisfies
    def:exact; otherwise the compiler refuses with
    `emitted_value_not_representable` or with the predicate that failed. So
    this module never snaps in either of the two senses spec/architecture.md
    2.8 distinguishes: not what it was handed, which no module may repair, and
    not what it emits, which foundations/req:who-snaps licenses only a
    producer that declares a lattice exponent, and which is therefore this
    module's own choice. That choice under foundations/req:exact-emission --
    refusal, and no declared lattice exponent k -- is req:no-lattice-exponent,
    and what it costs is stated at def:weighted.
    Locator: def:weighted ("What this module constructs, and the two emission
    decisions"; "The lattice of the products"); req:weighted-family-emission;
    req:no-lattice-exponent; rem:exactness.

  decide_never_infer: true
  decide_never_infer_note: >-
    A predicate on an emitted object is decided by inspecting that object,
    never by inferring it from a property of the objects it was built from
    (foundations/req:consumer-decides-exactly). Where a lemma establishes an
    identity for the declared values -- that a choice-weighted family is
    complete (lem:weighted (i)), that a candidate satisfies a constraint
    (thm:feasibility (i)) -- the lemma says what the model loses, which is
    nothing; it is not a substitute for the check, and no claim uses it as
    one. Check V7's first branch is not the exception it may read as: at
    CList = {} it passes on the emptiness of CList alone, and D(vii) then
    follows from thm:feasibility (i) with nothing decided on a candidate --
    but that theorem's hypotheses are D(i)-D(iii) on the emitted declaration,
    the marginal slot's own predicates among them and decided at V2, and its
    conclusion is a non-emptiness statement about the set those emitted data
    define, not a predicate on an emitted object. On V7's second and third
    branches every predicate is decided on the candidate itself. The same
    rule is why gate (G2) re-decides the transmitter's five conditions: a
    consumer decides and never infers, so the transmitter's decision is not
    taken on its word (def:eligible (G2)).
    Locator: def:validator, V7; def:eligible (G2); def:homog and
    req:tag-reading (reading the tag off the type is a type decision and is
    what this convention permits); thm:feasibility (ii).

  log_base: 2
  entropy_units: bits
  log_base_note: >-
    This module states no entropy and contains no logarithm; the convention is
    declared and fixed so that the emitted declaration is consumed under one,
    and so that any future numerical statement here inherits it rather than
    choosing. Mixed bases are a defect wherever they appear.

  entropy_variant: sandwiched-renyi
  arrow: up
  entropy_variant_note: >-
    Inherited, not used here: no entropy of any family or arrow occurs in any
    claim of this module.

  test_statistics_model: output_state
  test_statistics_model_note: >-
    Binding, and the strongest convention this module carries. Every per-round
    public choice of known bias is a component of the joint outcome and enters
    as a weight inside the POVM elements -- in the setting-independent form
    q_t N_{u|t} of Eq. eq:weighted, and in the setting-dependent form
    P(f | t(v)) F_v of Eq. eq:weighted-t applied after the chain. A
    `fixed_fraction` model is never emitted; a specification requesting one is
    refused with `fixed_fraction_requested` (req:no-fixed-fraction). The
    choice marginal of the setting-dependent form is state-dependent in
    general -- it is P applied to the setting marginal of the outcome
    statistics, lem:weighted (iv) -- and that is the `output_state` model and
    not a defect: no fraction is factored out, and the state-dependent
    marginal is covered downstream by reductions/ass:tsm (A-TSM), named and
    not assumed here. Lem:weighted (iii), the choice-mass identity Eq.
    eq:choicemass, is asserted for the setting-independent form only.
    Locator: def:weighted; lem:weighted (iii), (iv); thm:choice-encoding (vii);
    the lead-ins of lem:weighted and thm:choice-encoding; ass:coin;
    rem:relabel; req:no-fixed-fraction.

  source_model: derived
  source_model_note: >-
    `trusted` or `untrusted`, derived from whether `alice_marginal` is present,
    never emitted as a second key: a second carrier of the mode would be a
    second source of truth. There is no `source_mode_request` input here
    either, the request being the transmitter's (`retired_input_rows`).
    Locator: def:compile; def:spec (a); transmitter/rem:source-mode (a).

  round_homogeneity: required
  round_homogeneity_note: >-
    One declaration describes every round (A-RHOM, machine key
    `round_homogeneity_declaration`). A specification whose rounds differ is
    refused, not averaged. Where this module spends the assumption is
    thm:gates (iii) and the flag `key_length_eligible`.
    Locator: A-RHOM; thm:gates (iii).

  subsystem_order: "A first"
  subsystem_order_note: >-
    States on A Q with A first; operator pairs written M_x (x) F_v with the
    A-factor first; within each H(Q_s), the declared tensor factors in their
    declared order; sector blocks in the declared total order of S recorded
    by idxm.
    Locator: def:declaration; def:compile.

  povm_index_convention: "a comma is a joint outcome, a bar a conditional POVM"
  povm_index_convention_note: >-
    F_(u,t) with sum_(u,t) F_(u,t) = 1 over the joint alphabet; F_(u|t) with
    sum_u F_(u|t) = 1 for each t; and F_(u,t) = q_t F_(u|t) for a declared
    choice weight q_t. The setting-dependent form adds the pair (v, f) over
    the support: N_(v,f) is a joint outcome of the chain's outcome and the
    choice value, indexed by V_P of Eq. eq:support and not by V x F -- the
    off-support pairs are not outcomes and index nothing.
    Locator: def:weighted (both forms, and Eq. eq:support).

  conjugation_basis: "the declared computational basis of A"
  conjugation_basis_note: >-
    The transpose and complex conjugate of the source-replacement construction
    are taken in the declared computational basis of A, which travels with the
    certificate. This is the one place where a transposed index would be
    silent, so the basis is named rather than assumed. The basis is declared
    with A by transmitter/def:source-spec and the certificate is written
    against it (transmitter/def:srcert).
    Locator: transmitter/def:source-spec; transmitter/def:srcert;
    the worked construction is the instance's (instances/bb84, the conjugation
    example).
  conjugation_basis_fixed_here: >-
    No claim of this module states this convention: the datum, the declared
    computational basis of A, lives in transmitter/def:source-spec, and the
    worked construction is the BB84 instance's. See `fixed_by_this_file`.

  chain_order: "composition order is structure, not a tag"
  chain_order_note: >-
    The chain record is the pair (Ch_src, Ch_rec) and is composed in that
    order, so source maps precede receiver squashing by the shape of the
    record; a source-map link cannot be placed after a squashing link because
    there is no slot in which to write it, and a link presented in the wrong
    segment fails that segment's descriptor rule and is refused -- (C1) for a
    source map, since the transmitted system is not the physical receiver
    space, and the transmitter's (S1) for a squashing map, since Q is not an
    Alice-side descriptor. The warrant for the order is the published one and,
    on the module side, reductions/rem:ordering; this module types the record
    and states neither.
    Locator: def:chaincond (X1); thm:chain-consumption (i); req:chain-record-slots.

  fail_closed: >-
    Every failed check produces a refusal with a machine-readable reason and
    no declaration, or -- at the two gates of (G3) -- an emission with
    `key_length_eligible` = `false`. No default value is ever substituted for
    a missing datum, no entry is silently dropped, no licence is ever
    synthesised, and the source mode is never changed. That sentence also
    covers the data the exact predicates decide: no present datum is silently
    corrected to make a predicate pass (`no_snapping`), and no predicate is
    read more loosely to admit one. The three failures are one failure -- a
    datum that is not there, an entry that is dropped, and a datum that is
    quietly changed all leave the emitted declaration describing something
    other than what was declared. This module fills no slot at all: the one
    filled slot on the path, tau_A = [1] at d_A = 1, is the transmitter's and
    is recorded as filled in its artefact.
    Locator: thm:gates (ii); def:compile; transmitter/rem:da1;
    transmitter/req:marginal-fill;
    req:gate-outcomes; req:validator-refusals; req:chain-refusals;
    req:pass-through.

  artifact_bindings_mathematical_spec_version: >-
    `protocol-compiler@<version>` of the accepted contract; no artefact may
    claim a draft version. The pin the code emits is
    `artifact_bindings.mathematical_spec_version` below.

# ---------------------------------------------------------------------------
# fail_closed
#   The rules, in the order a conforming implementation decides them. Every
#   rule is decided exactly on declared data before anything is emitted; a
#   failure produces a refusal with a machine-readable reason and no
#   declaration, except at the two (G3) rows, which emit with the flag false.
#   `reasons` names the refusal string; `fixed_by` names the claim.
# ---------------------------------------------------------------------------
fail_closed:

  policy: >-
    Every rule below is decided from declared data before anything is
    emitted. No rule is decided at a window, no defect is measured, no
    tolerance appears anywhere and no rule repairs anything. Two rows are
    about numbers this module itself constructs -- the two weighting rows --
    and they too repair nothing they were handed.

  how_a_rule_is_decided: >-
    Stated once for the whole set. An operator identity or inequality is
    decided entry by entry on the declared binary64 numbers read as the dyadic
    rationals they are; a structural condition by comparison of declared
    labels; a summation condition by emulating the binary64 additions in the
    declared order; a type condition by inspecting which of two objects a slot
    holds; a presence condition by testing presence and never truth. Every
    quantity a decision is taken on is formed in exact arithmetic as well
    (`what_is_formed_in_exact_arithmetic`).
    Locator: def:exact; thm:validator-soundness (iv); thm:gates (i).

  rows:

    - rule: conditional_family_admissibility
      order: 1
      checked: >-
        Each conditional family {N_{u|t}}_u of a declared `public_choices`
        record is exactly admissible for the map those families carry, decided
        of each choice value separately and before any product is formed: (H),
        (P), (C) per block; (S) on sum_{u in U_t} N_{u|t}, in the restriction
        to the elements t contributes of the order on the alphabet that indexes
        the weighted family (`inputs.public_choices.order_note`); (T) the
        four-component agreement of the maps the conditional families carry,
        empty on a system carrying no sector decomposition. The failure named
        is the first one.
      reasons: [conditional_family_not_admissible]
      fixed_by: "def:weighted; def:compile; def:exact; rem:condfamily; req:conditional-family-decision"
      why: >-
        A choice-weighted presentation means that the party draws t with
        probability q_t and then measures {N_{u|t}}_u; if a conditional family
        is not a POVM there is no such experiment and the declaration
        describes something the protocol cannot do. The weighted family's own
        conditions do not catch it (ex:condfamily): a deficit under one choice
        value is paid for by a surplus under another, and V3 decides only the
        one combination.
      why_it_is_first: >-
        It runs before the chain row, and that position is the claims' and not
        this file's. Where the presentation is the receiver family, the
        products are what the chain row reads: (C4) is
        Lambda^dagger(F_v) = sum_{w in gamma^-1(v)} F^ph_w with
        F^ph_(u,t) = q_t N_{u|t}, and in Band A (C3) decides (H), (P), (C), (S)
        of the products themselves (thm:band-a (ii)). Placed later, the module
        would form and consume products whose conditional families were
        undecided. The representability decision on those same products
        travels with this row for the setting-independent form, its own row
        below stating the later occurrence as well. Locator:
        req:conditional-family-decision; req:weighted-family-emission;
        def:weighted.
      the_decision_is_on_declared_input: >-
        This row is not about numbers this module constructs, unlike the two
        weighting rows and the two emission rows: it is decided on the numbers
        the specification declared, which is why it runs first and why it is
        not a check of def:validator -- the conditional families are no slot
        of the emitted declaration and V1-V8 read nothing but that
        declaration. thm:validator-soundness (i) and (ii) pair the same checks
        with the same target conditions afterwards (rem:condfamily).

    - rule: chain_interface_conditions
      order: 2
      checked: >-
        The presented chain satisfies def:chaincond: (C1) the descriptor
        matches and the four-component comparison of Lambda_L's target
        descriptor against (Q, Smap); (C2) gamma a tabulated total surjection
        from the physical alphabet onto the emitted one; (C3) the target POVM
        exactly admissible per block; (C4) the pullback identity eq:pullback
        where every link supplies its channel as data; (C5) the slots; and, on
        the source segment, (S1)-(S4) of transmitter/def:source-segment.
      reasons: [chain_interface_condition_failed]
      fixed_by: "def:chaincond; thm:chain-consumption (i); req:chain-refusals"
      why: >-
        This row runs before the compilation map fills eq:declaration because
        the map takes (Q, S, (d_s)_s) and {F_v} from the last link
        (def:compile), so a chain that does not type has nothing to compile
        to. A failure names the condition and the outcome or signal index at
        which the first entry disagreed.
      what_precedes_it: >-
        Two decisions of the compilation map are taken before this row on a
        declared `public_choices` presentation of the receiver: row 1, its
        conditional families, and row 5, its weight list (req:weight-list),
        each with the representability of the products formed from them.
        Those products are the family (C2) and (C4) read and, in Band A, the
        family (C3) decides, so they cannot be consumed here before they are
        decided there. Nothing else of the map precedes this row. Locator:
        req:conditional-family-decision; req:weighted-family-emission;
        def:weighted; rem:condfamily.
      not_decidable_case: >-
        Where some link supplies only a theorem constructor and no channel,
        (C4) is not decidable: the record says NOT CHECKED and names A-LINK.
        Never `passed`. Locator: def:chaincond (C4); A-LINK.
      fixed_here: >-
        The reason string `chain_interface_condition_failed` is this file's
        spelling, which req:chain-refusals binds; req:chain-refusals (i)
        requires that the refusal name the condition, and def:chaincond and
        thm:chain-consumption (i) state the refusal without fixing a string.

    - rule: choice_weighting_index
      order: 3
      checked: >-
        A declared `choice_weighting` is presented as a matrix on
        T x F and is read through the setting map t alone. A weighting
        presented indexed by V, by the device outcome y, or by any component of
        v other than its setting is refused by type.
      reasons: [choice_weight_depends_on_outcome]
      fixed_by: "def:weighted (the setting-dependent form); ass:coin; rem:relabel; thm:choice-encoding (viii); req:setting-only-weighting"
      why: >-
        A value f whose weight varied with the device outcome would be an
        inference from that outcome and not a choice, and the relabelling would
        be applied to a variable the adversary can influence through the state.
        That is what A-COIN excludes. Decided by type and not by measurement.

    - rule: choice_weighting_stochastic
      order: 4
      checked: >-
        Every entry of P is >= 0, decided by sign; and every row sum
        sum_{f in F} P(f | t) is exactly 1, decided in the declared order of F
        and rounding nowhere.
      reasons: [choice_weight_not_stochastic]
      fixed_by: "def:weighted (the setting-dependent form); def:well-formed-spec (vi); req:stochastic-weights"
      why: >-
        A row of non-negative entries that does not sum to one makes Eq.
        eq:forgetf false wherever that setting's F_v is non-zero, the inner sum
        over the support being the row sum. A negative entry never reaches an
        emitted element, the support keeping positive entries only; it is
        refused because A-COIN reads P(. | t) as the distribution f is
        drawn from, and a negative number is no probability. Zero entries are
        admitted and are not a failure: the support Eq. eq:support is what
        they are for, and every emitted element carries a strictly positive
        weight.

    - rule: choice_weight_list_normalized
      order: 5
      checked: >-
        The declared weight list {q_t} of a `public_choices` record sums to
        exactly 1, decided on the declared numbers with the sum accumulated
        in the order the record lists T_pub in, and that accumulation rounds
        at no addition. Each q_t is a positive binary64 number, decided by
        type before the list is (req:binary64-weights).
      reasons: [choice_weights_not_normalized]
      fixed_by: "def:weighted; req:weight-list"
      why: >-
        The emitted family carries q_t inside every element, and a consumer
        reads the choice statistics thm:choice-encoding (ii) proves equal to
        the declared weights. A list that does not sum to exactly 1 declares
        no probability distribution, and one whose binary64 accumulation
        rounds is one the declared-order sum does not reproduce. Deciding the
        equality on the computed binary64 total alone would admit
        fl(0.9) + fl(0.1), whose exact sum is 1 + 2^-55.
      where_it_is_decided: >-
        Where the presentation's family is formed, before the representability
        of its products (the next row): for a receiver presentation with row
        1, before the chain row; for Alice's after it. The refusal precedes
        every other decision on that family.

    - rule: emitted_weighting_representable
      order: 6
      checked: >-
        Every entry of every constructed element -- q_t N_{u|t} of
        Eq. eq:weighted and P(f | t(v)) F_v of Eq. eq:weighted-t -- is a
        binary64 number, the products having been formed exactly on the
        declared dyadic entries. Decided on every product the map forms,
        emitted or not: an iterated presentation's intermediate families, and a
        Bob-side presentation's products at a non-trivial receiver segment,
        which are the physical family (C2) and (C4) read and are never emitted.
        For the setting-independent form the decision is therefore taken with
        row 1, before the chain row; for the setting-dependent form after it,
        which is where this row's `order` places it.
      reasons: [emitted_value_not_representable]
      fixed_by: "def:weighted ('What this module constructs, and the two emission decisions'); rem:condfamily; rem:exactness; req:weighted-family-emission"
      why: >-
        A product of two binary64 numbers need not be one. The module refuses
        rather than snapping its own emission (`no_snapping`;
        req:no-lattice-exponent): of the routes foundations/req:exact-emission
        leaves a producer, it takes refusal. The reason does not cover an entry
        that is binary64 but lies off whatever lattice the instance declared its
        own data on: such an entry is emitted and the five conditions are
        decided on it.

    - rule: emitted_family_exactly_admissible
      order: 7
      checked: >-
        The family about to be emitted satisfies def:exact: (T) the sector map,
        (H) Hermiticity per block, (P) positivity per block, (C) completeness
        per block, and (S) the declared-order completeness sum rounding
        nowhere -- over V, or over the support V_P in its product order where a
        weighting was applied.
      reasons: [bob_povm_summation_rounds, alice_povm_summation_rounds, "the predicate that failed, named"]
      fixed_by: "def:exact; def:weighted; def:validator, V3; thm:choice-encoding (v); req:weighted-family-emission"
      why: >-
        This row is about numbers this module itself emits. It is decided a
        second time on the emitted family, after the weighting has acted, which
        is thm:chain-consumption (ii)'s point: (C3) was decided on the family
        the chain delivered, V3 decides the one that is emitted, and
        lem:weighted (i)-(ii) is what says the weighting cannot break what (C3)
        established.

    - rule: fixed_fraction_model
      order: 8
      checked: "The specification does not request a `fixed_fraction` test-statistics model."
      reasons: [fixed_fraction_requested]
      fixed_by: "the `test_statistics_model` convention; def:weighted; thm:choice-encoding; req:no-fixed-fraction"
      why: >-
        Refused rather than approximated. A state-independent fraction split off
        on either party's side is the one alternative encoding this module does
        not emit, and it is unsound, the terms that carry the weight depending
        on the state (rem:exactness); thm:choice-encoding (ii) proves that the
        encoding it does emit reproduces the declared choice statistics
        exactly, so nothing motivates the unsound alternative.

    - rule: validator_checks
      order: 9
      checked: >-
        V1-V8 all pass on the emitted candidate -- V1 finiteness, totality,
        dimensions, idxm's sector order and the sector-map comparison on each
        declared Q-operator family; V2 the marginal slot; V3 the operators
        block by block with their declared-order sums; V4 the key alphabet; V5
        sifting consistency; V6 constraint typing including the tag; V7
        feasibility, one-sided, three branches; V8 party computability.
      reasons: [sector_map_mismatch, alice_marginal_trace_rounds, alice_povm_summation_rounds, bob_povm_summation_rounds, no_feasibility_witness, "the failed check, named"]
      fixed_by: "def:validator; thm:validator-soundness (i)-(iv); def:eligible (G1); req:validator-refusals"
      why: >-
        This is gate (G1), and it is stated on the checks and not on the
        conditions D(i)-D(viii), because the checks are what a program
        evaluates and the two are not interchangeable at V7
        (thm:validator-soundness (iii)). A failure is a refusal naming the
        check: there is no declaration to emit.
      one_sidedness_is_named: >-
        V7 is one-sided and says so. It passes in exactly three cases -- CList
        empty; the default candidate verifies; a supplied witness verifies --
        and otherwise fails, so it rejects some well-formed declarations.
        Deciding D(vii) in general is a semidefinite feasibility problem this
        module deliberately does not solve (rem:nosearch). Every other check is
        complete for its target condition (thm:validator-soundness (ii)).
        req:witness-refusal-meaning says how such a refusal is reported.

    - rule: certificate_conditions
      order: 10
      checked: >-
        Gate (G2), a consumption gate on the transmitter artefact: if the
        marginal slot is filled and d_A >= 2, the artefact carries the licence
        record `source_replacement_license`, and its five decidable conditions
        are re-decided here on the emitted data -- Psi = Psi^dagger;
        Psi^2 = Psi; tr Psi = 1 with the trace over the row index rounding
        nowhere; (SR1); (SR2) -- each exactly. Clause (SR3) is an attestation
        and is tested for presence only (req:attestation-presence).
      in_the_general_format: >-
        The sentence above is the pure-form reading, which is the only form a
        declaration in the basic format can be accompanied by. Where the
        record is an ensemble presentation, gate (G2) decides (E1) to (E3) of
        transmitter/def:srcert and the entry-for-entry identity of the
        declaration's Alice slots with the transposed declared blocks instead
        of the five; and at two or more Alice sectors the five do not hold of
        the operator that presentation defines -- Psi is a direct sum of blocks
        each a positive multiple of a rank-one projector, so Psi^2 != Psi --
        and global purity is not demanded there. A certificate declared in
        block form whose record is present is refused, whatever its blocks,
        with gate_g2_failed and a detail naming the form (gates.resolve_gates);
        at d_A = 1 no record is emitted in any form
        (transmitter/req:licence-scope), and such an artefact compiles as a
        pure-form one does there. Locator: def:eligible ("(G2) by form of the
        certificate"); thm:gates (i'); rem:gate-by-certificate-form. A reader
        of this row must not infer a globally pure certificate from it.
      reasons: ["the condition that failed, named"]
      fixed_by: "def:eligible (G2); thm:gates (i); transmitter/def:srcert; transmitter/thm:certificate-sufficiency (i); req:gate-outcomes"
      why: >-
        A certificate that does not verify is a defect in the supplied data,
        not a weaker claim; silently demoting it would hide a mis-specified
        source. The scope is every d_A: at d_A = 1 the gate demands no
        certificate, but one supplied there and failing is the same defect in
        the same data. The re-decision is `decide_never_infer`: the
        transmitter's decision is not taken on its word.
      no_condition_is_stated_on_a_vector: >-
        The declared datum is the operator Psi; the unit vector with
        Psi = |psi><psi| exists by Psi^2 = Psi and tr Psi = 1 and is never
        itself declared. An implementation must not accept a vector.
        Locator: def:eligible (G2); transmitter/def:srcert.
      fixed_here: >-
        No refusal string is spelled for the five conditions by any claim of
        this module: the claims require a refusal naming the condition. The
        transmitter's interface spells five (`certificate_not_hermitian`,
        `certificate_not_idempotent`, `certificate_trace_not_one`,
        `certificate_marginal_identity_fails`,
        `certificate_signal_identity_fails`) and this module reuses those five
        rather than spelling a second set for the same five conditions on the
        same data. That reuse is this file's decision; see
        `fixed_by_this_file`.

    - rule: licensed_class
      order: 11
      checked: >-
        Gate (G3)(a), where m >= 1: CList lies in the licensed class of the
        emitted source mode -- a type check on each entry's right-hand-side
        tag, comparing no numbers.
      reasons: []
      outcome: "emission with key_length_eligible = false; NOT a refusal"
      fixed_by: "def:eligible (G3)(a); def:homog; thm:gates (i), (ii); def:gate-outcome-table, row 5; req:gate-outcomes"
      why: >-
        The declaration is well-formed and may be explored numerically; it is
        the key-length claim, not the object, that is unsupported. The
        consuming engine reads a `general` trusted-mode entry as admissible
        input that is never licensed, so the flag and that engine's own gate
        agree.

    - rule: attack_set_license_present
      order: 12
      checked: "Gate (G3)(b), where m >= 1: the `attack_set_license` record is present."
      reasons: []
      outcome: "emission with key_length_eligible = false; NOT a refusal"
      fixed_by: "def:eligible (G3)(b); A-ATK; thm:gates (i), (ii), (iii); def:gate-outcome-table, row 6; req:gate-outcomes; req:attestation-presence"
      why: >-
        The compiler never supplies the missing attestation and never proceeds
        as though it had one. Passing the gate records that an attestation was
        supplied and asserts nothing about attack-set inclusion.

    - rule: physical_family_admissibility
      order: 13
      checked: >-
        The physical receiver family as presented (in the general format each
        measured factor's) is exactly admissible on its physical receiver
        space as one block: presented directly, (H), (P), (C) and (S) in the
        declared order of its alphabet, (T) empty; presented choice-weighted,
        (S) on its own declared-order sum, its conditional families being row
        1's. The failure named is the first one.
      reasons: [physical_family_not_admissible]
      fixed_by: "def:well-formed-spec (iv); def:exact; def:weighted; req:physical-family-decision"
      where_it_is_decided: >-
        After rows 1 and 5 and the representability of the products formed
        from a choice-weighted presentation, and before the chain row (row 2),
        as row 5 is: (C4) reads this family inside the pullback identity, so
        it is decided before it is consumed. The order number is a label;
        this position is the claims'.
      why: >-
        The family is declared data like every other declared family, and
        nothing makes it undecidable: it is a finite list of binary64
        matrices on a finite-dimensional space. Deciding it leaves no route on
        which a user vouches for its exact admissibility. Refusing it is the
        safe direction.

    - rule: band_a_ideal_receiver
      order: 14
      checked: >-
        On the Band-A route, recognised on the record (an empty source
        segment, an emitted sector set that is a singleton, the joint one in
        the general format, and for some measured factor one exact link with
        equal descriptors, a channel that is exactly the identity map where
        one is supplied, and empty slots): exactly one measured factor; a
        physical receiver system of dimension two and, in trusted-source
        mode, a transmitted system of dimension two; a family as presented
        that is projective, every element of every conditional family where
        it is presented choice-weighted. The failure named is the first
        clause that fails.
      reasons: [band_a_outside_ideal_receiver]
      fixed_by: "req:band-a-ideal-receiver; def:banda; ass:ideal; thm:band-a"
      where_it_is_decided: >-
        After row 13, on the family that row decided admissible, and before
        the chain row (row 2). The order number is a label; this position is
        the claims'.
      why: >-
        The route rests on A-IDEAL, an ideal projective qubit measurement,
        and the number of factors, the dimensions and projectivity are
        declared data. Refusing a declaration that contradicts the premise
        the route rests on is the safe direction.

    - rule: band_a_identity_link
      order: 16
      checked: >-
        On a specification on the Band-A route that row 14 does not refuse:
        the one link of its one measured factor supplies its channel as data
        (row 14's recognition has then decided it exactly the identity map),
        and the outcome correspondence of that segment is the identity on
        one alphabet, V = V^ph with gamma(w) = w for every w. The failure
        named is the first clause that fails. With both, (C4) of the chain
        row (row 2) is decidable and reads F_v = F^ph_v entry for entry, and
        a target POVM that is not the presented family is refused there as
        every failure of (C4) is.
      reasons: [band_a_link_not_identity]
      fixed_by: "req:band-a-identity-link; def:banda (b); thm:band-a (ii), (v); req:link-row-provenance (i)"
      where_it_is_decided: >-
        After row 14 and before the chain row (row 2). The order number is a
        label; this position is the claims'.
      why: >-
        The route omits the A-LINK row because thm:band-a (v) proves every
        clause of it, and that proof reads the emitted family as the declared
        one and the outcome correspondence as the identity. A link that only
        names its channel leaves (C4) undecidable, and nothing else ties the
        measurement the key length is computed for to the one declared.
        Refusing is the safe direction.

    - rule: source_identity_at_da1
      order: 15
      checked: >-
        In trusted-source mode at d_A = 1, for every letter in the declared
        order, sigma_x = m_x sum_y sigma_y entry by entry, with m_x the one
        entry of Alice's element as the declaration carries it and sigma_x
        the weighted member of the virtual ensemble the transmitter artefact
        emits. Nothing is compared in untrusted-source mode.
      reasons: [da1_source_identity_failed]
      fixed_by: "req:da1-source-identity; transmitter/def:srcert (SR2); transmitter/rem:da1"
      where_it_is_decided: >-
        Once Alice's family is resolved, rows 5 and 6 having been decided on
        it where it is presented choice-weighted, and before the declaration
        is assembled and validated.
      why: >-
        At d_A = 1 no certificate is demanded and the consuming round model
        takes Alice's letter to be independent of every system the adversary
        holds; a source whose emission depends on the letter, or whose
        letter weights differ from Alice's, contradicts that, and nothing
        else decides it. Refusing it is the safe direction.

  no_row_changes_the_source_mode: >-
    Binding. No row of this table emits in a mode other than the one the
    transmitter artefact's marginal slot carries, drops a constraint entry,
    substitutes a default or synthesises a licence (thm:gates (ii);
    def:gate-outcome-table).

  general_format_rows:
    preamble: >-
      Rules the general format and a non-empty source segment bring. Each is
      decided from declared data before anything is emitted, none is decided
      at a window and none repairs anything. The first three have no subject
      in the basic format; the last two apply wherever a non-empty source
      segment is presented, which the basic format can declare
      (rem:source-segment-rules).
    rows:
      - rule: alice_form_matches_the_mode
        checked: >-
          Alice's measurement slot is declared in a form the emitted source
          mode admits: ensemble form exists in trusted mode only.
        reasons: [ensemble_form_in_untrusted_mode]
        fixed_by: "def:validator (V3, the general format); def:target (D(iii), the general format); req:validator-refusals"
        why: >-
          An ensemble form declares Alice's side through tau_A. With no
          marginal there is nothing for the blocks to sum to and the denoted
          declaration is undefined, so the form is refused rather than read as
          something else. The refusal is the safe direction, and the POVM
          form is always available, at the cost design.md, decision 9,
          states.
      - rule: ensemble_form_conditions
        checked: >-
          Per Alice sector: (H), (P) of every N_x^(t); the identity
          sum_x N_x^(t) = tau_A^(t) entry by entry; that declared-order sum
          rounding nowhere; and tau_A^(t) non-zero.
        reasons: [alice_ensemble_marginal_mismatch, alice_ensemble_sum_rounds, alice_sector_marginal_zero]
        fixed_by: "def:exact (the general format), eq:ensembleform; def:validator (V2, V3, the general format); req:validator-refusals"
        why: >-
          They are the whole of what the form declares, and they are decided on
          the declared numbers. Nothing is decided on the denoted POVM
          eq:ensemblepovm, which is in general irrational and is formed by no
          one; that it is a POVM is thm:sifting-and-key (v). No rank of tau_A
          is computed anywhere, here or in the consuming engine
          (meat-core/lem:choi-factor (iv)).
      - rule: entry_scope_and_tag
        checked: >-
          Every constraint entry's scope names a measured factor of the emitted
          sector map, and an arriving `party_local` tag sits beside a real
          scalar right-hand side.
        reasons: [constraint_scope_not_a_factor]
        fixed_by: "def:validator (V6, the general format); def:homog (how the tag is read); req:tag-reading; req:validator-refusals"
        why: >-
          The tag is the only thing that separates a `party_local` entry from a
          `homogeneous` one, the datum being a real scalar in both, and the
          party-local reading shrinks the feasible set. So the tag is never
          inferred and never taken beside the wrong datum: an entry arriving
          without it is read untagged, which is the weaker and safer reading.
      - rule: licensed_only_beside_a_source_segment
        checked: >-
          Where the presented source segment is non-empty, every entry of the
          emitted constraint list carries a real scalar right-hand side.
        reasons: [general_entry_beside_source_segment]
        fixed_by: "def:chaincond (the general format); reductions/def:chain (whose rule it is); rem:source-segment-rules; req:chain-refusals"
        why: >-
          A Hermitian right-hand side on Alice's retained system does not
          survive precomposition with a source map, which is reductions'
          lemma and its counterexample. The premise is satisfiable: a presented
          chain may carry a non-empty source segment, and this row is then the
          refusal that keeps the pairing out instead of emitting it with
          key_length_eligible false.
      - rule: source_segment_only_in_trusted_mode
        checked: >-
          A presented source segment is non-empty only where the declaration's
          marginal slot holds a tau_A, that is in trusted-source mode; a
          non-empty segment beside the value nomarg is refused.
        reasons: [source_segment_in_untrusted_mode]
        fixed_by: "def:chaincond (a non-empty source segment, the declared source mode); reductions/def:chain (whose rule it is, the mode half); rem:source-segment-rules; req:chain-refusals"
        why: >-
          Nothing licenses a source map in untrusted-source mode.
          reductions/thm:two-sided and reductions/lem:source-transfer, which are
          what make a non-empty segment sound, are stated in trusted-source mode
          alone -- a source map replaces Alice's preparation and only a trusted
          specification has one; an untrusted specification carries no
          certificate and no marginal (transmitter/def:source-spec), its
          Alice-side system is an output of the attack, and A-SRC is asserted in
          trusted mode alone (transmitter/ass:src). A declaration of that shape
          would carry a replaced ensemble with nothing transferring anything to
          it. This row is the mode half of reductions/def:chain's admission
          rule and the row above is the entry half; both are decided here. No
          artefact of this repository can present the pairing, and the rule is
          stated so that it is decided rather than left to provenance: a
          non-empty segment is accepted only inside an artefact of the admitting
          module (transmitter/def:source-segment (A3)) and the one submodule
          that admits a kind declares trusted-source mode.

# ---------------------------------------------------------------------------
# refusal_reasons
#   The machine strings, in classes named by what the strings refuse.
#   `frozen_spellings`: seven strings whose spellings are frozen, which
#   consumers already recognise and the oracle registry pins; they must not
#   drift. `weight_list`: the string of the decision on a declared weight
#   list (req:weight-list). `setting_dependent_weighting`: the two strings of
#   the setting-dependent weighting. `conditional_family`: the string of the
#   decision on each conditional family. `general_format`: the general
#   format's seven. `source_mode_rule`: the string of the source-mode rule.
#   `this_files_own_spelling`: the one string whose spelling this file chose,
#   which req:chain-refusals (i) binds (`fixed_by_this_file`). The strings
#   under `reasons_that_belong_to_another_module` are the transmitter's,
#   named here as the refusals that happen upstream or are carried across the
#   boundary. The oracle interface test reads every class key. Every refusal
#   emits no declaration.
# ---------------------------------------------------------------------------
refusal_reasons:

  frozen_spellings:
    - sector_map_mismatch
    - bob_povm_summation_rounds
    - alice_povm_summation_rounds
    - alice_marginal_trace_rounds
    - emitted_value_not_representable
    - no_feasibility_witness
    - fixed_fraction_requested

  weight_list:
    - choice_weights_not_normalized

  setting_dependent_weighting:
    - choice_weight_depends_on_outcome
    - choice_weight_not_stochastic

  conditional_family:
    - conditional_family_not_admissible

  physical_family:
    - physical_family_not_admissible

  band_a_route:
    - band_a_outside_ideal_receiver
    - band_a_link_not_identity

  source_identity_at_da1:
    - da1_source_identity_failed

  general_format:
    preamble: >-
      Seven strings, each named by a claim of this module and repeated here
      identically. The first five are check-level and therefore gate (G1),
      which is row 1 of the gate outcome table; the sixth is a (G2) failure
      and is row 3; the seventh is decided on the chain. Five refuse objects
      the basic format cannot express. Two refuse objects it can, both in the
      safe direction. (a) `general_entry_beside_source_segment`: a non-empty
      source segment is declarable in the basic format, and a `general` entry
      beside one is refused where the chain is consumed, instead of reaching
      row 5 and being emitted with `key_length_eligible` false, which is
      strictly the more conservative outcome; the case is reachable, and this
      string is the refusal that bites (rem:source-segment-rules). (b)
      `ensemble_presentation_without_ensemble_form`: an ensemble presentation
      is declarable, and a POVM-form consumer refuses it, which is the last
      paragraph of transmitter/def:srcert, so this string names the
      transmitter's own rule rather than a rule of its own.
    strings:
      - ensemble_form_in_untrusted_mode
      - alice_sector_marginal_zero
      - alice_ensemble_marginal_mismatch
      - alice_ensemble_sum_rounds
      - constraint_scope_not_a_factor
      - ensemble_presentation_without_ensemble_form
      - general_entry_beside_source_segment

  source_mode_rule:
    preamble: >-
      One string, named by req:chain-refusals and repeated here identically.
      What it refuses that the format can declare: nothing an artefact of this
      repository presents. The pairing it refuses, a non-empty source segment
      with untrusted-source mode, is expressible (transmitter/def:source-spec
      (b) restricts no mode) but is emitted by no artefact of this repository,
      because a non-empty segment is accepted only inside an artefact of the
      module that admits its links (transmitter/def:source-segment (A3)) and
      the one submodule that admits a kind declares trusted-source mode. It
      exists so that the mode half of reductions/def:chain's admission rule
      is decided rather than resting on that provenance. It is decided on the
      chain, so the gate outcome table has no row for it; the direction is
      strictly conservative and no emitted number moves.
    strings:
      - source_segment_in_untrusted_mode

  this_files_own_spelling:
    - chain_interface_condition_failed

  table:

    - reason: sector_map_mismatch
      condition: >-
        The map carried by a declared Q-operator family -- the Bob family, or a
        constraint entry declared in the specification or transported by a link
        -- disagrees with the emitted Smap in block kind, in the list of block
        identifiers, in their order or in their dimensions. The refusal names
        the first position at which the lists differ.
      fixed_by: "def:validator, V1; req:validator-refusals"
      scope_note: >-
        In the basic format the families compared are exactly the Q-operator
        families of eq:declaration and no wider list. The chain's last target
        descriptor is compared at (C1), a supplied witness's map at V7 branch
        (c), and the physical family has no map to compare at a non-trivial
        chain.
      scope_in_the_general_format: >-
        In the general format the scope is wider, by two additions. (1) The one
        block kind of the emitted factor list: a disagreement between two
        factors is this refusal, naming the first factor at which the kind
        differs (def:validator, V1; req:validator-refusals (i)). (2) The
        maps of Alice's declared data against the map of the factor tagged A --
        the map carried by tau_A, by each operator of her measurement slot
        (M_x, or N_x in ensemble form) and by each `general` Theta_k -- in the
        same four components (def:validator, V1, the general format). The
        per-factor families and the entries' operators are compared against the
        map of their own factor rather than against one emitted Smap, the
        product map being derived and no datum. The three exclusions above
        stand: the chain's per-factor target descriptors at (C1), a supplied
        witness's map at V7 branch (c), and the physical families, one per
        factor.
      what_still_rests_on_the_narrower_scope: >-
        def:weighted's distinct-reason argument, and the
        `conditional_family_not_admissible` row below, which say that a
        conditional family is none of the objects this string is about. That
        argument holds in the general format as well, and def:weighted's
        general-format paragraph says so in the claim: a conditional family is
        no slot of eq:declaration, no factor of the factor list and not Alice's
        declared data but the presentation the weighting consumes, so its index
        (u, t) is still no emitted index.

    - reason: alice_marginal_trace_rounds
      condition: >-
        tr tau_A = 1 holds only as a computed sum: the trace, accumulated over
        the row index, does not round nowhere.
      fixed_by: "def:validator, V2; def:exact (S); req:validator-refusals"
      also_spelled_by: "spec/modules/transmitter/interface.yaml, which decides the same predicate on the same matrix first"

    - reason: alice_povm_summation_rounds
      condition: >-
        The completeness sum sum_x M_x, accumulated in the emitted index order,
        does not round nowhere.
      fixed_by: "def:validator, V3; def:exact (S); req:validator-refusals"
      also_spelled_by: "spec/modules/transmitter/interface.yaml"

    - reason: bob_povm_summation_rounds
      condition: >-
        For some sector, the completeness sum of the emitted Bob family over
        its alphabet -- V, or the support V_P in its product order where a
        weighting was applied -- does not round nowhere. The refusal carries
        the sector and the outcome index at which the first inexact addition
        occurred.
      fixed_by: "def:validator, V3; def:exact (S); def:weighted (the emitted family's own sum); req:validator-refusals"

    - reason: emitted_value_not_representable
      condition: >-
        The compiler's own exact construction of a choice-weighted element does
        not land on a binary64 number: some entry of some q_t N_{u|t}, or, in
        the setting-dependent form, of some P(f | t(v)) F_v, is not a binary64
        number. The subject is every product the map forms, emitted or not --
        an iterated presentation's intermediate families, and a Bob-side
        presentation's products at a non-trivial segment, which the chain reads
        and which are never emitted. It does not cover an entry that is
        binary64 but off the instance's declared lattice.
      fixed_by: "def:weighted ('What this module constructs, and the two emission decisions', 'The lattice of the products'); req:weighted-family-emission"

    - reason: no_feasibility_witness
      condition: >-
        Check V7 fails: CList is non-empty, the default candidate does not
        verify, and either no witness was supplied or the supplied one does not
        verify. Where a witness was supplied and rejected on its map, the
        refusal names the first position at which the two lists differ.
      fixed_by: "def:validator, V7; thm:feasibility (ii); thm:validator-soundness (iii); req:feasibility-witness; req:validator-refusals"

    - reason: fixed_fraction_requested
      condition: "The specification requests a `fixed_fraction` test-statistics model."
      fixed_by: "the `test_statistics_model` convention; thm:choice-encoding; req:no-fixed-fraction"

    - reason: choice_weights_not_normalized
      condition: >-
        A declared weight list {q_t} of the setting-independent form is not
        normalized: its exact sum is not 1, or its accumulation in the order
        the `public_choices` record lists T_pub in rounds at some addition.
        The refusal names the party, the declared order, the exact sum and
        the first addition that rounds. One reason covers both legs, which
        separate in both directions: fl(0.9) + fl(0.1) has exact sum
        1 + 2^-55 and rounds to exactly 1, while 2^-54, 1/2, 1/2 - 2^-54 sums
        to exactly 1 through an addition that rounds.
      fixed_by: "req:weight-list; def:weighted ('The reading of each declared condition')"
      remedy: >-
        Declare weights whose sum is exactly 1. An instance entry point
        prepares ordinary decimal weights onto such a list by the shared
        snapping rule and records the displacement (req:weight-preparation;
        foundations/def:snap).

    - reason: choice_weight_depends_on_outcome
      condition: >-
        A Bob-side choice weighting is presented indexed by V, by the device
        outcome, or by any component of v other than its setting. Refused by
        type, nothing being measured.
      fixed_by: "def:weighted (the setting-dependent form); req:setting-only-weighting; ass:coin; rem:relabel; thm:choice-encoding (viii)"

    - reason: choice_weight_not_stochastic
      condition: >-
        An entry of P is negative, or a row of P has a declared-order sum that
        is not exactly 1, or that sum rounds.
      fixed_by: "def:weighted (the setting-dependent form); req:stochastic-weights; def:well-formed-spec (vi)"

    - reason: conditional_family_not_admissible
      condition: >-
        A conditional family {N_{u|t}}_u of a declared `public_choices` record
        is not exactly admissible for the map the families of that presentation
        carry: (H), (P) or (C) fails on a block, or its completeness sum
        sum_{u in U_t} N_{u|t}, accumulated in the restriction to t's elements
        of the order on the alphabet that indexes the weighted family, does not
        round nowhere, or (T) fails -- the maps the conditional families carry
        disagreeing among themselves, or with the map the weighted family is a
        block list against, in block kind, in identifiers, in their order or in
        their dimensions. The refusal names the party and the first failing
        (choice value, predicate, block) with the index at which it failed;
        for (S), the index of the first inexact addition. One failure is named,
        not a list.
      fixed_by: "def:weighted ('The reading of each declared condition'); def:compile; def:exact; rem:condfamily; ex:condfamily; req:conditional-family-decision"
      why_it_is_none_of_the_emitted_familys: >-
        Of the emitted family, V3 decides (H), (P), (C) and (S) and V1 compares
        the map, which is (T). A conditional family is no slot of
        eq:declaration and its index (u, t) is no emitted index, so
        `alice_povm_summation_rounds` or `bob_povm_summation_rounds` would name
        an object the failure is not in; and (T) here is likewise not
        `sector_map_mismatch`, whose scope note keeps that string for the
        Q-operator families of eq:declaration and no wider list.
      what_it_catches: >-
        The weighted family's five conditions do not imply the conditional
        families' (ex:condfamily), so without this decision a presentation
        whose per-choice measurement is not a measurement would pass every
        other decision. What such a declaration implements is a round-type
        probability other than the one the `public_choices` record declares
        and A-COIN reads; no slot of the declaration carries the declared
        weight, so the mismatch is between the specification and the
        declaration built from it and is invisible downstream. The refusal is
        the safe direction.

    - reason: physical_family_not_admissible
      condition: >-
        The physical receiver family as presented is not exactly admissible
        on its physical receiver space read as one block: (H), (P) or (C)
        fails, or its completeness sum, accumulated in the declared order of
        its alphabet, rounds at some addition; for a choice-weighted
        presentation, its own declared-order sum rounds. The refusal names the
        measured factor and the first failing predicate with the index at
        which it failed; for (S), the index of the first inexact addition.
      fixed_by: "def:well-formed-spec (iv); def:exact; req:physical-family-decision"
      why_it_is_none_of_the_emitted_familys: >-
        At a non-trivial receiver segment the physical family is no slot of
        eq:declaration and its alphabet is no emitted alphabet, so
        `bob_povm_summation_rounds` would name an object the failure is not
        in. In Band A the family is the emitted one and check V3's reasons
        apply to it as well.

    - reason: band_a_outside_ideal_receiver
      condition: >-
        A specification on the Band-A route, recognised on the record,
        declares more than one measured factor, a physical receiver system of
        dimension other than two or, in trusted-source mode, a transmitted
        system of dimension other than two, or a physical receiver family as
        presented that is not projective (for a choice-weighted presentation,
        a conditional family element N with N N != N), decided exactly. The
        refusal names the first failing clause and, for projectivity, the
        choice value where there is one and the outcome index of the first
        element that is not a projector.
      fixed_by: "req:band-a-ideal-receiver"
      why: >-
        The route's residual physical content is A-IDEAL, an ideal projective
        qubit measurement (thm:band-a (iv)). Without the refusal a declaration
        whose own numbers contradict that premise would be emitted resting on
        it.

    - reason: band_a_link_not_identity
      condition: >-
        A specification on the Band-A route, recognised on the record and not
        refused with `band_a_outside_ideal_receiver`, whose one receiver link
        supplies no channel as data, or whose outcome correspondence is not
        the identity on one alphabet (V = V^ph and gamma(w) = w for every w).
        The refusal names the first failing clause.
      fixed_by: "req:band-a-identity-link"
      why: >-
        On the route the ledger omits A-LINK because thm:band-a (v) proves
        it, and that proof reads the emitted family as the declared one
        (def:banda (b)). Without the refusal a link that names its channel
        would leave (C4) undecided, and the key length could be computed for
        a measurement other than the declared one with no ledger row
        covering the difference.

    - reason: da1_source_identity_failed
      condition: >-
        In trusted-source mode at d_A = 1, the identity sigma_x = m_x sum_y
        sigma_y fails at some letter, decided exactly entry by entry: Alice's
        letter weights differ from the source's, or a letter of positive
        weight is sent as a state other than the common one. The refusal
        names the first such letter in the declared order and the first
        entry at which the two sides differ.
      fixed_by: "req:da1-source-identity; transmitter/def:srcert (SR2)"
      why: >-
        It is (SR2) read at d_A = 1, where no certificate is demanded and gate
        (G2) is not engaged, so nothing else decides it. The consuming round
        model treats Alice's letter as local randomness independent of what
        the source sends, which holds only under this identity.

    - reason: chain_interface_condition_failed
      condition: >-
        A presented chain fails one of def:chaincond's conditions -- (C1)-(C5)
        on the receiver segment, (S1)-(S4) of transmitter/def:source-segment on
        the source segment. The refusal names the condition and the outcome or
        signal index at which the first entry disagreed.
      fixed_by: "def:chaincond (the conditions); thm:chain-consumption (i); req:chain-refusals (the string and its naming requirement)"
      fixed_here: >-
        The spelling is this file's, and req:chain-refusals binds it; the
        claims require that the refusal name the failed condition, which this
        string plus the named condition does.

    # -----------------------------------------------------------------------
    # The general format's rows, and the source-mode rule's. Each row's
    # `condition` is the claim's own condition.
    # -----------------------------------------------------------------------

    - reason: ensemble_form_in_untrusted_mode
      condition: >-
        Alice's measurement slot is declared in ensemble form while the
        marginal slot holds nomarg. Refused by type -- a decision on which of
        two slots is filled, nothing measured.
      fixed_by: "def:validator (V3, the general format); def:target (D(iii), the general format); req:validator-refusals"
      gate_outcome_row: "row 1 ((G1): a check failed), a refusal naming the check"

    - reason: alice_sector_marginal_zero
      condition: >-
        Alice's measurement slot is in ensemble form and some declared block
        tau_A^(t) is the zero block. A comparison of declared entries with the
        datum 0; the refusal names the sector.
      fixed_by: "def:validator (V2, the general format); def:exact (the general format), eq:ensembleform; req:validator-refusals"
      why_the_condition_exists: >-
        It is the one exact side condition the ensemble form adds. On a zero
        block the denoted operators of eq:ensemblepovm have no defining
        expression (tr tau_A^(t) = 0 in the weight), so the form would denote
        nothing there; it is not a rank condition and no rank is computed
        (meat-core/lem:choi-factor (iv)).
      gate_outcome_row: "row 1"

    - reason: alice_ensemble_marginal_mismatch
      condition: >-
        For some Alice sector the declared-order sum sum_x N_x^(t) is not the
        declared block tau_A^(t), entry by entry. The refusal names the sector
        and the first differing entry.
      fixed_by: "def:validator (V3, the general format); def:exact (the general format), eq:ensembleform; req:validator-refusals"
      why_it_is_not_alice_povm_summation_rounds: >-
        That string names an inexact addition in a completeness sum. This one
        names a sum that is exact and is not tau_A. The two are different
        failures of different conditions and the ensemble form has both, which
        is why it has two strings where the POVM form has one -- the POVM
        form's (C) is an identity against the identity matrix, decided by type
        against no declared datum.
      gate_outcome_row: "row 1"

    - reason: alice_ensemble_sum_rounds
      condition: >-
        For some Alice sector the declared-order sum sum_x N_x^(t), in the
        emitted index order of X, does not round nowhere. The refusal carries
        the sector and the index of the first inexact addition.
      fixed_by: "def:validator (V3, the general format); def:exact (the general format), condition (S); req:validator-refusals"
      gate_outcome_row: "row 1"

    - reason: constraint_scope_not_a_factor
      condition: >-
        A constraint entry's scope does not name a measured factor of the
        emitted sector map, or a `party_local` tag arrives beside a
        right-hand-side slot that does not hold a real scalar. A comparison of
        a label against the factor list and of a tag against a type; the
        refusal names the entry.
      fixed_by: "def:validator (V6, the general format); def:homog (how the tag is read); def:target (D(vi), the general format); req:tag-reading; req:validator-refusals"
      gate_outcome_row: "row 1"

    - reason: ensemble_presentation_without_ensemble_form
      condition: >-
        The transmitter artefact carries a source-replacement certificate
        declared as an ensemble presentation while the emitted declaration is
        in POVM form. Refused at gate (G2): nothing would tie the declared
        {M_x} to the presentation, so no condition of that form has a subject.
      fixed_by: "def:eligible ((G2) by form of the certificate); thm:gates (i'), (ii'); req:gate-outcomes"
      gate_outcome_row: >-
        row 3 ((G2): a certificate present and failing a condition of its
        form), a refusal naming the condition. The gate outcome table has no
        row of its own for it (thm:gates (ii')).

    - reason: general_entry_beside_source_segment
      condition: >-
        A non-empty source segment is presented and some entry of the emitted
        constraint list is declared `general`. A type check on the tag; the
        refusal names the entry.
      fixed_by: "def:chaincond (the general format, the licensed-only rule); rem:source-segment-rules; req:chain-refusals"
      whose_rule_it_is: >-
        It is the consuming side of reductions/def:chain's admission paragraph,
        whose reason is that module's ordering lemma and its counterexample.
        This module decides the type of the entry and states no reason of its
        own. Its premise is satisfiable: a presented chain may carry a
        non-empty source segment, so this string refuses a case that can
        arise, which is the conservative outcome the claim describes.
      gate_outcome_row: >-
        none: it is decided on the chain when the chain is consumed, like
        `chain_interface_condition_failed`, and produces a refusal and no
        declaration.

    - reason: source_segment_in_untrusted_mode
      condition: >-
        A non-empty source segment is presented while the declaration's marginal
        slot holds nomarg, that is in untrusted-source mode. The refusal names
        the segment's length and the mode.
      fixed_by: "def:chaincond (a non-empty source segment, the declared source mode); rem:source-segment-rules; req:chain-refusals"
      whose_rule_it_is: >-
        It is the mode half of reductions/def:chain's admission paragraph, which
        admits a non-empty source segment beside a constraint list only where
        every entry is licensed and only in trusted-source mode, that module's
        thm:two-sided being stated there alone. The row above is the entry half.
        This module decides both halves on declared data -- one tag per entry,
        and one slot for the mode -- and states neither rule's reason.
      what_it_refuses_that_the_format_can_declare: >-
        Nothing an artefact of this repository presents. A specification may
        be declared by a source model in either mode (transmitter/def:source-spec
        (b) restricts no mode), so the pairing is expressible; but a non-empty
        segment is accepted only inside an artefact of the module that admits
        its links (transmitter/def:source-segment (A3)) and the one submodule
        that admits a kind declares trusted-source mode
        (transmitter/decoy/cor:emitted-decoy (i)), so no artefact of this
        repository can present it. The string exists so that the rule is
        decided rather than resting on that provenance.
      gate_outcome_row: >-
        none, and none is needed: it is decided where the chain is consumed,
        before a declaration exists, so it produces a refusal and no
        declaration -- the outcome `chain_interface_condition_failed` and
        `general_entry_beside_source_segment` already have. The gate outcome
        table has no row for it.

  reasons_that_belong_to_another_module:

    - reason: trusted_mode_without_certificate
      owner: transmitter
      why_it_is_named_here: >-
        It is the refusal that makes rows 2 and 4 of the gate outcome table
        unreachable. The transmitter refuses a trusted-mode request at
        d_A >= 2 that carries no certificate before any artefact exists, so no
        artefact this module receives satisfies those rows' premise
        (thm:gates (ii); req:gate-outcomes). This module never emits the string.
      coupling: >-
        The refusal is a row of the transmitter interface's `refusal_reasons`
        and is stated by transmitter/req:licence-scope, which req:gate-outcomes
        uses, so `python -m harness.check_claims --dependents
        transmitter/req:licence-scope` lists req:gate-outcomes and a change to
        that requirement puts it in the re-review scope. That no protocol
        specification meets the premise of rows 2 and 4 is thm:gates (ii),
        from def:spec (a), and rests on no transmitter requirement. The
        transmitter's row is not a claim; it carries the back-pointer
        (`refusal_reasons`, `trusted_mode_without_certificate`,
        `rests_on_this_row`).
      locator: "def:gate-outcome-table; req:gate-outcomes; transmitter/req:licence-scope; spec/modules/transmitter/interface.yaml"

    - reason: "the transmitter's five certificate reasons"
      owner: transmitter
      strings: [certificate_not_hermitian, certificate_not_idempotent, certificate_trace_not_one, certificate_marginal_identity_fails, certificate_signal_identity_fails]
      why_they_are_named_here: >-
        Gate (G2) re-decides the same five conditions on the same data and
        refuses naming the condition; this file reuses the transmitter's five
        strings rather than spelling a second set. See the
        `certificate_conditions` row of `fail_closed`.
      locator: "def:eligible (G2); spec/modules/transmitter/interface.yaml"

    - reason: "the transmitter's source-link admission reasons"
      owner: transmitter
      strings: [source_link_kind_not_admitted, link_kind_deferred, source_link_entry_present, source_link_family_excludes_its_descriptor, source_link_not_in_registry, source_link_assumption_not_in_ledger, source_segment_not_from_admitting_module]
      why_they_are_named_here: >-
        A presented non-empty source segment is checked by the transmitter's
        admitted-link decider. The compiler carries its refusal record across
        the boundary by the same string and does not re-spell or re-decide the
        supplier-owned condition. The compiler also refuses, with
        `source_segment_not_from_admitting_module`, a chain record whose
        source segment differs entry for entry from the one the artefact
        carries, including where exactly one of the two is empty: the
        certificate is written against the virtual ensemble the chain's
        segment starts from (def:spec (a), (c)), so the two must be one
        segment.
      locator: "def:chaincond (A1)--(A3); def:spec (a), (c); transmitter/def:source-segment"

# ---------------------------------------------------------------------------
# gate_outcome_table
#   The machine form of def:gate-outcome-table, row for row and in its order. Every
#   row refuses or emits with the flag false; no row substitutes a default
#   value, drops an entry, changes the source mode or synthesises an
#   attestation. KLE abbreviates
#   `key_length_eligible`. Rows 2 and 4 are unreachable through the
#   transmitter artefact (thm:gates (ii); req:gate-outcomes).
# ---------------------------------------------------------------------------
gate_outcome_table:

  locator: "def:gate-outcome-table; thm:gates (ii); def:eligible; req:gate-outcomes"

  permitted_outcomes: [refusal, "emission with KLE = false"]
  permitted_outcomes_note: >-
    Two, not three (thm:gates (ii)): refusal, or emission with
    `key_length_eligible` = `false`. Which of the two a failure produces is
    fixed by the table and is not an implementer's choice; where the failures
    of one declaration meet the premises of a refusal row and of an emission
    row both, the outcome is the refusal. No row emits in a weaker source mode
    (rem:notfallback).

  rows:

    - row: 1
      what_failed: "(G1): any of V1-V8"
      outcome: "refusal, naming the check"
      reachable: true
      why: >-
        There is no declaration to emit: the candidate is not well-formed, or
        -- at V7 -- has not been shown to be. Nothing downstream may consume
        it.

    - row: 2
      what_failed: "(G2): trusted mode at d_A >= 2, certificate ABSENT, and m = 0"
      outcome: "unreachable through the transmitter artefact; refused there with trusted_mode_without_certificate"
      reachable: false
      why: >-
        The transmitter refuses a trusted-mode request without a certificate
        before an artefact exists, so no artefact this module receives
        satisfies the premise. prop:conservative stands as a statement about
        the feasible sets and is no rule of emission (rem:notfallback).
      locator: "def:gate-outcome-table, row 2; req:gate-outcomes; thm:gates (ii); prop:conservative; rem:notfallback"

    - row: 3
      what_failed: >-
        (G2): trusted mode AT ANY d_A, certificate PRESENT but one of the five
        conditions of def:eligible (G2) fails -- Psi Hermitian, Psi^2 = Psi,
        tr Psi = 1 rounding nowhere, (SR1), (SR2)
      outcome: "refusal, naming the condition"
      reachable: true
      reachable_note: >-
        Reachable, but not through an artefact the transmitter emits: that
        module refuses a certificate that fails a condition of its form at
        every d_A before an artefact exists
        (transmitter/req:failing-certificate), so this row is driven by a
        hand-built artefact and by the golden gate enumeration, and not by
        rows 2 and 4's route. The branch stays either way, because what it
        records is the consumer's re-decision of data it was handed
        (def:eligible (G2), the `decide_never_infer` convention): a consumer
        decides and never infers, so it may not read the supplier's verdict in
        place of the conditions, and a supplier that changes is not a reason
        for this module to stop deciding.
      why: >-
        A certificate that does not verify is a defect in the supplied data,
        not a weaker claim; silently demoting it would hide a mis-specified
        source. The scope is every d_A: at d_A = 1 the gate demands no
        certificate (transmitter/rem:da1), but one supplied there and failing
        is the same defect in the same data, so this is the row def:compile's
        certificate clause points at.

    - row: 4
      what_failed: "(G2): trusted mode at d_A >= 2, certificate absent, and m >= 1"
      outcome: "unreachable through the transmitter artefact; refused there with trusted_mode_without_certificate"
      reachable: false
      why: >-
        As row 2. Were such an artefact to arrive, dropping the marginal would
        still not be admissible, although prop:conservative gives the set
        inclusion at every m: a `homogeneous` entry carries its own c_k, but
        the supplier's constraint-soundness attestation (A-LINK) was made
        against c_k tau_A and has no referent without a certificate, and
        re-reading another module's attestation is not something this module
        does (rem:notfallback, "Where the compiler uses it").

    - row: 5
      what_failed: "(G3)(a): CList not in the licensed class -- SOME ENTRY DECLARED `general` IN TRUSTED-SOURCE MODE"
      outcome: "emission with KLE = false"
      reachable: true
      why: >-
        The declaration is well-formed and may be explored numerically; it is
        the key-length claim, not the object, that is unsupported. The
        consuming engine reads such an entry as admissible input that is never
        licensed, so the flag and that engine's own gate agree.

    - row: 6
      what_failed: "(G3)(b): `attack_set_license` absent"
      outcome: "emission with KLE = false"
      reachable: true
      why: >-
        As the row above. The compiler never supplies the missing attestation
        and never proceeds as though it had one.

  degeneration_record: >-
    A gate that passes vacuously is recorded as such in `gate_report`, with the
    degeneration record of rem:degenerate: gate (G3)(a) in untrusted-source
    mode, at any d_A (req:vacuous-gate-report). At d_A = 1 this module reads
    (G3)(a) as a type check and not as vacuous (rem:degenerate), and gate (G2)
    demands no licence record (transmitter/rem:da1). Locator: rem:degenerate;
    req:vacuous-gate-report; transmitter/rem:da1.

# ---------------------------------------------------------------------------
# consumer_agreement
#   The seven places where this module's contract and the consuming engine's
#   must agree.
#
#   Why they are a record here and not claims: the conditions this module
#   compiles to are stated as this module's own definitions (def:declaration,
#   def:exact, def:target, def:feasible, rem:wellposed, def:homog, def:phi),
#   because a proof may only lean on a claim it `uses`, and this module cannot
#   use meat-core, which depends on it. meat-core's def:declaration,
#   def:feasible and def:homog use and cite this module's definitions of the
#   same names, so rows (1), (2), (4) and (5) rest on one definition read from
#   both sides. The meat-core locators below are named in text and carry no
#   edge from this module; meat-core's interface records the same seven rows
#   from its side (its `consumer_agreement`).
# ---------------------------------------------------------------------------
consumer_agreement:

  consumer: meat-core
  consumer_contract: "spec/modules/meat-core/contract.tex"
  locator: "def:declaration; rem:engine-admission; meat-core/def:declaration, def:feasible and def:homog, which use this module's definitions of the same names; design.md, 'The declaration and its consumer'"

  rows:

    - point: 1
      agreement: >-
        The engine reads eq:declaration slot by slot under the machine keys of
        the outputs table above, with every Q-operator a block list against one
        sector map, and compares that map in the three components its own text
        names -- the block kind, the block identifiers and their ordering.
      meat_core_locator: "meat-core/def:declaration, which reads def:declaration (operators on Q are block lists); its `sector_block_kind` input row; spec/architecture.md 2.9 (the sector-map comparison)"
      this_module: "def:declaration; def:exact (T); req:declaration-keys; the `sector_index_set`, `sector_dims` and `sector_block_kind` output rows"
      note: >-
        That engine's interface reads all three under this module's names
        (its `sector_index_set`, `sector_dims` and `sector_block_kind` input
        rows); `sector_block_kind` is emitted so that the block-kind component
        of the comparison that text requires has a datum to run on.

    - point: 2
      agreement: >-
        The engine generates its single-round protocol channel, branch maps and
        test-statistics map from those slots.
      meat_core_locator: "meat-core/def:maps; meat-core/thm:protocol-channel; meat-core/lem:branch-maps"
      this_module: "def:declaration; def:compile (every slot a stated function of the specification)"

    - point: 3
      agreement: >-
        The engine requires D(i)-D(viii) as its well-formedness assumption and
        decides every operator predicate of it exactly, at zero defect and with
        every declared sum verified to round nowhere -- which is def:exact, and
        is what this module decides on the same data before emitting it.
      meat_core_locator: "meat-core/def:admissible-declaration (i)-(viii); meat-core/def:declaration (the exact-admissibility paragraph); meat-core/req:exact-admission"
      this_module: "def:target D(i)-D(viii); def:exact; def:validator; thm:validator-soundness (i), (ii); rem:engine-admission"
      at_which_reading: >-
        Both modules decide the five conditions of def:exact exactly and at no
        tolerance: that engine takes no tolerance on declared data and admits a
        declaration only if it is exactly admissible
        (meat-core/req:exact-admission), so the two rules coincide on those
        five conditions (rem:engine-admission).
      what_it_discharges: >-
        The engine's well-formedness assumption includes Feas != {}, and that
        is the same set as this module's (meat-core/def:feasible is
        def:feasible) -- so D(vii) and that assumption are one statement, and
        a declaration this module emits establishes it. On V7's branch (a)
        thm:feasibility (i) exhibits a member outright; on branch (b) the
        default candidate's membership is decided exactly, the candidate being
        formed and never emitted; on branch (c) a supplied witness's membership
        is decided exactly on declared dyadic data.
      two_conditions_are_deliberately_stronger_here: >-
        D(iii)'s Hermiticity clause (the engine leaves Hermiticity of each
        hat O_k to the typing of the tuple; D(iii) restates it block by block
        so that check V3 has a target condition to be complete for) and D(i)'s
        last clause (that idxm's restriction to S be the sector map's own total
        order, which has no counterpart in that engine's assumption). Both
        differences are in the safe direction -- a declaration well-formed here
        is well-formed there, never the reverse -- and both are disclosed
        rather than left for a reader to notice.
        Locator: def:target D(i), D(iii); def:declaration; rem:engine-admission.

    - point: 4
      agreement: >-
        The engine minimises over the set Eq. eq:feas, which carries no
        parameter and is the same set this module denotes by Feas -- one
        symbol, one referent, in both contracts.
      meat_core_locator: "meat-core/def:feasible (eq:feas, eq:feas-modes), which is def:feasible read as a set of operators; meat-core/def:admissible-declaration (vii)"
      this_module: "def:feasible; rem:wellposed; rem:block-restriction (the block restriction this module states and meat-core/thm:reduction, step 1, proves)"

    - point: 5
      agreement: >-
        The engine admits a non-empty CList into a key-length statement only
        under def:homog -- a type check on the tag of each entry, comparing no
        numbers -- plus the supplier's attack-set licence, and for a
        `homogeneous` entry constructs the right-hand side as c_k tau_A from
        the same declared c_k this module emits.
      meat_core_locator: "meat-core/def:homog, which uses def:homog; meat-core/thm:constrained-accumulation"
      this_module: "def:homog; def:eligible (G3); the `constraint_rhs_tag` output row; A-ATK"
      at_d_a_one: >-
        The two readings of gate (G3)(a) differ at d_A = 1, on a general-tagged
        1x1 entry: this module reads it as a type check at every d_A, the
        stricter reading, so such an entry is unlicensed here (rem:degenerate).

    - point: 6
      agreement: "The engine computes the joint-distribution map Eq. eq:jointdist by the same formula."
      meat_core_locator: "meat-core/thm:protocol-channel (ii), (iii); meat-core/def:maps"
      this_module: "def:phi; thm:measurements-and-statistics (iv); rem:phitotal"

    - point: 7
      agreement: >-
        The engine accumulates the completeness sum it re-forms over the
        outcome index in the declared order -- which is the one accumulation
        order that engine's text fixes, and the point is scoped to it:
        meat-core/def:declaration declares a total order as part of the
        declared outcome alphabet V (eq:declorder) and declares an order for no
        other sum. This module emits that order as idxm's component on the
        outcome alphabet, and it travels under the key `label_index_map`.
      meat_core_locator: "meat-core/def:declaration (eq:declorder; the exact-admissibility paragraph); its `alice_marginal` and `alice_povm` input rows"
      this_module: "def:compile (the supplier's order becomes idxm's component); def:exact (S); the `label_index_map` output row; the `summation_order` convention"
      the_other_two_accumulation_rules: >-
        This module's own producer discipline as far as the order goes: the sum
        over sector blocks in the idxm order of S, and the trace over the row
        index of the emitted array in increasing order, which is determinate
        from the array itself and is not carried by idxm. That engine's text
        declares an order for neither.
      the_rounds_nowhere_requirement_is_not_this_modules_alone: >-
        That engine admits tau_A only with its trace summed without rounding
        and {M_x} only with the completeness sum verified to round nowhere (its
        `alice_marginal` and `alice_povm` input rows). So on {M_x} and on tau_A
        the condition is that engine's requirement as well as this module's
        obligation. The sector-block sum is none of the sums those rows name,
        and this module decides it in any case. What this module adds is the
        order, which is what fixes which binary64 sum the condition is about.
      route_c_consequence: >-
        Where a `choice_weighting` is applied, the order emitted on the
        weighted factor's alphabet is the product order of the support V_P, and it is that order
        the engine re-accumulates in. Nothing of the agreement changes: the
        order is still the emitted one and still travels under
        `label_index_map`. Locator: def:compile; def:weighted Eq. eq:support.

# ---------------------------------------------------------------------------
# assumption_ledger
#   The rows of the emitted `assumption_ledger` output key: this module's own
#   assumptions, and those it inherits from the transmitter and from
#   reductions. Short ids and machine keys are repository-wide, so an
#   inherited row carries the owning module's id and key, and a key names one
#   assumption across the repository (A-RHOM's key is
#   `round_homogeneity_declaration` because `round_homogeneity` is the
#   receiver's A-ROUND). Each row carries the short id and the machine key;
#   `owners` names the module an inherited row belongs to, and
#   `emission_rule` says when each row is emitted. What each assumption
#   states, and what fails if it is violated, is its claim file.
#
#   Which claims depend on an assumption, its declarers among them, is a fact
#   about the graph and is named by the command that computes it:
#     python -m harness.check_claims --dependents protocol-compiler/<assumption label>
#   and, for the closure of a theorem,
#     python -m harness.check_claims --assumptions protocol-compiler/<label>
# ---------------------------------------------------------------------------
assumption_ledger:

  emitted_as: "the `assumption_ledger` output key: the machine keys of the rows, each emitted as `emission_rule` says"
  locator: "this file's header (the binding of machine keys); the assumption files (ass:*)"
  the_command: "python -m harness.check_claims --dependents protocol-compiler/<assumption label>"

  own_rows:
    - {id: A-SPEC, machine_key: specification_describes_apparatus}
    - {id: A-ALICE-MEAS, machine_key: alice_measurement_as_declared}
    - {id: A-RHOM, machine_key: round_homogeneity_declaration}
    - {id: A-COIN, machine_key: public_choice_weights}
    - {id: A-LINK, machine_key: reduction_chain_sound}
    - {id: A-ATK, machine_key: attack_set_license}
    - {id: A-IDEAL, machine_key: ideal_qubit_receiver}

  inherited_rows:
    - {id: A-SEQ, machine_key: sequential_round_model}
    - {id: A-ENS, machine_key: source_ensemble}
    - {id: A-SRC, machine_key: source_replacement_license}
    - {id: A-WCP, machine_key: wcp_source_model}

  owners:
    transmitter: [A-SEQ, A-ENS, A-SRC]
    transmitter/decoy: [A-WCP]

  emission_rule:
    always: [A-SPEC, A-RHOM]
    "everywhere but Band A, where the one link is decided to be the identity, supplied as data, with the identity outcome correspondence and, by (C4), the declared family as its target POVM (req:band-a-identity-link), and thm:band-a (v) proves every clause of it, and but a specification with an empty source segment each of whose measured factors has as its receiver segment the single instance link of a reductions artefact of this run, exact, with no channel supplied as data and the identity outcome correspondence, where reductions/thm:emit (iii), thm:chain (i)-(iii) and thm:transfer prove every clause factor by factor and reductions/thm:emitted-product (ii), (iii) with thm:licence (v) jointly, the apparatus measuring the product of the factors' families by A-MEAS (reductions/ass:meas) (iv) (rem:obligations-discharged; req:link-row-provenance)": [A-LINK]
    "whenever a public choice of either form is declared anywhere in the specification: a choice-weighted presentation of Alice's measurement, a choice-weighted physical family of any measured factor, or a `choice_weighting` of any measured factor, whichever party's": [A-COIN]
    "whenever m >= 1 and a key-length-eligible declaration is wanted": [A-ATK]
    "BAND A ONLY": [A-IDEAL]
    "wherever no source-replacement certificate is demanded (untrusted-source mode, or d_A = 1) and the letter alphabet X has at least two letters; at one letter {M_x} is the identity on A and ass:alice-meas holds of every device": [A-ALICE-MEAS]
    "read off the transmitter artefact's own ledger": [A-SEQ, A-ENS, A-SRC, A-WCP]
  binds:
    A-SPEC: "specification -- dimensions, alphabets and tables (ass:spec (i)), with the holder and Zval (ii); receiver_family -- the physical family performed (i); alice_povm -- {M_x}, only where no source-replacement certificate is demanded and X has at least two letters (i)"
    A-ALICE-MEAS: "alice_povm (ass:alice-meas (i)); source_mode, which with d_A decides the clause's scope (the row being emitted only where X has at least two letters)"
    A-RHOM: "specification and source_mode -- what ass:rhom (i) says is the same in every round; the round count is no input of this module"
    A-COIN: "public_choices -- T_pub and q_t of each declared record (ass:coin (i)); choice_weighting -- P(f | t) of each measured factor that declares one (ii); specification -- its announcement tables (iii)"
    A-LINK: "reduction_chain -- every link of either segment, with its type, status, whether it supplies its channel as data and how many entries it transports (ass:link (i)-(iv))"
    A-ATK: "constraint_entries -- the right-hand-side tag of each entry, which decides that the list is licensed (def:homog), the scope of ass:atk; source_mode, likewise; reduction_chain and, where supplied, attack_set_license (ass:atk (i))"
    A-IDEAL: "declared_povm -- the receiver declared directly (ass:ideal (i), (ii)); transmitted_dim (iii)"
    transmitter rows: "the transmitter artefact's own assumption_bindings, copied (transmitter/interface.yaml, outputs.assumption_bindings)"
  binds_note: >-
    Every name is a declared input of this module or a named part of one
    (def:spec): `specification` the five parts' dimensions, alphabets and
    tables; `receiver_family` and `declared_povm` the `receiver_povm` row's
    family per measured factor; `alice_povm`, `source_mode` and
    `transmitted_dim` fields of `transmitter_artifact`; `public_choices`,
    `choice_weighting`, `reduction_chain`, `constraint_entries`,
    and `attack_set_license` the rows of those names. The code is protocol_compiler/compile.py,
    `_assumption_bindings`, whose docstring gives the clause of each name.
    The values are the emitted `assumption_bindings`.
  a_wcp_row_note: >-
    A-WCP is the decoy submodule's physical-source assumption, which a
    transmitter artefact emitted for a weak-coherent-pulse source carries in
    the place of A-ENS (transmitter/def:source-spec (b);
    transmitter/decoy/ass:wcp); the ledger copies it with the rest of that
    artefact's ledger and decides nothing about it.
  a_recv_not_emitted_note: >-
    This module emits no row of reductions/ass:recv (A-RECV), on any route.
    It holds no receiver and no reductions artefact, so it can neither bind
    the supplier's version nor tell an artefact the run built from one
    supplied from outside; the row is the reductions artefact's own, emitted
    or omitted there (reductions/req:assumption-ledger;
    reductions/req:recv-row-provenance), and a run reaches it through the
    ledger rows of each reductions artefact it consumed
    (`not_carried_here`). No claim of this module assumes A-RECV, its own
    results resting on ass:spec, ass:link and the rows above, so no claim is
    left without a premise where the row is absent: a chain written by hand,
    on a run with no reductions artefact, rests on A-LINK for the soundness
    of its links and on A-SPEC for the family presented as performed, which
    this module emits as their emission rules say; on Band A, A-IDEAL and
    A-SPEC.

  not_carried_here: >-
    The reductions module's own ledger. A uses edge into that module's
    definitions or theorems would carry its assumption closure -- A-MEAS
    and A-CONST among them -- into every compiler theorem, thm:band-a
    included, where no reduction ran; so every edge into a reductions
    definition or theorem is a mention save the edges into one lemma
    (design.md, decision 7), and what a run inherits from that module reaches
    its assumption manifest as the ledger rows of each reductions artefact it
    consumed, not through this module's graph (rem:obligations-discharged).
    Where A-LINK and A-ATK are discharged for a chain that module emits is
    rem:obligations-discharged.

never_verified:
  own: [A-SPEC, A-ALICE-MEAS, A-RHOM, A-COIN, A-LINK, A-ATK, A-IDEAL]
  inherited: [A-SEQ, A-ENS, A-SRC, A-WCP]
  note: >-
    `own` and `inherited` hold, of the rows above, those whose assumption
    carries `verification: never` (spec/claim-format.md section 3.2), each
    saying so in its own text; an inherited row carries its owner's field.
    The code reads
    the field from the claim-closure table rather than from these lists, and
    tests/unit/test_never_verified_agree.py holds the lists to it. The
    block restriction of the feasible set is no row: it is a remark
    (rem:block-restriction), proved by meat-core/thm:reduction, step 1. No code
    path of this module may decide more of any of them than its clauses on
    the declared data. For A-ATK and A-SRC the conforming behaviour is a
    presence test and a pass-through (req:attestation-presence), beside the
    type check of A-ATK's licensed class; for A-LINK it is to decide the
    necessary conditions eq:pullback and the transmitter's (S3) where the data
    make them decidable and to record NOT CHECKED, naming A-LINK, where they do
    not; for A-SPEC, A-ALICE-MEAS, A-COIN, A-RHOM and A-IDEAL it
    is to decide what bears on the emitted data (the clauses of
    def:well-formed-spec, the declared weights, the refusal of an
    outcome-dependent weighting) and nothing they say of the apparatus, the
    run or the physical receiver; for A-SEQ, A-ENS and A-WCP there is
    nothing to check at all and the obligation is only named.
  locator: "thm:gates (i), (iii); ass:spec; ass:alice-meas; ass:rhom; ass:coin; ass:link; ass:atk; ass:ideal; rem:block-restriction; transmitter/ass:seq; transmitter/ass:ens; transmitter/rem:boundary; transmitter/decoy/ass:wcp"

# ---------------------------------------------------------------------------
# artifact_bindings
# ---------------------------------------------------------------------------
artifact_bindings:
  mathematical_spec_version: "protocol-compiler@0.23.0"
  version_note: >-
    The pin names the accepted version of this contract whose conditions the
    emitted artefact implements; an artefact may not claim a draft version
    (`outputs.mathematical_spec_version`). The code emits it from one
    constant, `CONTRACT_VERSION` in
    src/certiqs_key/protocol_compiler/declaration.py, and never from a second
    literal. When the pin moves, the
    frozen expectations that spell the string are edited by hand, never
    regenerated from the code. No numerical result depends on the string: it
    appears in no parity column.
  produces_note: >-
    The twenty-three declaration keys of the outputs table are the payload,
    emitted under exactly the names the consuming engine reads -- not the slots
    of eq:declaration, which are fewer (see the outputs header);
    `choice_weighting_record`, `assumption_ledger`, `assumption_bindings`
    and `mathematical_spec_version` travel with them, which is why the
    outputs table of the basic format has twenty-seven rows; the general
    format adds the rows of its own block. No further schema extension is
    authorised.
  consumes_note: >-
    Three artefacts and the declared data of an instance. The transmitter
    artefact (`transmitter_artifact`); the reductions artefact, which delivers
    `reduction_chain`, `target_sectors`, `target_povm`, the transported
    constraint entries and `attack_set_license`; and, through reductions, the
    receiver's -- this module reads the receiver's artefact only for the
    declared coarse-graining it names in prose (rem:coarse, rem:alphabet) and
    consumes no key of it. In Band A the chain is one identity link and the
    receiver family is declared directly, so no artefact edge is exercised
    (thm:band-a).
  package: "src/certiqs_key/protocol_compiler/"
  package_note: >-
    The package realises this interface; which module of it realises which
    claim is design.md, "Where the code is", and each claim's `implements`
    field. The machine keys above are binding for the implementation: the code
    is written onto these names, not the reverse.

# ---------------------------------------------------------------------------
# depends_on_modules
# ---------------------------------------------------------------------------
depends_on_modules: [receiver, reductions, transmitter]
depends_on_modules_note: >-
  As module.yaml declares, with foundations beside them for the number model.
  What is read from each, and it is the traffic of the three-input join:
  transmitter -- the source part of the specification, arriving as one
  artefact whose marginal slot carries the emitted mode, whose POVM and
  alphabet are re-decided here at V2 and V3, whose `source_segment` is the
  chain's source segment, and whose `source_replacement_license` gate (G2)
  consumes; which claims of the transmitter this module uses, and why every
  edge into reductions is a mention, is design.md, decision 7; the edges
  themselves
  are computed by
  `python -m harness.check_claims --module protocol-compiler --graph <out.dot>`.
  Reductions -- the chain record and what travels in it (the target descriptor
  and its sector map, the target POVM with its declared order, the transported
  constraint entries, the licence record, the statuses and the class map of
  the joint alphabet where a setting-dependent weighting is read through it);
  the compiler reads the record and never that module's mathematics, so every
  edge into reductions is a `mentions`, with the compiler's own typing of the
  record stated in its own words; reductions/lem:linear, of whose part (i)
  thm:choice-encoding (vi) is an instance, is one too, the proof of (vi)
  writing the linearity argument out. Receiver -- nothing is read:
  receiver/def:clickalphabet, def:coarse and thm:coarse-graining are
  `mentions` of rem:coarse and rem:alphabet, naming whose the declared
  coarse-graining is and where a finer alphabet is declared. The traffic runs
  the other way for meat-core, which consumes the declaration and which this
  module may not depend on: the conditions it compiles to are this module's
  own definitions and the agreement is `consumer_agreement`.

# ---------------------------------------------------------------------------
# fixed_by_this_file
#   Every place this file says something no claim of this module states, so
#   that a reader can separate what the claims decide from what the interface
#   fixes, and so that an amendment knows which rows it may move without
#   touching a proof. Where a requirement binds what this file chose, the
#   entry says so.
# ---------------------------------------------------------------------------
fixed_by_this_file:

  - row: "inputs.transmitter_artifact (the key name)"
    what: "the machine key `transmitter_artifact` for the record as a whole."
    why: >-
      def:spec (a) names the transmitter artefact in prose only, and the
      transmitter's interface names its output keys but not the record they sit
      in. The field names are the transmitter's.

  - row: "inputs.choice_weighting (the key name and its three field names)"
    what: "`choice_weighting`, and the field names for F, t and P."
    why: >-
      def:weighted and def:compile state the object, its domain, its order, its
      support, its refusals and its position, and name no machine key.

  - row: "outputs.choice_weighting_record"
    what: "the key name and the field list of the recorded weighting."
    why: >-
      req:choice-weighting-record states that the weighting is recorded beside
      the chain record and binds the key this file chose; no claim states the
      fields.

  - row: "outputs.assumption_ledger"
    what: "that a ledger of machine keys is emitted with the declaration, and its shape."
    why: >-
      This file's header says the machine keys bind the implementation; no
      claim says that, and no claim says the ledger as a whole is emitted with
      the declaration. The transmitter and reductions artefacts both emit one and a run manifest is
      assembled from them (spec/architecture.md 4.4), so this module emits one
      too.

  - row: "outputs.assumption_bindings / assumption_ledger.binds"
    what: "the key, its shape, and the names each ledger row binds."
    why: >-
      The assumption files state what each assumption is about and no claim
      states that the values it is about are emitted. Values are bound per
      assumption: every emitter records them, and the names are this file's choice of
      the declared inputs each clause is about.

  - row: "outputs.mathematical_spec_version"
    what: "the key, and that an artefact may not claim a draft version."
    why: >-
      PRINCIPLES.md section 6 and the conventions' artifact_bindings bullet;
      no claim states it.

  - row: "fail_closed.chain_interface_condition_failed / refusal_reasons.chain_interface_condition_failed"
    what: "the refusal string."
    why: >-
      def:chaincond and thm:chain-consumption (i) state that a failing chain
      is refused and spell no string; req:chain-refusals (i) requires that the
      refusal name the condition and binds the spelling this file chose.

  - row: "fail_closed.certificate_conditions (the reason strings)"
    what: >-
      reusing the transmitter's five certificate reason strings for gate (G2)'s
      re-decision, rather than spelling a second set.
    why: >-
      def:eligible (G2) refuses a certificate that fails one of the five
      conditions; row 3 of def:gate-outcome-table and req:gate-outcomes (ii) require that
      the refusal name the condition; none of them spells a string for the
      five. The five conditions are the same five on the same data, so a
      second vocabulary would be two names for one refusal.

  - row: "fail_closed.rows (the order field)"
    what: "the order in which a conforming implementation decides the rules."
    why: >-
      No claim fixes an order across the whole set. What the claims do fix, and
      what the order respects, is that each conditional family of a declared
      choice-weighted presentation, and the representability of the products
      formed from it, are decided before any product is formed and therefore
      before the chain's conditions, which read those products where the
      presentation is the receiver family (def:weighted, def:compile,
      req:conditional-family-decision: row 1 is a claim position and not this
      file's choice); that the chain's conditions are decided before the
      compilation map fills eq:declaration (def:compile takes Q, S and {F_v}
      from the last link); that the setting-dependent weighting is applied
      after the chain and before the validator (rem:relabel); and that the
      gates are decided on the emitted declaration (def:eligible). The rest of
      the order is this file's.

  - row: "conventions.conjugation_basis"
    what: "the whole bullet."
    why: >-
      The datum -- the declared computational basis of A -- is
      transmitter/def:source-spec's, and the worked construction is the BB84
      instance's. No claim of this module states the convention.

  - row: "parameters.alpha and parameters.purifier_dim"
    what: "both rows."
    why: >-
      No claim of this module depends on either, which is what the rows
      themselves say. They are recorded for the consumer.

  - row: "assumption_ledger.emission_rule (the presence rules)"
    what: >-
      the presence rule of each row -- which assumption is emitted always and
      which only under a condition.
    why: >-
      The claim files state what each assumption says and where it is spent;
      they do not state an emission rule for the ledger. The rules follow
      the claims (A-IDEAL is Band A only by its own title; A-ATK is not engaged
      at an empty CList by thm:band-a (iii) and its lead-in; A-LINK is proved of the Band-A
      identity link, decided on the record by req:band-a-identity-link, by thm:band-a (v) and of an in-run reductions chain by the
      theorems rem:obligations-discharged names, its omission there being
      req:link-row-provenance's; A-COIN is engaged only where a choice is
      declared), but the emission rule is this file's.
